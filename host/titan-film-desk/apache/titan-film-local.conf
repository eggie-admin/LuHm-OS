# EXAMPLE ONLY: private Apache HTTPD/2 reverse proxy, not a public vhost.
# Enable proxy and proxy_http modules before adapting to your approved host.
# Bind localhost; Cloudflare Access/Tunnel must be separately configured and tested.
Listen 127.0.0.1:8088
<VirtualHost 127.0.0.1:8088>
    ServerName titan-film.localhost
    ProxyPreserveHost Off
    ProxyPass        / http://127.0.0.1:8786/
    ProxyPassReverse / http://127.0.0.1:8786/
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Forwarded-Host early
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy no-referrer
    <Location "/">
        Require local
    </Location>
</VirtualHost>
