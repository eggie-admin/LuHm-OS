<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuHm Oni Summoner</title>
<link rel="stylesheet" href="jquery.luhmOniSummoner.css">
<style>html,body{margin:0;min-height:100%;background:#05060a}body{padding:12px}</style>
</head>
<body>
<main id="oniSummoner" aria-label="LuHm Oni Summoner"></main>
<script src="../../../vendor/jquery-3.7.1.min.js"></script>
<script src="jquery.luhmOniSummoner.js"></script>
<script>
(function(){
  "use strict";
  const $root=jQuery("#oniSummoner").luhmOniSummoner();
  $root.on("luhm:oni:summon",function(_event,detail){
    $root.luhmOniSummoner("activity",{oni:"Lum",state:"WAITING",taskId:"DEMO_ONLY",sourceRef:"UNKNOWN",summary:"Demo received a summon request for "+detail.name+". No executor is connected in this standalone preview."});
  });
}());
</script>
</body>
</html>
