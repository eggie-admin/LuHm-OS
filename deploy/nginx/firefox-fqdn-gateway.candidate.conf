# LuHm OS Firefox FQDN gateway, SOURCE CANDIDATE ONLY.
# DO NOT ENABLE until certificates, identity verifier, web/API origins and DNS are proven.
# NGINX configuration is intended in http{} context, not on Render Python hosting.
# No database listener, MCP rewrite, Cloudflare change or external workstation port.
limit_req_zone $binary_remote_addr zone=luhmLogin:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=luhmApi:10m rate=10r/s;

# Default vhosts fail closed: unknown Host headers must never reach login or APIs.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    return 421;
}

server {
    listen 80;
    server_name eggiebagelface.art www.eggiebagelface.art api.eggiebagelface.art;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name eggiebagelface.art www.eggiebagelface.art;
    ssl_certificate /etc/luhm/tls/fullchain.pem;
    ssl_certificate_key /etc/luhm/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
    # HSTS and CSP need separate live compatibility proof; do not preload.

    location = /__luhm_auth {
        internal;
        proxy_pass http://127.0.0.1:8790/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /login {
        limit_req zone=luhmLogin burst=3 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /oauth/callback {
        limit_req zone=luhmLogin burst=3 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /logout {
        limit_req zone=luhmLogin burst=3 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location @login_required {
        return 302 /login;
    }
    location /api/v1/ {
        limit_req zone=luhmApi burst=20 nodelay;
        auth_request /__luhm_auth;
        auth_request_set $verified_principal $upstream_http_x_luhm_principal;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8787/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-LuHm-Principal $verified_principal;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_redirect off;
    }
    location / {
        auth_request /__luhm_auth;
        error_page 401 = @login_required;
        auth_request_set $verified_principal $upstream_http_x_luhm_principal;
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header Host $host;
        proxy_set_header X-LuHm-Principal $verified_principal;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_redirect off;
    }
}

# Dedicated API FQDN remains an optional bearer-auth machine entry.
# The auth verifier MUST deny invalid/expired tokens; no permissive stub.
server {
    listen 443 ssl;
    server_name api.eggiebagelface.art;
    ssl_certificate /etc/luhm/tls/fullchain.pem;
    ssl_certificate_key /etc/luhm/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    location = /__luhm_auth {
        internal;
        proxy_pass http://127.0.0.1:8790/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /v1/ {
        limit_req zone=luhmApi burst=20 nodelay;
        auth_request /__luhm_auth;
        auth_request_set $verified_principal $upstream_http_x_luhm_principal;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-LuHm-Principal $verified_principal;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_redirect off;
    }
    location / { return 404; }
}
