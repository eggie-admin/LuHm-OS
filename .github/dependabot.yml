# Propose upstream dependency updates on protected source; never auto-merge or deploy.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontEnd
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pinned-frontend-proposals:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /frontEnd/prototypes/glassWorld
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      glass-world-proposals:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: gradle
    directory: /androidWeb3Plugin
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      ci-action-proposals:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
