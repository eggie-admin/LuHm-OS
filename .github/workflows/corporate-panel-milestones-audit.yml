name: Corporate Panel Milestones Audit

on:
  pull_request:
    paths:
      - 'doctrine/corporatePanelMilestonesV1.json'
      - 'doctrine/enterpriseOrientationBridgeV1.json'
      - 'doctrine/openingDayStaffTrainingV1.json'
      - 'doctrine/providerEconomyV1.json'
      - 'doctrine/currentSourceTruthV3.json'
      - 'tools/corporatePanelMilestonesAudit.py'
      - '.github/workflows/corporate-panel-milestones-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corporate-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit corporate milestones
        run: python3 tools/corporatePanelMilestonesAudit.py
