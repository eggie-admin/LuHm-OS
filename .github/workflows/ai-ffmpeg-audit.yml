name: ai-ffmpeg-source-audit
on:
  pull_request:
    paths:
      - 'host/ai-ffmpeg/**'
      - 'tests/test-ai-ffmpeg.py'
      - 'tests/test-pirate-production-continuity.py'
      - 'scripts/ai-ffmpeg-user-service.sh'
      - 'scripts/ai-ffmpeg-codespaces.sh'
      - '.devcontainer/devcontainer.json'
      - 'manual/ai-ffmpeg-local-first.md'
      - 'media/pirate-daddy-film/episode-template.json'
      - 'media/pirate-daddy-film/production-workflow-template.md'
      - '.github/workflows/ai-ffmpeg-audit.yml'
      - 'doctrine/artistFirstProductionWorkflowV1.json'
      - 'tests/test-artist-workflow-contract.py'
      - 'agents/yumeArtOni/SKILL.md'
      - 'agents/mediaAssetFactory/SKILL.md'
      - 'plugins/luhm-os/skills/luhm-agent-workflow/SKILL.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-ffmpeg-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-render-negative-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify manifest and Python syntax
        run: |
          python3 -m json.tool media/pirate-daddy-film/episode-template.json > /dev/null
          python3 -m json.tool doctrine/artistFirstProductionWorkflowV1.json > /dev/null
          python3 tests/test-artist-workflow-contract.py
          python3 -m py_compile host/ai-ffmpeg/ai-ffmpeg.py tests/test-ai-ffmpeg.py tests/test-pirate-production-continuity.py
          python3 tests/test-pirate-production-continuity.py
          bash -n scripts/ai-ffmpeg-user-service.sh
          bash -n scripts/ai-ffmpeg-codespaces.sh
          python3 -m json.tool .devcontainer/devcontainer.json > /dev/null
      - name: Host capabilities (not remote GPU proof)
        run: python3 host/ai-ffmpeg/ai-ffmpeg.py doctor
      - name: Negative controls and silent seven-shot remote proof
        env:
          LUHM_FFMPEG_PROOF_DIR: ${{ runner.temp }}/ai-ffmpeg-proof
        run: python3 tests/test-ai-ffmpeg.py
      - name: Upload remote FFmpeg sample MP4 and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pirate-daddy-synthetic-ffmpeg-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/ai-ffmpeg-proof/
          if-no-files-found: error
          retention-days: 3
