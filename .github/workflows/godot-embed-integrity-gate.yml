name: Godot Embedded 3D Integrity Gate
on:
  pull_request:
    paths:
      - 'host/mcp/luhmHarness.py'
      - 'host/harness/cockpit.js'
      - 'host/harness/godotPlayerWidget.html'
      - 'publicationSite/pocketLab.html'
      - 'tools/godotEmbedReadinessAudit.py'
      - '.github/workflows/godot-embed-integrity-gate.yml'
permissions:
  contents: read
jobs:
  source-and-negative-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check exact local Web bundle verifier and iframe ownership
        run: |
          python3 tools/godotEmbedReadinessAudit.py
          python3 -m py_compile host/mcp/luhmHarness.py tools/godotEmbedReadinessAudit.py
          python3 tools/godotBrowserSmoke.py --self-test
