name: Premonition Vendor Footprint Gate
on:
  pull_request:
    paths:
      - 'doctrine/vendorReductionV1.json'
      - 'doctrine/hardwareVendorMinimumV1.json'
      - 'doctrine/processorHexCeilingsV1.json'
      - 'doctrine/computeFourCoreV1.json'
      - 'tools/computeFourCoreAudit.py'
      - 'tools/castMachineByteAudit.py'
      - 'doctrine/castIndustryArchitectureReductionV1.json'
      - 'tools/castIndustryArchitectureAudit.py'
      - 'tests/testCastIndustryArchitectureAudit.py'
      - 'manual/cast-industry-architecture-reduction-20261031.md'
      - 'tests/testCastMachineByteAudit.py'
      - 'tests/testComputeFourCoreAudit.py'
      - 'manual/computeFourCore4x4.md'
      - '.devcontainer/Dockerfile.compute'
      - '.devcontainer/compute/**'
      - 'tools/processorHexCeilingBench.py'
      - 'tests/testProcessorHexCeilingBench.py'
      - 'manual/processorHexCeiling4x4.md'
      - 'tools/hardwareVendorMinimum.py'
      - 'tests/testHardwareVendorMinimum.py'
      - 'manual/hardwareVendorFourByFour.md'
      - '.devcontainer/Dockerfile'
      - 'tools/vendorReductionAudit.py'
      - 'tests/testVendorReduction.py'
      - 'manual/vendor-reduction.md'
      - 'frontEnd/prototypes/glassWorld/**'
      - '.github/workflows/premonition-vendor-reduction-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vendor-footprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "HW_VENDOR_EXACT_SOURCE_REF=$actual"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify profile and run source negative tests
        run: |
          python3 -m json.tool doctrine/vendorReductionV1.json > /dev/null
          python3 -m py_compile tools/vendorReductionAudit.py
          python3 -m unittest discover -s tests -p 'testVendorReduction.py' -v
      - name: Audit hardware profiles and minimum Ubuntu package declarations
        run: |
          python3 -m unittest discover -s tests -p 'testHardwareVendorMinimum.py' -v
          python3 tools/hardwareVendorMinimum.py --profile samsungCockpit
          python3 tools/hardwareVendorMinimum.py --profile linuxStudio
      - name: CAST bounded processor byte-ceiling benchmark
        run: |
          python3 -m unittest discover -s tests -p 'testProcessorHexCeilingBench.py' -v
          python3 tools/processorHexCeilingBench.py --measure --output "${RUNNER_TEMP}/processor-hex/receipt.json"
          python3 - "${RUNNER_TEMP}/processor-hex/receipt.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["status"]=="AMBER_RUNNER_MEASURED_ONLY"
          assert r["sourceRoutes"]==16 and r["runnerBenchmarked"] is True
          assert r["microbench"]["advisoryOnly"] is True
          assert r["androidDeviceBenchmarked"] is False
          assert not r["kernelMutations"] and not r["networkMutations"] and r["crownStatus"]=="STOP"
          print("CAST_PROCESSOR_BOUNDED_RUNNER_MEASURED_NOT_DEVICE")
          PY
      - name: CAST GPU CPU memory firmware compute-only audit
        run: |
          python3 -m unittest discover -s tests -p 'testComputeFourCoreAudit.py' -v
          python3 tools/computeFourCoreAudit.py --probe-runner > "${RUNNER_TEMP}/compute-four-core.json"
          python3 - "${RUNNER_TEMP}/compute-four-core.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf8"))
          assert r["status"]=="AMBER_RUNNER_HINTS_ONLY"
          assert r["matrixCells"]==16 and r["computePackages"]==11 and r["serverPackages"]==0
          assert r["runnerHints"]["hostSettingsModified"] is False
          assert r["runnerHints"]["gpuHardwareAccelerationVerified"] is False
          assert r["physicalGpuTested"] is False and r["physicalFirmwareTested"] is False
          assert r["actualDockerBuild"] is False and r["crownStatus"]=="STOP"
          print("CAST_COMPUTE_4X4_SOURCE_AND_RUNNER_HINTS_NOT_DEVICE_PROOF")
          PY
      - name: CAST bounded application bytes, SHA and priority SQL machine audit
        run: |
          python3 -m unittest discover -s tests -p 'testCastMachineByteAudit.py' -v
          python3 tools/castMachineByteAudit.py > "${RUNNER_TEMP}/cast-machine-boundary.json"
          python3 - "${RUNNER_TEMP}/cast-machine-boundary.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r['status']=='AMBER_SOURCE_ONLY'
          assert len(r['matrix']['logicalCells'])==16 and r['matrix']['cellsPhysicallyProven']==0
          assert r['sql']['sqlite']=='IN_MEMORY_STRICT' and r['sql']['serviceOpened'] is False
          assert not r['kernelChanged'] and not r['physicalDeviceVerified']
          assert r['crownStatus']=='STOP'
          print('CAST_MACHINE_BYTE_PRIORITY_SOURCE_ONLY')
          PY
      - name: CAST Apple Android Linux Google industry and lifecycle source audit
        run: |
          python3 -m unittest discover -s tests -p 'testCastIndustryArchitectureAudit.py' -v
          python3 tools/castIndustryArchitectureAudit.py > "${RUNNER_TEMP}/cast-industry-architecture.json"
          python3 - "${RUNNER_TEMP}/cast-industry-architecture.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r['status']=='AMBER_SOURCE_REVIEW_ONLY' and r['matrixCells']==16
          assert r['platforms']==4 and r['functionClasses']==4
          assert 'Python 3.10' in r['observedExpired']
          assert not r['kernelModified'] and not r['bootDiskModified']
          assert r['crownStatus']=='STOP'
          print('CAST_INDUSTRY_ARCHITECTURE_REVIEW_ONLY')
          PY
      - name: Build web candidate with exact dependency lock
        working-directory: frontEnd/prototypes/glassWorld
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Measure exact-source asset budgets and report manifest
        run: |
          python3 tools/vendorReductionAudit.py --dist frontEnd/prototypes/glassWorld/dist --output "${RUNNER_TEMP}/vendor-reduction/receipt.json"
          python3 - "${RUNNER_TEMP}/vendor-reduction/receipt.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          assert data["verdict"]=="AMBER_SOURCE_ONLY"
          assert data["build"]["mainJavaScriptBytes"] < 1600000
          assert data["apkSigned"]=="UNVERIFIED"
          assert data["crownStatus"]=="STOP"
          print("VENDOR_FOOTPRINT_SOURCE_BUDGET_GREEN_RUNTIME_UNKNOWN")
          PY
      - name: Upload measured BOM and bundle receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: premonition-vendor-reduction-receipt
          path: |
            ${{ runner.temp }}/vendor-reduction/
            ${{ runner.temp }}/processor-hex/
            ${{ runner.temp }}/compute-four-core.json
            ${{ runner.temp }}/cast-machine-boundary.json
            ${{ runner.temp }}/cast-industry-architecture.json
          retention-days: 14
          if-no-files-found: warn
