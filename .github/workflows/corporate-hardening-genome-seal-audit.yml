name: Corporate Hardening Genome Seal Audit

on:
  pull_request:
    paths:
      - "doctrine/corporateHardeningCrownReceiptV1.json"
      - "doctrine/semanticDomainHardeningV1.json"
      - "doctrine/belldandyPkiCorporateSecretaryV1.json"
      - "doctrine/corporateEscalationProfileV1.json"
      - "doctrine/currentSourceTruthV3.json"
      - "tools/corporateHardeningGenomeSealAudit.py"
      - ".github/workflows/corporate-hardening-genome-seal-audit.yml"
  push:
    branches:
      - "candidate/**"
    paths:
      - "doctrine/corporateHardeningCrownReceiptV1.json"
      - "doctrine/semanticDomainHardeningV1.json"
      - "doctrine/belldandyPkiCorporateSecretaryV1.json"
      - "doctrine/corporateEscalationProfileV1.json"
      - "doctrine/currentSourceTruthV3.json"
      - "tools/corporateHardeningGenomeSealAudit.py"
      - ".github/workflows/corporate-hardening-genome-seal-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run corporate hardening genome seal audit
        run: python3 tools/corporateHardeningGenomeSealAudit.py
