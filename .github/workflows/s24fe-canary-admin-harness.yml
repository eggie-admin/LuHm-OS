name: Samsung S24FE Canary Admin Harness

on:
  workflow_dispatch:
  push:
    branches: ['candidate/s24fe-canary-admin-harness-20260926']
  pull_request:
    paths:
      - 'native/kaiwebview/**'
      - 'cockpit/**'
      - 'doctrine/s24feCanaryAdminHarness-20260926.json'
      - 'tools/auditSamsungHarness.py'
      - 'scripts/buildSamsungHarness.sh'
      - '.github/workflows/s24fe-canary-admin-harness.yml'
      - 'project.godot'
      - 'export_presets.cfg'

permissions:
  contents: read

jobs:
  samsung-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Build and 10-pass audit Samsung harness
        shell: bash
        run: bash scripts/buildSamsungHarness.sh

      - name: Upload Samsung harness proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhm-s24fe-canary-admin-harness-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/android/
          if-no-files-found: error
          retention-days: 14
