name: Professor CAST Bridge Audit

on:
  pull_request:
    paths:
      - '.github/workflows/professor-cast-bridge.yml'
      - '.github/workflows/professor-cast-bridge-audit.yml'
      - 'tools/professorCastBridgeAudit.py'
      - 'doctrine/PROFESSOR_CAST_BRIDGE_V1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check

      - name: Audit CAST bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/professorCastBridgeAudit.py
