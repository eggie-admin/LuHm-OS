name: Professor CAST Bridge Audit

on:
  pull_request:
    paths:
      - '.github/workflows/professor-cast-bridge.yml'
      - '.github/workflows/public-plugin-package-cast.yml'
      - '.github/workflows/professor-cast-bridge-audit.yml'
      - 'tools/professorCastBridgeAudit.py'
      - 'tools/castStudioGroundZeroChainAudit.py'
      - 'doctrine/castStudioGroundZeroChainV1.json'
      - 'tools/chatGptPluginCastCompletionAudit.py'
      - 'doctrine/PROFESSOR_CAST_BRIDGE_V1.json'
      - 'doctrine/chatGptPluginCastCompletionV1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check

      - name: Audit CAST bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/professorCastBridgeAudit.py

      - name: Audit current-chat plugin CAST completion
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/chatGptPluginCastCompletionAudit.py

      - name: Audit three-level device root and seven-step CAST round trip
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/castStudioGroundZeroChainAudit.py
          python3 tools/castStudioGroundZeroChainAudit.py --self-test
          python3 tools/castStudioGroundZeroChainAudit.py             --source-ref "$(git rev-parse HEAD)"             --scope-id professor/cast-studio-root > /tmp/castStudioRoot.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/castStudioRoot.json').read_text())
          assert result['taskCount']==7
          assert [t['layer'] for t in result['tasks']]==[0,1,2,3,2,1,0]
          mobile=result['mobileComposition']
          assert [x['index'] for x in mobile['threeLevels']]==[0,1,2]
          assert mobile['fourthNote']=='ground-zero-reprise'
          assert mobile['iphoneCanExecuteApk'] is False
          assert mobile['nativeInstallSilentWithoutManagement'] is False
          assert mobile['livePlatformProof'] is False
          assert result['buildDispatched'] is False
          assert result['crownStatus']=='STOP'
          print('CAST_COMPOSITION_SOURCE_PROOF_ONLY_CROWN_STOP')
          PY
