name: Blender Cockpit Runtime Smoke
on:
  pull_request:
    paths:
      - 'host/blender/**'
      - '.github/workflows/blender-cockpit-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blender-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install Blender runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends blender
      - name: Register panel and execute tool probe in real Blender
        run: blender --background --factory-startup --python-exit-code 1 --python host/blender/luhm-cockpit.py -- --luhm-selftest
