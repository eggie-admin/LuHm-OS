name: CAST Milestone Delivery Source Audit

on:
  pull_request:
    paths:
      - 'doctrine/forgeTwinsV3.json'
      - 'manual/castMilestoneRecovery20261012.md'
      - 'tools/castMilestoneDeliveryAudit.py'
      - '.github/workflows/castMilestoneDeliveryAudit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" == "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
      - name: Validate CAST delivery source without builds or deploys
        run: |
          python3 -m json.tool doctrine/forgeTwinsV3.json >/dev/null
          python3 -m py_compile tools/castMilestoneDeliveryAudit.py
          python3 tools/castMilestoneDeliveryAudit.py
