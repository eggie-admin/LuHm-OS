name: LuHm Agent Workflow Hardening Audit

on:
  push:
    branches:
      - 'feature/oni-pet-activity-dock-v2-20260927'
  pull_request:
    paths:
      - 'agents/**'
      - 'doctrine/**'
      - 'host/mcp/**'
      - 'host/openai/**'
      - 'plugins/luhm-os/**'
      - '.agents/plugins/**'
      - 'native/kaiwebview/**'
      - 'cockpit/**'
      - 'tools/lumAgentWorkflowAudit.py'
      - 'tools/lumBossOniSmoke.py'
      - 'tools/lumTaskRouter.py'
      - 'scripts/agentMeshRuntime.py'
      - '.github/workflows/luhm-agent-workflow-audit.yml'

permissions:
  contents: read

concurrency:
  group: luhm-agent-workflow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  luhm-agent-workflow-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source
        run: |
          set -euo pipefail
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
          echo "EXACT_SOURCE=$ACTUAL"
      - name: Python syntax
        run: |
          python3 -m py_compile host/mcp/luhmMcpServer.py host/openai/lumHost.py tools/lumAgentWorkflowAudit.py tools/lumBossOniSmoke.py tools/lumTaskRouter.py scripts/agentMeshRuntime.py
      - name: JSON contracts
        run: |
          python3 -m json.tool doctrine/SOURCE_OF_TRUTH.json >/dev/null
          python3 -m json.tool doctrine/ONI_MESH_CONTROL_PLANE_V2.json >/dev/null
          python3 -m json.tool doctrine/openAiLumOniDeployment-20260927.json >/dev/null
          python3 -m json.tool plugins/luhm-os/plugin.json >/dev/null
          python3 -m json.tool plugins/luhm-os/mcp.json >/dev/null
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
      - name: WebGlass proof syntax
        run: |
          node --check cockpit/jquery/luhm.deck.js
          node --check cockpit/jquery/luhm.proof.viewer.js
          node --check cockpit/app.js
      - name: Deterministic doctrine and security audit
        run: python3 tools/lumAgentWorkflowAudit.py
      - name: Boss to mini Oni deterministic smoke
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/lumBossOniSmoke.py
      - name: Install pinned MCP SDK
        run: python3 -m pip install --disable-pip-version-check -r host/mcp/requirements.txt
      - name: MCP source self-check
        run: python3 host/mcp/luhmMcpServer.py --check
