name: Machine SQL Byte Ledger Audit
on:
  pull_request:
    paths:
      - 'tools/machineSqlByteLedger.py'
      - 'tests/testMachineSqlByteLedger.py'
      - '.github/workflows/machine-sql-byte-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'testMachineSqlByteLedger.py' -v
