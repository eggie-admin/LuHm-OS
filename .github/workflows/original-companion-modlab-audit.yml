name: Original Companion Mod Lab Source Audit
on:
  pull_request:
    paths:
      - 'scripts/game/companionAffinityState.gd'
      - 'scripts/game/companionModLab.gd'
      - 'scripts/game/gameHud.gd'
      - 'scripts/main.gd'
      - 'scenes/CompanionModLab.tscn'
      - 'tests/companionModLabSmoke.gd'
      - 'game/demo/modInspirationCatalogV1.json'
      - 'game/demo/originalCompanionProfilesV1.json'
      - 'tools/modInspirationAudit.py'
      - '.github/workflows/original-companion-modlab-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python3 tools/modInspirationAudit.py
      - name: Download pinned Godot editor
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          mkdir /tmp/godot && unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Godot parse and companion interaction smoke
        run: |
          set -euo pipefail
          godot=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$godot" --headless --editor --path . --quit 2>&1 | tee /tmp/modlab-parse.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script' /tmp/modlab-parse.log
          timeout 45s "$godot" --headless --path . --script res://tests/companionModLabSmoke.gd 2>&1 | tee /tmp/modlab-smoke.log
          grep -Fq COMPANION_MODLAB_SMOKE_GREEN /tmp/modlab-smoke.log
