name: Yume Provider Beta Audit

on:
  pull_request:
    branches:
      - beta/yumeArtChatV1-20261002
  push:
    branches:
      - beta/yumeArtChatV1-20261002
    paths:
      - "agents/yumeArtOni/**"
      - "agents/shared/huggingFaceCapabilityLawV1.md"
      - "agents/lum/SKILL.md"
      - "agents/urdMutationOni/SKILL.md"
      - "agents/belldandyQualityOni/SKILL.md"
      - "agents/skuldResearchOni/SKILL.md"
      - "agents/sumiAssetOni/SKILL.md"
      - "agents/momoResearchOni/SKILL.md"
      - "agents/shioriCriticOni/SKILL.md"
      - "agents/kiriContextOni/SKILL.md"
      - "doctrine/yumeArtChatBetaV1.json"
      - "doctrine/yumeArtSchemaV1.json"
      - "doctrine/providerOrchestraV1.json"
      - "doctrine/googleSentryAuthV1.json"
      - "doctrine/huggingFaceArtUtilityV1.json"
      - "host/providers/**"
      - "host/mcp/requirements.txt"
      - "host/mcp/luhmHarness.py"
      - "host/harness/widget.html"
      - "plugins/luhm-os/mcp.json"
      - "frontEnd/index.html"
      - "frontEnd/app.js"
      - "frontEnd/package.json"
      - "frontEnd/styles.css"
      - "frontEnd/jquery/luhmYumeBooth.js"
      - ".github/copilot-instructions.md"
      - "tools/yumeProviderBetaAudit.py"
      - ".github/workflows/yumeProviderBetaAudit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile and audit Yume provider beta
        run: |
          python tools/yumeProviderBetaAudit.py


  deployBeta:
    name: Deploy Yume beta after GREEN audit
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/beta/yumeArtChatV1-20261002'
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      renderDeployHook: ${{ secrets.RENDER_YUME_BETA_DEPLOY_HOOK }}
    steps:
      - name: Check one-time Render hook configuration
        id: renderHook
        shell: bash
        run: |
          if [ -z "${renderDeployHook}" ]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::RENDER_YUME_BETA_DEPLOY_HOOK is not configured; source audit is GREEN but automated Render deployment is not armed."
          else
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Deploy exact audited SHA to Render
        if: steps.renderHook.outputs.configured == 'true'
        shell: bash
        env:
          sourceSha: ${{ github.sha }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --max-time 30             --request POST "${renderDeployHook}?ref=${sourceSha}"

      - name: Deployment status summary
        shell: bash
        run: |
          {
            echo "## Yume beta deployment"
            echo ""
            echo "- audited SHA: `${GITHUB_SHA}`"
            if [ "${{ steps.renderHook.outputs.configured }}" = "true" ]; then
              echo "- Render deploy hook: triggered"
            else
              echo "- Render deploy hook: waiting for one-time secret configuration"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
