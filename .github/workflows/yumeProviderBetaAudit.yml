name: Yume Provider Beta Audit

on:
  push:
    branches:
      - beta/yumeArtChatV1-20261002
    paths:
      - "agents/yumeArtOni/**"
      - "agents/shared/huggingFaceCapabilityLawV1.md"
      - "agents/lum/SKILL.md"
      - "agents/urdMutationOni/SKILL.md"
      - "agents/belldandyQualityOni/SKILL.md"
      - "agents/skuldResearchOni/SKILL.md"
      - "agents/sumiAssetOni/SKILL.md"
      - "agents/momoResearchOni/SKILL.md"
      - "agents/shioriCriticOni/SKILL.md"
      - "agents/kiriContextOni/SKILL.md"
      - "doctrine/yumeArtChatBetaV1.json"
      - "doctrine/yumeArtSchemaV1.json"
      - "doctrine/providerOrchestraV1.json"
      - "doctrine/googleSentryAuthV1.json"
      - "doctrine/huggingFaceArtUtilityV1.json"
      - "host/providers/**"
      - "host/mcp/requirements.txt"
      - "host/mcp/luhmHarness.py"
      - "host/harness/widget.html"
      - "frontEnd/index.html"
      - "frontEnd/app.js"
      - "frontEnd/styles.css"
      - "frontEnd/jquery/luhmYumeBooth.js"
      - ".github/copilot-instructions.md"
      - "tools/yumeProviderBetaAudit.py"
      - ".github/workflows/yumeProviderBetaAudit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile and audit Yume provider beta
        run: |
          python tools/yumeProviderBetaAudit.py
