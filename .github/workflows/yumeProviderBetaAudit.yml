name: Yume Provider Beta Audit

on:
  push:
    branches:
      - beta/yumeArtChatV1-20261002
    paths:
      - "agents/yumeArtOni/**"
      - "doctrine/yumeArtChatBetaV1.json"
      - "doctrine/yumeArtSchemaV1.json"
      - "doctrine/providerOrchestraV1.json"
      - "doctrine/googleSentryAuthV1.json"
      - "doctrine/huggingFaceArtUtilityV1.json"
      - "host/providers/**"
      - "host/mcp/requirements.txt"
      - ".github/copilot-instructions.md"
      - "tools/yumeProviderBetaAudit.py"
      - ".github/workflows/yumeProviderBetaAudit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile and audit Yume provider beta
        run: |
          python tools/yumeProviderBetaAudit.py
