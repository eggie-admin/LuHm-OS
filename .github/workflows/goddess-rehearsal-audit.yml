name: Goddess Rehearsal Canon and Godot Parse Audit

on:
  pull_request:
    paths:
      - 'scripts/game/goddessRehearsal.gd'
      - 'scripts/game/gameHud.gd'
      - 'scripts/main.gd'
      - 'scenes/GoddessRehearsal.tscn'
      - 'tests/goddessDirectTapSmoke.gd'
      - 'scenes/LumAvatar.tscn'
      - 'scripts/game/lumAvatar.gd'
      - 'game/canon/CHARACTER_CANON_V1.json'
      - 'game/assets/ASSET_MANIFEST_V1.json'
      - 'doctrine/goddessGodotCanonHandoffV1.json'
      - 'tools/goddessGodotCanonHandoffAudit.py'
      - '.github/workflows/goddess-rehearsal-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goddess-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Canon and rehearsal source proof
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/goddessGodotCanonHandoffAudit.py
          python3 tools/godotGameSourceAudit.py
          test -s scenes/GoddessRehearsal.tscn
          test -s scripts/game/goddessRehearsal.gd
          grep -Fq 'rehearsal_requested.connect(_enter_goddess_rehearsal)' scripts/main.gd
          grep -Fq 'rehearsal_requested.emit()' scripts/game/gameHud.gd
          grep -Fq 'res://scripts/game/goddessRehearsal.gd' scenes/GoddessRehearsal.tscn
      - name: Download pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Parse the standalone Goddess scene
        shell: bash
        run: |
          set -euo pipefail
          godot=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          set +e
          "$godot" --headless --editor --path . --quit 2>&1 | tee /tmp/goddess-parse.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script' /tmp/goddess-parse.log; then
            echo GODDESS_SCENE_PARSE_RED
            exit 1
          fi
          echo GODDESS_SCENE_PARSE_GREEN

      - name: Launch standalone Goddess rehearsal scene
        shell: bash
        run: |
          set -euo pipefail
          godot=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          set +e
          timeout 45s "$godot" --headless --path . --quit-after 30 res://scenes/GoddessRehearsal.tscn 2>&1 | tee /tmp/goddess-startup.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|Missing character canon|Invalid character canon|Missing canonical character' /tmp/goddess-startup.log; then
            echo GODDESS_REHEARSAL_STARTUP_RED
            exit 1
          fi
          echo GODDESS_REHEARSAL_STARTUP_GREEN

      - name: Verify four Goddesses respond to touch and mouse selections
        shell: bash
        run: |
          set -euo pipefail
          godot=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          set +e
          timeout 45s "$godot" --headless --path . --script res://tests/goddessDirectTapSmoke.gd 2>&1 | tee /tmp/goddess-tap.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          grep -Fq GODDESS_DIRECT_TAP_SMOKE_GREEN /tmp/goddess-tap.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|RED_GODDESS_TAP' /tmp/goddess-tap.log; then
            echo GODDESS_DIRECT_TAP_RED
            exit 1
          fi
          echo GODDESS_DIRECT_TAP_GREEN

      - name: Stage hash-pinned Lum donor for rehearsal-only CI
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=/tmp/goddess-lum-verified.zip
          OUT=/tmp/goddess-lum-staging
          DRIVE_ID='1FenqwXoCWTkcwvv-2ANUloMaTC7zVSen'
          BUNDLE_SHA='fedaf37220d5f9477560fdc0b5624d30e95191db989f5b8428ca4d1a19b1d3da'
          BASE_SHA='06bdfcc196e147c4cb92c7c5489110a8feb30ee8a8f362fac585802eced33b69'
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            -A 'Mozilla/5.0 LuHmOS-CI' -o "$BUNDLE" \
            "https://drive.usercontent.google.com/download?id=${DRIVE_ID}&export=download&confirm=t"
          echo "$BUNDLE_SHA  $BUNDLE" | sha256sum -c -
          python3 tools/godotDriveLibraryIntakeAudit.py --bundle "$BUNDLE"
          mkdir -p "$OUT" assets/lum
          unzip -q "$BUNDLE" -d "$OUT"
          BASE="$OUT/Meshy_AI_Lum_Midnight_1996_biped/Meshy_AI_Lum_Midnight_1996_biped_Character_output.glb"
          echo "$BASE_SHA  $BASE" | sha256sum -c -
          cp "$BASE" assets/lum/luhm.glb

      - name: Import Lum GLB with pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          godot=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$godot" --headless --editor --path . --quit 2>&1 | tee /tmp/goddess-rig-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script' /tmp/goddess-rig-import.log; then
            echo GODDESS_REAL_LUM_IMPORT_RED
            exit 1
          fi

      - name: Verify actual 24-bone Lum rig in four-Goddess rehearsal
        shell: bash
        run: |
          set -euo pipefail
          godot=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          set +e
          timeout 60s "$godot" --headless --path . --script res://tests/goddessDirectTapSmoke.gd 2>&1 | tee /tmp/goddess-rig-stage.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          grep -Fq GODDESS_LUM_RIG_IN_REHEARSAL_GREEN /tmp/goddess-rig-stage.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|RED_GODDESS_TAP' /tmp/goddess-rig-stage.log; then
            echo GODDESS_REAL_LUM_STAGE_RED
            exit 1
          fi
          echo GODDESS_REAL_LUM_STAGE_GREEN
