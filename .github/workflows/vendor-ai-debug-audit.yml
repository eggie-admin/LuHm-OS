name: Vendor AI Debug + Magic Roleplay Audit

on:
  pull_request:
    paths:
      - 'doctrine/vendorAiDebugV1.json'
      - 'doctrine/luhmChatMagicTriggerV1.json'
      - 'doctrine/currentSourceTruthV3.json'
      - 'doctrine/projectChatCanonV1.json'
      - 'agents/witchingHourCoding/SKILL.md'
      - 'frontEnd/jquery/luhm.cockpit.js'
      - 'frontEnd/tools/check.mjs'
      - 'tools/vendorAiDebug.py'
      - 'tools/vendorAiDebugAudit.py'
      - '.github/workflows/vendor-ai-debug-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate contracts
        run: |
          python3 -m json.tool doctrine/vendorAiDebugV1.json >/dev/null
          python3 -m json.tool doctrine/luhmChatMagicTriggerV1.json >/dev/null
          python3 -m py_compile tools/vendorAiDebug.py tools/vendorAiDebugAudit.py
      - name: Audit vendor debug + magic roleplay
        run: python3 tools/vendorAiDebugAudit.py
      - name: Debug snapshot smoke
        run: |
          python3 tools/vendorAiDebug.py openai
          python3 tools/vendorAiDebug.py google
          python3 tools/vendorAiDebug.py copilot
          python3 tools/vendorAiDebug.py huggingface
          python3 tools/vendorAiDebug.py edge
