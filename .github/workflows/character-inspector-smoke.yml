name: Character Inspector Runtime Gate
on:
  pull_request:
    paths:
      - 'scripts/game/characterInspector.gd'
      - 'scripts/main.gd'
      - 'scenes/CharacterInspector.tscn'
      - 'tests/characterInspectorSmoke.gd'
      - 'host/harness/cockpit.js'
      - 'host/harness/index.html'
      - '.github/workflows/character-inspector-smoke.yml'
permissions:
  contents: read
jobs:
  inspector:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify engine and run exact-source inspection smoke
        shell: bash
        env:
          expectedHead: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$expectedHead"
          git diff --check
          curl -fL --retry 2 -o /tmp/inspector-godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/inspector-godot.zip' | sha256sum -c -
          mkdir -p /tmp/inspector-godot
          unzip -q /tmp/inspector-godot.zip -d /tmp/inspector-godot
          engine=/tmp/inspector-godot/Godot_v4.7.2-stable_linux.x86_64
          chmod +x "$engine"
          "$engine" --headless --editor --path . --quit 2>&1 | tee /tmp/inspector-parse.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' /tmp/inspector-parse.log; then exit 1; fi
          "$engine" --headless --path . --script res://tests/characterInspectorSmoke.gd 2>&1 | tee /tmp/inspector-smoke.log
          if grep -Eq 'SCRIPT ERROR:|INSPECTOR_FAIL|CHARACTER_INSPECTOR_SMOKE FAIL' /tmp/inspector-smoke.log; then exit 1; fi
          grep -Fq 'CHARACTER_INSPECTOR_SMOKE PASS' /tmp/inspector-smoke.log
          node --check host/harness/cockpit.js
          python3 tools/godot-public-asset-firewall-audit.py
