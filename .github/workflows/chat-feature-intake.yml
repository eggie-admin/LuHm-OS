name: Chat Studio Feature Intake Gate
on:
  pull_request:
    paths:
      - 'tools/chatFeatureIntake.py'
      - 'tests/testChatFeatureIntake.py'
      - '.github/workflows/chat-feature-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'testChatFeatureIntake.py' -v
