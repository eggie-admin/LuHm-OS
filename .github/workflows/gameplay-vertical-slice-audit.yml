name: Gameplay Vertical Slice Source Audit

on:
  pull_request:
    paths:
      - 'doctrine/gameplayVerticalSliceV1.json'
      - 'doctrine/gameplayVerticalSliceCrownReceiptV1.json'
      - 'game/story/**'
      - 'scripts/game/**'
      - 'scripts/main.gd'
      - 'tools/gameplayVerticalSliceAudit.py'
      - '.github/workflows/gameplay-vertical-slice-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          python3 -m json.tool doctrine/gameplayVerticalSliceV1.json >/dev/null
          python3 -m json.tool doctrine/gameplayVerticalSliceCrownReceiptV1.json >/dev/null
          python3 -m json.tool game/story/firstNightQuest.json >/dev/null
      - name: Audit gameplay vertical slice source
        run: python3 tools/gameplayVerticalSliceAudit.py
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Parse and import Godot project
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
