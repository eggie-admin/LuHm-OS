name: Gameplay Vertical Slice Source Audit

on:
  pull_request:
    paths:
      - 'doctrine/gameplayVerticalSliceV1.json'
      - 'game/story/**'
      - 'scripts/game/**'
      - 'scripts/main.gd'
      - 'tools/gameplayVerticalSliceAudit.py'
      - '.github/workflows/gameplay-vertical-slice-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          python3 -m json.tool doctrine/gameplayVerticalSliceV1.json >/dev/null
          python3 -m json.tool game/story/firstNightQuest.json >/dev/null
      - name: Audit gameplay vertical slice source
        run: python3 tools/gameplayVerticalSliceAudit.py
