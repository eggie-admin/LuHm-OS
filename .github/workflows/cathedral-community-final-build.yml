name: LuHm Cathedral Toy Community Final Candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scripts/**'
      - 'scenes/**'
      - 'cockpit/**'
      - 'addons/kai_webview/**'
      - 'native/kaiwebview/**'
      - 'assets/community/**'
      - 'tests/**'
      - 'tools/**'
      - 'doctrine/communityAssetMutation-20260926.json'
      - 'doctrine/cathedralWebglassFinal-20260926.json'
      - '.github/workflows/cathedral-community-final-build.yml'

permissions:
  contents: read

concurrency:
  group: cathedral-community-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cathedral-webglass-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build + 10-pass Cathedral WebGlass candidate
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/buildCathedralWebglass.sh

      - name: Upload exact APK evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhm-cathedral-webglass-apk
          path: build/android/
          if-no-files-found: error
          retention-days: 30

      - name: Upload direct install bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhm-cathedral-webglass-install
          path: build/installPortal/
          if-no-files-found: error
          retention-days: 30
