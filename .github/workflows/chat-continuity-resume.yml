name: Project Hydra Cross-Chat Continuity
on:
  pull_request:
    paths:
      - 'doctrine/chatContinuityResumeV1.json'
      - 'doctrine/milestoneTaskQueueV1.json'
      - 'tools/milestoneTaskQueue.py'
      - 'tests/testMilestoneTaskQueue.py'
      - 'tools/contextTourniquet.py'
      - 'tests/testChatContinuityResume.py'
      - '.github/workflows/chat-continuity-resume.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-context-negative-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify exact checkout context
        run: test -n "$(git rev-parse HEAD)"
      - name: Run checkpoint tests and negative controls
        run: python3 -m unittest tests/testChatContinuityResume.py -v
      - name: Validate ChatGPT Task milestone queue, negative controls and dependency isolation
        run: python3 -m unittest tests/testMilestoneTaskQueue.py -v
