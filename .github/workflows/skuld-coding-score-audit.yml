name: Skuld Coding Score Source Audit

on:
  pull_request:
    paths:
      - 'doctrine/skuldCodingScoreV1.json'
      - 'agents/skuldResearchOni/SKILL.md'
      - 'tools/skuldCodingScoreAudit.py'
      - '.github/workflows/skuld-coding-score-audit.yml'
      - 'doctrine/eighthNoteAgentScopeV1.json'
      - 'doctrine/luHmOSFourLayerArchitectureV1.json'
      - 'doctrine/typedFourLaneSqlV1.json'
      - 'doctrine/npmPluginApkDeliveryV1.json'
  push:
    branches: ['main', 'candidate/**']
    paths:
      - 'doctrine/skuldCodingScoreV1.json'
      - 'agents/skuldResearchOni/SKILL.md'
      - 'tools/skuldCodingScoreAudit.py'
      - '.github/workflows/skuld-coding-score-audit.yml'

permissions:
  contents: read

jobs:
  sourceAudit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify canon binding and rejected false claims
        run: |
          python3 tools/skuldCodingScoreAudit.py
          python3 tools/skuldCodingScoreAudit.py --self-test
