name: Architecture Rhythm Audit

on:
  pull_request:
    paths:
      - 'doctrine/jqueryFourLayerArchitectureV1.json'
      - 'doctrine/fourBeatInteractionRhythmV1.json'
      - 'doctrine/escalationKernelV1.json'
      - 'doctrine/humanCenteredIntentRouterV2.json'
      - 'doctrine/currentSourceTruthV3.json'
      - 'doctrine/luhmAiControlPlaneV1.json'
      - 'tools/architectureRhythmAudit.py'
      - '.github/workflows/architecture-rhythm-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-rhythm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit four-layer architecture and four-beat rhythm
        run: python3 tools/architectureRhythmAudit.py
