name: Chrome Canary Browser Proof Audit

on:
  pull_request:
    paths:
      - 'doctrine/chromeCanaryFirstNightBrowserProofV1.json'
      - 'doctrine/currentSourceTruthV3.json'
      - 'doctrine/chromeCanaryDeviceProof20261024V1.json'
      - 'doctrine/chromeCanaryKioskMilestonesV1.json'
      - 'tests/testCanaryKioskCrownMilestones.py'
      - 'tools/chromeCanaryBrowserProofAudit.py'
      - '.github/workflows/chrome-canary-browser-proof-audit.yml'
  push:
    branches: [main]
    paths:
      - 'doctrine/chromeCanaryFirstNightBrowserProofV1.json'
      - 'doctrine/currentSourceTruthV3.json'
      - 'doctrine/chromeCanaryDeviceProof20261024V1.json'
      - 'doctrine/chromeCanaryKioskMilestonesV1.json'
      - 'tests/testCanaryKioskCrownMilestones.py'
      - 'tools/chromeCanaryBrowserProofAudit.py'
      - '.github/workflows/chrome-canary-browser-proof-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify scoped screenshot evidence contract
        run: python3 tools/chromeCanaryBrowserProofAudit.py
      - name: Verify current Canary milestone evidence
        run: python3 -m unittest tests/testCanaryKioskCrownMilestones.py -v
