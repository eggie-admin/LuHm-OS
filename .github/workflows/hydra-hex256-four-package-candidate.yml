name: Hydra HEX256 Four-Package Source and Candidate Build

on:
  pull_request:
    paths:
      - 'doctrine/hydraHexReleaseMatrixV1.json'
      - 'tools/hydraHexReleaseAudit.py'
      - 'tests/testHydraHexReleaseAudit.py'
      - 'tools/buildHydraWebPackageCandidates.sh'
      - 'tools/buildHydraMacDmgCandidate.sh'
      - 'manual/hydraHex256PackageRunbook.md'
      - 'frontEnd/**'
      - 'doctrine/currentSourceTruthV3.json'
      - 'doctrine/companyWideOperationalQuarantineV1.json'
      - 'doctrine/storageTopologyV1.json'
      - '.github/workflows/hydra-hex256-four-package-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-and-unsigned-static-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact source and verify code syntax
        shell: bash
        env:
          LUHM_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LUHM_SOURCE_REF"
          git diff --check
          python3 -m py_compile tools/hydraHexReleaseAudit.py tests/testHydraHexReleaseAudit.py
          bash -n tools/buildHydraWebPackageCandidates.sh
          bash -n tools/buildHydraMacDmgCandidate.sh
      - name: Negative tests and HEX 256 512 1024 evidence assessments
        shell: bash
        env:
          LUHM_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p testHydraHexReleaseAudit.py -v
          mkdir -p "$RUNNER_TEMP/hydra-hex"
          for N in 256 512 1024; do
            python3 tools/hydraHexReleaseAudit.py --slots "$N" \
              --source-ref "$LUHM_SOURCE_REF" \
              --output "$RUNNER_TEMP/hydra-hex/hex-$N.json"
          done
          python3 - "$RUNNER_TEMP/hydra-hex" <<'PY'
          import json,sys,pathlib
          path=pathlib.Path(sys.argv[1])
          for n in (256,512,1024):
              r=json.loads((path/f"hex-{n}.json").read_text())
              assert r["cellCount"] == n and r["hexLast"] == f"0x{n-1:03x}"
              assert sum(r["counts"].values()) == n
              assert r["counts"]["BLOCKED_CROWN"] == n//4
              assert r["crownStatus"]=="STOP"
              assert r["verdict"]=="SOURCE_MATRIX_RECONCILED_RELEASE_UNVERIFIED"
              assert not r["googleAiExecuted"] and not r["googleDriveWrite"]
              print(f"HEX_{n}_ASSESSED_SOURCE_ONLY=PASS blockedRelease={n//4}")
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned jQuery and stage local minified runtime
        working-directory: frontEnd
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run stage:jquery
          cmp -s vendor/jquery-3.7.1.min.js node_modules/jquery/dist/jquery.min.js
          cmp -s vendor/jquery-LICENSE.txt node_modules/jquery/LICENSE.txt
      - name: Build unsigned Debian .deb and private npm .tgz candidate
        shell: bash
        run: |
          set -euo pipefail
          bash tools/buildHydraWebPackageCandidates.sh "$RUNNER_TEMP/hydra-hex/packages"
          cd "$RUNNER_TEMP/hydra-hex/packages"
          sha256sum -c SHA256SUMS
          dpkg-deb --info luhm-os-cockpit-preview_0.1.0~proposed1_all.deb
          dpkg-deb --extract luhm-os-cockpit-preview_0.1.0~proposed1_all.deb "$RUNNER_TEMP/hydra-hex/deb-extract"
          grep -q "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" "$RUNNER_TEMP/hydra-hex/deb-extract/usr/share/luhm-os/cockpit/source-ref.txt"
          test -s "$RUNNER_TEMP/hydra-hex/deb-extract/usr/share/luhm-os/cockpit/vendor/jquery-LICENSE.txt"
          tar -tzf luhm-os-cockpit-preview-0.0.0-proposed.1.tgz > npm-inventory.txt
          grep -qx package/dist/index.html npm-inventory.txt
          grep -qx package/dist/vendor/jquery-LICENSE.txt npm-inventory.txt
          if find "$RUNNER_TEMP/hydra-hex" -type f \( -iname '*.glb' -o -iname '*.blend' -o -iname '*.pck' -o -iname '*.apk' \) | grep -q .; then
            echo RED_PRIVATE_OR_UNREVIEWED_BINARY_IN_PACKAGE
            exit 1
          fi
          echo "GREEN_UNSIGNED_PACKAGES_ONLY: no system install, signing, npm publish, Google Drive write or Mac DMG"
      - name: Upload temporary build and evidence receipts for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hydra-hex256-deb-npm-candidates-and-1024-matrix
          path: ${{ runner.temp }}/hydra-hex/
          if-no-files-found: error
          retention-days: 7
