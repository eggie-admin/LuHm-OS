name: Current Writable CamelHump Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camelHump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: git fetch origin main:refs/remotes/origin/main --force
      - run: python tools/currentWritableCamelHumpAudit.py
