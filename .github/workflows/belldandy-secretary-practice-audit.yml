name: Belldandy Secretary Practice Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secretary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Belldandy secretary practice
        run: python3 tools/belldandySecretaryPracticeAudit.py
      - name: Audit naming namespaces
        run: python3 tools/namingNamespaceAudit.py
      - name: Check LuHm help
        run: |
          python3 tools/luhm.py -h
          python3 tools/luhm.py help BUILD
          python3 tools/luhm.py help build-candidate
          python3 tools/luhm.py help buildCandidate
