name: Belldandy Secretary Practice Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secretary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Belldandy secretary practice
        run: python3 tools/belldandySecretaryPracticeAudit.py
      - name: Urd regression check on Belldandy continuity packets
        run: python3 tools/belldandyContinuityGate.py --self-test
      - name: Enforce quarantine routing
        run: python3 tools/belldandyOperationalQuarantineAudit.py
      - name: Audit naming namespaces
        run: python3 tools/namingNamespaceAudit.py
      - name: Check LuHm help
        run: |
          python3 tools/luhm.py -h
          python3 tools/luhm.py help BUILD
          python3 tools/luhm.py help build-candidate
          python3 tools/luhm.py help buildCandidate
          python3 tools/luhm.py BUILD -h
          python3 tools/luhm.py help cst
