name: LuHm Godot Web Harness

on:
  workflow_dispatch:
    inputs:
      cast:
        description: "Exact Professor build authorization word"
        required: true
        type: string
      milestoneId:
        description: "Exact build milestone ID"
        required: true
        type: string
      taskId:
        description: "Exact Forge task ID"
        required: true
        type: string
      sourceRef:
        description: "Exact commit SHA to build"
        required: true
        type: string
      professorActor:
        description: "Professor GitHub owner username from verified bridge, or direct dispatcher"
        required: false
        type: string
      castOriginRunId:
        description: "Verified CAST bridge run ID, or direct for owner"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.milestoneId }}-${{ inputs.sourceRef }}
  cancel-in-progress: false

jobs:
  export-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact CAST source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ inputs.sourceRef }}

      - name: Verify Professor origin for both direct and bridge CAST
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.sourceRef }}
          PROFESSOR_ACTOR: ${{ inputs.professorActor }}
          CAST_ORIGIN_RUN_ID: ${{ inputs.castOriginRunId }}
        run: |
          set -euo pipefail
          OWNER="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.login')"
          if [[ "$GITHUB_ACTOR" == "$OWNER" ]]; then
            if [[ -n "$PROFESSOR_ACTOR" && "$PROFESSOR_ACTOR" != "$OWNER" ]]; then
              echo "RED_OWNER_ACTOR_MISMATCH" >&2
              exit 2
            fi
            if [[ -n "$CAST_ORIGIN_RUN_ID" && "$CAST_ORIGIN_RUN_ID" != "direct" ]]; then
              echo "RED_OWNER_ORIGIN_MARKER" >&2
              exit 2
            fi
          elif [[ "$GITHUB_ACTOR" == "github-actions[bot]" ]]; then
            if [[ "$PROFESSOR_ACTOR" != "$OWNER" || ! "$CAST_ORIGIN_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "RED_BRIDGE_ACTOR_OR_RUN_ID" >&2
              exit 2
            fi
            ORIGIN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAST_ORIGIN_RUN_ID")"
            ORIGIN_ACTOR="$(jq -r '.actor.login' <<< "$ORIGIN")"
            ORIGIN_EVENT="$(jq -r '.event' <<< "$ORIGIN")"
            ORIGIN_SHA="$(jq -r '.head_sha' <<< "$ORIGIN")"
            ORIGIN_PATH="$(jq -r '.path' <<< "$ORIGIN")"
            if [[ "$ORIGIN_ACTOR" != "$OWNER" || "$ORIGIN_EVENT" != "issue_comment" ||
                  "$ORIGIN_SHA" != "$SOURCE_REF" ||
                  "$ORIGIN_PATH" != *"professor-cast-bridge.yml"* ]]; then
              echo "RED_BRIDGE_ORIGIN_PROVENANCE" >&2
              exit 2
            fi
          else
            echo "RED_CAST_DISPATCHER_NOT_PROFESSOR" >&2
            exit 2
          fi

      - name: CAST gate
        shell: bash
        env:
          CAST_WORD: ${{ inputs.cast }}
          MILESTONE_ID: ${{ inputs.milestoneId }}
          TASK_ID: ${{ inputs.taskId }}
          SOURCE_REF: ${{ inputs.sourceRef }}
          PROFESSOR_ACTOR: ${{ inputs.professorActor }}
        run: |
          set -euo pipefail
          ACTUAL_REF="$(git rev-parse HEAD)"
          python3 tools/forgeCastGate.py \
            --cast-word "$CAST_WORD" \
            --milestone-id "$MILESTONE_ID" \
            --task-id "$TASK_ID" \
            --source-ref "$SOURCE_REF" \
            --actual-source-ref "$ACTUAL_REF" \
            --build-scope 'godot-web-harness' \
            --actor "${PROFESSOR_ACTOR:-$GITHUB_ACTOR}" \
            --receipt "$RUNNER_TEMP/forge-cast-receipt.json"

      - name: Bind exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.sourceRef }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"

      - name: Build verified Godot Web harness
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/buildGodotWebHarness.sh
          tools/buildGodotWebHarness.sh

      - name: Verify browser bundle contract
        shell: bash
        run: |
          set -euo pipefail
          test -s host/harness/godot-export/index.html
          grep -q 'GREEN_GODOT_WEB_HARNESS_EXPORT' <(echo GREEN_GODOT_WEB_HARNESS_EXPORT)
          test -s host/harness/godot-export/SHA256SUMS.txt
          (cd host/harness/godot-export && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          from pathlib import Path
          root = Path('host/harness/godot-export')
          wasm = list(root.glob('*.wasm'))
          pck = list(root.glob('*.pck'))
          assert wasm and all(p.stat().st_size > 0 for p in wasm)
          assert pck and all(p.stat().st_size > 0 for p in pck)
          print('GODOT_WEB_ARTIFACTS=PASS')
          PY

      - name: Test the exported Godot canvas in headless Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/godotBrowserSmoke.py --self-test
          python3 -m pip install --user playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 tools/godotBrowserSmoke.py --run

      - name: Upload Godot browser runtime receipt and screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhm-os-godot-browser-smoke-${{ inputs.milestoneId }}
          path: build/godot-browser/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload CAST-scoped Godot Web artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhm-os-godot-web-harness-${{ inputs.milestoneId }}
          path: host/harness/godot-export/
          if-no-files-found: error
          retention-days: 3

      - name: Preserve CAST receipt in workflow log
        if: always()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/forge-cast-receipt.json"; then
            python3 -m json.tool "$RUNNER_TEMP/forge-cast-receipt.json"
          fi
