name: LuHm Godot Web Harness

on:
  workflow_dispatch:
    inputs:
      cast:
        description: "Exact Professor build authorization word"
        required: true
        type: string
      milestoneId:
        description: "Exact build milestone ID"
        required: true
        type: string
      taskId:
        description: "Exact Forge task ID"
        required: true
        type: string
      sourceRef:
        description: "Exact commit SHA to build"
        required: true
        type: string
      professorActor:
        description: "Verified GitHub owner when relayed by Professor CAST Bridge"
        required: false
        type: string
        default: ""
      castOriginRunId:
        description: "Trusted one-shot CAST bridge Actions run ID"
        required: false
        type: string
        default: ""
      castOriginCommentId:
        description: "Trusted PR #400 exact owner command comment ID"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.milestoneId }}-${{ inputs.sourceRef }}
  cancel-in-progress: false

jobs:
  export-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact CAST source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ inputs.sourceRef }}

      - name: Verify direct or delegated Professor CAST identity
        id: ownerCast
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          professorActor: ${{ inputs.professorActor }}
          castOriginRunId: ${{ inputs.castOriginRunId }}
          castOriginCommentId: ${{ inputs.castOriginCommentId }}
          sourceRef: ${{ inputs.sourceRef }}
        run: |
          set -euo pipefail
          owner="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.login')"
          if [[ "$GITHUB_ACTOR" == "$owner" ]]; then
            # Original direct workflow_dispatch remains supported and unchanged.
            echo "verifiedProfessorActor=$owner" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_ACTOR" == "github-actions[bot]" ]]; then
            [[ "$professorActor" == "$owner" ]]
            [[ "$sourceRef" == "3ddfe062b9cd0e220908c0c80d9dffa76d5a890d" ]]
            [[ "$castOriginRunId" =~ ^[0-9]+$ ]]
            [[ "$castOriginCommentId" =~ ^[0-9]+$ ]]
            origin="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$castOriginRunId")"
            [[ "$(jq -r '.event' <<<"$origin")" == "issue_comment" ]]
            [[ "$(jq -r '.actor.login' <<<"$origin")" == "$owner" ]]
            [[ "$(jq -r '.name' <<<"$origin")" == "Professor CAST Bridge" ]]
            command="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$castOriginCommentId")"
            [[ "$(jq -r '.user.login' <<<"$command")" == "$owner" ]]
            [[ "$(jq -r '.body' <<<"$command")" == "/cast goddessWebProposed" ]]
            [[ "$(jq -r '.issue_url' <<<"$command")" == "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/400" ]]
            approval="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/6392733353")"
            [[ "$(jq -r '.user.login' <<<"$approval")" == "$owner" ]]
            grep -Fq "sourceRef: $sourceRef" <<<"$(jq -r '.body' <<<"$approval")"
            echo "verifiedProfessorActor=$owner" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=CAST actor denied::Neither Professor nor verified Professor bridge" >&2
            exit 2
          fi

      - name: CAST gate
        shell: bash
        env:
          castWord: ${{ inputs.cast }}
          milestoneId: ${{ inputs.milestoneId }}
          taskId: ${{ inputs.taskId }}
          sourceRef: ${{ inputs.sourceRef }}
          verifiedProfessorActor: ${{ steps.ownerCast.outputs.verifiedProfessorActor }}
        run: |
          set -euo pipefail
          actualRef="$(git rev-parse HEAD)"
          python3 tools/forgeCastGate.py \
            --cast-word "$castWord" \
            --milestone-id "$milestoneId" \
            --task-id "$taskId" \
            --source-ref "$sourceRef" \
            --actual-source-ref "$actualRef" \
            --build-scope 'godot-web-harness' \
            --actor "$verifiedProfessorActor" \
            --receipt "$RUNNER_TEMP/forge-cast-receipt.json"

      - name: Bind exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.sourceRef }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"

      - name: Build verified Godot Web harness
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/buildGodotWebHarness.sh
          tools/buildGodotWebHarness.sh

      - name: Verify browser bundle contract
        shell: bash
        run: |
          set -euo pipefail
          test -s host/harness/godot-export/index.html
          grep -q 'GREEN_GODOT_WEB_HARNESS_EXPORT' <(echo GREEN_GODOT_WEB_HARNESS_EXPORT)
          test -s host/harness/godot-export/SHA256SUMS.txt
          (cd host/harness/godot-export && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          from pathlib import Path
          root = Path('host/harness/godot-export')
          wasm = list(root.glob('*.wasm'))
          pck = list(root.glob('*.pck'))
          assert wasm and all(p.stat().st_size > 0 for p in wasm)
          assert pck and all(p.stat().st_size > 0 for p in pck)
          print('GODOT_WEB_ARTIFACTS=PASS')
          PY

      - name: Test the exported Godot canvas in headless Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/godotBrowserSmoke.py --self-test
          python3 -m pip install --user playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          python3 tools/godotBrowserSmoke.py --run

      - name: Upload Godot browser runtime receipt and screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhm-os-godot-browser-smoke-${{ inputs.milestoneId }}
          path: build/godot-browser/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload CAST-scoped Godot Web artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhm-os-godot-web-harness-${{ inputs.milestoneId }}
          path: host/harness/godot-export/
          if-no-files-found: error
          retention-days: 3

      - name: Preserve CAST receipt in workflow log
        if: always()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/forge-cast-receipt.json"; then
            python3 -m json.tool "$RUNNER_TEMP/forge-cast-receipt.json"
          fi
