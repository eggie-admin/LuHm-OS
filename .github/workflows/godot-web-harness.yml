name: LuHm Godot Web Harness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - 'tools/runGodotSmoke.py'
      - 'tools/buildGodotWebHarness.sh'
      - 'host/harness/**'
      - '.github/workflows/godot-web-harness.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"

      - name: Build verified Godot Web harness
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/buildGodotWebHarness.sh
          tools/buildGodotWebHarness.sh

      - name: Verify browser bundle contract
        shell: bash
        run: |
          set -euo pipefail
          test -s host/harness/godot-export/index.html
          grep -q 'GREEN_GODOT_WEB_HARNESS_EXPORT' <(echo GREEN_GODOT_WEB_HARNESS_EXPORT)
          test -s host/harness/godot-export/SHA256SUMS.txt
          (cd host/harness/godot-export && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          from pathlib import Path
          root = Path('host/harness/godot-export')
          wasm = list(root.glob('*.wasm'))
          pck = list(root.glob('*.pck'))
          assert wasm and all(p.stat().st_size > 0 for p in wasm)
          assert pck and all(p.stat().st_size > 0 for p in pck)
          print('GODOT_WEB_ARTIFACTS=PASS')
          PY

      - name: Upload Godot Web harness artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhm-os-godot-web-harness
          path: host/harness/godot-export/
          if-no-files-found: error
          retention-days: 30
