name: Firefox FQDN SQL Gateway Candidate
on:
  pull_request:
    paths:
      - 'doctrine/firefoxFqdnSqlGatewayV1.json'
      - 'deploy/nginx/firefox-fqdn-gateway.candidate.conf'
      - 'tools/firefoxFqdnSqlGatewayAudit.py'
      - '.github/workflows/firefox-fqdn-sql-gateway-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Source-only fail-closed checks, no DNS, SQL, deploy or CAST
        run: python3 tools/firefoxFqdnSqlGatewayAudit.py
      - name: Offline NGINX syntax only with ephemeral throwaway certificate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx openssl
          sudo mkdir -p /etc/luhm/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1             -keyout "$RUNNER_TEMP/privkey.pem" -out "$RUNNER_TEMP/fullchain.pem"             -subj '/CN=eggiebagelface.art' >/dev/null 2>&1
          sudo install -m 600 "$RUNNER_TEMP/privkey.pem" /etc/luhm/tls/privkey.pem
          sudo install -m 644 "$RUNNER_TEMP/fullchain.pem" /etc/luhm/tls/fullchain.pem
          {
            printf 'events {}\nhttp {\n'
            cat deploy/nginx/firefox-fqdn-gateway.candidate.conf
            printf '\n}\n'
          } > "$RUNNER_TEMP/luhm-nginx-test.conf"
          sudo nginx -t -c "$RUNNER_TEMP/luhm-nginx-test.conf"
