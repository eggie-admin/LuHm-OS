name: LuHm Cathedral Full Mutation Staged

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scripts/**'
      - 'scenes/**'
      - 'cockpit/**'
      - 'addons/kai_webview/**'
      - 'native/kaiwebview/**'
      - 'assets/community/**'
      - 'tests/**'
      - 'tools/**'
      - 'doctrine/androidCandidate.json'
      - 'doctrine/witchingHourThreeRitual-20260926.json'
      - 'doctrine/runtimeDoctrine-20260926.json'
      - '.github/workflows/witching-hour-three-ritual-build.yml'

permissions:
  contents: read

concurrency:
  group: cathedral-full-mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Full doctrine mutation + smoke + staged APK
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          chmod +x scripts/buildCathedralWebglass.sh
          scripts/buildCathedralWebglass.sh

      - name: Upload full mutation APK evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhm-cathedral-full-mutation-apk
          path: build/android/
          if-no-files-found: error
          retention-days: 30

      - name: Upload direct install portal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhm-cathedral-full-mutation-install
          path: build/installPortal/
          if-no-files-found: error
          retention-days: 30
