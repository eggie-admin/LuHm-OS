name: Professor CAST Bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  pull-requests: read
  issues: read

jobs:
  validate-cast:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      (github.event.comment.body == 'CAST' ||
       github.event.comment.body == 'castBridge' ||
       startsWith(github.event.comment.body, '/cast '))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate exact Professor CAST authorization
        id: cast
        shell: bash
        env:
          ghToken: ${{ github.token }}
          commentBody: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          mainSha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test -n "$mainSha"

          if [[ "$commentBody" == "CAST" || "$commentBody" == "castBridge" ]]; then
            echo "::error title=CAST authorization incomplete::Use /cast androidWeb3Cockpit $mainSha"
            echo "Short CAST aliases are diagnostic only. Exact current-main SHA is required before dispatch." >&2
            exit 2
          fi

          if [[ ! "$commentBody" =~ ^/cast[[:space:]]+androidWeb3Cockpit[[:space:]]+([0-9a-f]{40})$ ]]; then
            echo "::error title=Invalid CAST syntax::Use /cast androidWeb3Cockpit $mainSha"
            exit 2
          fi

          requestedSha="${BASH_REMATCH[1]}"
          if [[ "$requestedSha" != "$mainSha" ]]; then
            echo "::error title=CAST source drift::requested=$requestedSha currentMain=$mainSha"
            exit 2
          fi

          releaseTag="android-web3-${requestedSha:0:8}-r${GITHUB_RUN_ID}"
          taskId="android-web3-cockpit-cast-${GITHUB_RUN_ID}"
          professorActor="${{ github.event.comment.user.login }}"

          {
            echo "sourceRef=$requestedSha"
            echo "releaseTag=$releaseTag"
            echo "taskId=$taskId"
            echo "professorActor=$professorActor"
            echo "castOriginRunId=$GITHUB_RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch one exact-source Android Web3 CAST
        shell: bash
        env:
          ghToken: ${{ github.token }}
          sourceRef: ${{ steps.cast.outputs.sourceRef }}
          releaseTag: ${{ steps.cast.outputs.releaseTag }}
          taskId: ${{ steps.cast.outputs.taskId }}
          professorActor: ${{ steps.cast.outputs.professorActor }}
          castOriginRunId: ${{ steps.cast.outputs.castOriginRunId }}
        run: |
          set -euo pipefail
          gh workflow run android-testing-build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f cast=cast \
            -f milestoneId=androidWeb3Cockpit \
            -f taskId="$taskId" \
            -f sourceRef="$sourceRef" \
            -f professorActor="$professorActor" \
            -f castOriginRunId="$castOriginRunId" \
            -f releaseTag="$releaseTag" \
            -f publishPrerelease=true

          echo "CAST_DISPATCHED sourceRef=$sourceRef releaseTag=$releaseTag taskId=$taskId"
