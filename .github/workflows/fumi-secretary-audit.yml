name: LuHm Fumi Secretary Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'agents/fumiSecretaryOni/**'
      - 'agents/lum/SKILL.md'
      - 'doctrine/FUMI_SECRETARY_ONI_V1.json'
      - 'tools/fumiSecretaryAudit.py'
      - 'tests/testFumiSecretaryAudit.py'
      - '.github/workflows/fumi-secretary-audit.yml'
  push:
    branches:
      - 'architecture/fumi-secretary-oni-*'

permissions:
  contents: read

jobs:
  records-boundary-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate Fumi doctrine
        run: |
          set -euo pipefail
          python3 -m json.tool doctrine/FUMI_SECRETARY_ONI_V1.json >/dev/null
          python3 tools/fumiSecretaryAudit.py
      - name: Run Fumi negative controls
        run: |
          set -euo pipefail
          python3 tests/testFumiSecretaryAudit.py
