name: In-Chat Precision Command Audit

on:
  pull_request:
    paths:
      - 'doctrine/chatPrecisionCommandV1.json'
      - 'doctrine/commandHelpV1.json'
      - 'doctrine/inChatExperienceV1.json'
      - 'doctrine/currentSourceTruthV3.json'
      - 'host/harness/widget.html'
      - 'host/mcp/luhmHarness.py'
      - 'host/mcp/luhmMcpServer.py'
      - 'tools/luhm.py'
      - 'tools/inChatExperienceAudit.py'
      - 'tools/namingNamespaceAudit.py'
      - '.github/workflows/in-chat-precision-command-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Validate command contracts
        run: |
          set -euo pipefail
          python3 -m json.tool doctrine/chatPrecisionCommandV1.json >/dev/null
          python3 -m json.tool doctrine/commandHelpV1.json >/dev/null
          python3 -m json.tool doctrine/inChatExperienceV1.json >/dev/null
          python3 -m json.tool doctrine/currentSourceTruthV3.json >/dev/null
          python3 -m py_compile tools/luhm.py tools/inChatExperienceAudit.py tools/namingNamespaceAudit.py host/mcp/luhmHarness.py

      - name: Prove apt-style help
        run: |
          set -euo pipefail
          python3 tools/luhm.py -h
          python3 tools/luhm.py HELP
          python3 tools/luhm.py continueFastPath -h

      - name: Prove naming and in-chat command contract
        run: |
          set -euo pipefail
          python3 tools/namingNamespaceAudit.py
          python3 tools/inChatExperienceAudit.py
