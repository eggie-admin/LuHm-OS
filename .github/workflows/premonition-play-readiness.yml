name: Premonition Google Play Readiness Gate
on:
  pull_request:
    paths:
      - 'tools/premonitionPlayReadiness.py'
      - 'export_presets.cfg'
      - 'project.godot'
      - '.github/workflows/samsung-lite-signed-beta.yml'
      - '.github/workflows/premonition-play-readiness.yml'
      - 'docs/premonition-google-play-lanes.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Read-only source audit
        run: python3 tools/premonitionPlayReadiness.py
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: premonition-play-source-readiness
          path: build/premonition-play/readiness.json
          if-no-files-found: warn
          retention-days: 14
