name: LuHm-OS Machine SQL Hex 512 Escalation

on:
  pull_request:
    paths:
      - 'doctrine/machineSqlHex512EscalationV1.json'
      - 'doctrine/fnCastV1.yaml'
      - 'doctrine/escalationKernelV1.json'
      - 'doctrine/currentSourceTruthV3.json'
      - 'doctrine/storageTopologyV1.json'
      - 'doctrine/machineToHumanWizardV1.json'
      - 'doctrine/companyWideOperationalQuarantineV1.json'
      - 'host/api/machineRegistrySqliteV1.sql'
      - 'host/api/machineRegistryMariaDbReviewV1.sql'
      - 'tools/machineSqlHex512Audit.py'
      - 'doctrine/brandHexVectorProjectionV1.json'
      - 'tools/brandHexVectorAudit.py'
      - 'frontEnd/prototypes/brandVector1048/**'
      - 'doctrine/machineCastHexBridgeV1.json'
      - 'doctrine/machineCastHexManifestV1.schema.json'
      - 'frontEnd/core/machineCastHexBridge.mjs'
      - 'frontEnd/jquery/luhm.hexCastBridge.mjs'
      - 'frontEnd/tests/machineCastHexBridge.test.mjs'
      - 'frontEnd/tools/emit-machine-hex-manifest.mjs'
      - 'tools/machineCastHexBridge.py'
      - '.github/workflows/machine-sql-hex512-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sourceOnly512:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact proposal source, no persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact source and lint Python
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m py_compile tools/machineSqlHex512Audit.py
          python3 -m json.tool doctrine/machineSqlHex512EscalationV1.json >/dev/null
      - name: Audit 1048 scalable brand projection against existing vector Canon
        run: |
          set -euo pipefail
          python3 -m json.tool doctrine/brandHexVectorProjectionV1.json >/dev/null
          python3 tools/brandHexVectorAudit.py
      - name: 512 in-memory SQL coordinates and negative controls
        run: python3 tools/machineSqlHex512Audit.py
      - name: AI JSON + Python CAST source-bound intent and 24 negative controls
        run: python3 tools/machineCastHexBridge.py --self-test
      - name: Browser JS and opt-in jquery intent unit tests
        run: node --test frontEnd/tests/machineCastHexBridge.test.mjs
      - name: JS manifest to Python exact-source CAST validation and synthetic SQL receipt
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REF="$(git rev-parse HEAD)"
          node frontEnd/tools/emit-machine-hex-manifest.mjs "$SOURCE_REF" > "$RUNNER_TEMP/luhm-cast-hex-manifest.json"
          python3 tools/machineCastHexBridge.py --source-ref "$SOURCE_REF" --manifest-file "$RUNNER_TEMP/luhm-cast-hex-manifest.json" --synthetic-sql
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"luhm-cast-hex-manifest.json"
          doc=json.loads(p.read_text())
          doc["machineBridge"]["dispatchAuthorized"]=True
          (p.parent/"luhm-cast-hex-invalid.json").write_text(json.dumps(doc))
          PY
          if python3 tools/machineCastHexBridge.py --source-ref "$SOURCE_REF" --manifest-file "$RUNNER_TEMP/luhm-cast-hex-invalid.json" --synthetic-sql; then
            echo 'RED_MANIFEST_ESCALATION_ACCEPTED' >&2
            exit 1
          fi
          echo 'GREEN_JS_PYTHON_SQL_BRIDGE_NO_DISPATCH'
      - name: No database network, PHP admin or production mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('doctrine/machineSqlHex512EscalationV1.json').read_text())
          assert p['count']['total']==512
          assert p['runtimeProof']['mariaDbInstalledAndRunning'] is False
          assert p['runtimeProof']['phpMyAdminInstalled'] is False
          assert p['runtimeProof']['productionSchemaChanged'] is False
          assert p['crownStatus']=='STOP'
          print('PASS_SQL_CANDIDATE_CROWN_STOP')
          PY
