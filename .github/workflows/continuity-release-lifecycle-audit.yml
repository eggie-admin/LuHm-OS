name: Continuity + Free Open Beta Source Audit

on:
  pull_request:
    paths:
      - "doctrine/continuityReleaseLifecycleV1.json"
      - "doctrine/currentSourceTruthV3.json"
      - "tools/continuity-release-lifecycle-audit.py"
      - ".github/workflows/continuity-release-lifecycle-audit.yml"
  push:
    branches: [main]
    paths:
      - "doctrine/continuityReleaseLifecycleV1.json"
      - "doctrine/currentSourceTruthV3.json"
      - "tools/continuity-release-lifecycle-audit.py"
      - ".github/workflows/continuity-release-lifecycle-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canon:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Assert continuity and free beta canon, with negative tests
        run: python3 tools/continuity-release-lifecycle-audit.py
