name: Remote Sidecar Deny-First Audit
on:
  pull_request:
    paths:
      - 'doctrine/remoteSidecarHardeningV1.json'
      - 'tools/remoteSidecarDoctrineAudit.py'
      - '.github/workflows/remoteSidecarAudit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deny-first:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline policy regression and compile
        run: |
          python3 -m py_compile tools/remoteSidecarDoctrineAudit.py
          python3 tools/remoteSidecarDoctrineAudit.py
