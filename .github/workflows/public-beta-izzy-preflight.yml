name: LuHm OS Public Beta Izzy Preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scripts/**'
      - 'scenes/**'
      - 'assets/**'
      - 'cutscenes/**'
      - 'fastlane/**'
      - 'doctrine/izzyOnDroidBetaEligibility-20260926.json'
      - '.github/workflows/public-beta-izzy-preflight.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-beta-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36'

      - name: Install Godot 4.7.2 and templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fL --retry 5 -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  /tmp/templates.tpz' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          cp -a /tmp/tpl/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          echo 'GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64' >> "$GITHUB_ENV"

      - name: Configure preflight release signer
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/luhm-beta-preflight.keystore"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass preflight123 \
            -alias luhmbeta -keypass preflight123 -keyalg RSA -keysize 2048 \
            -validity 30 -dname 'CN=LuHm OS Beta Preflight,O=LuHm OS,C=US'
          chmod 600 "$KEYSTORE"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_RELEASE_USER=luhmbeta' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=preflight123' >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Assert source-only Lum fallback lane
        shell: bash
        run: |
          set -euo pipefail
          test ! -e assets/lum/luhm.glb
          test ! -e assets/lum/luhmRunning.glb
          grep -q 'lightweight procedural Lum fallback' assets/lum/README.md

      - name: Import source-only Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path . --quit

      - name: Runtime smoke source-only fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/runGodotSmoke.py "$GODOT" layoutSmoke
          python3 tools/runGodotSmoke.py "$GODOT" runtimeSmoke

      - name: Export ARM64 public beta release preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/public-beta
          "$GODOT" --headless --path . --install-android-build-template \
            --export-release 'Android Public Beta Preflight' \
            build/public-beta/LuHm-OS-1.0.17-beta.1-arm64.apk
          test -s build/public-beta/LuHm-OS-1.0.17-beta.1-arm64.apk

      - name: Verify beta APK metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=build/public-beta/LuHm-OS-1.0.17-beta.1-arm64.apk
          BT="$ANDROID_HOME/build-tools/36.1.0"
          "$BT/aapt" dump badging "$APK" | tee build/public-beta/badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee build/public-beta/signature.txt
          "$BT/zipalign" -c -P 16 -v 4 "$APK" > build/public-beta/zipalign.txt
          sha256sum "$APK" | tee build/public-beta/sha256.txt
          grep -Fq "package: name='art.eggiebagelface.luhmos.beta' versionCode='117' versionName='1.0.17-beta.1'" build/public-beta/badging.txt
          if grep -q '^application-debuggable' build/public-beta/badging.txt; then
            echo 'ERROR: release preflight APK is debuggable' >&2
            exit 1
          fi

      - name: Enforce IzzyOnDroid 30 MB APK ceiling
        shell: bash
        run: |
          set -euo pipefail
          APK=build/public-beta/LuHm-OS-1.0.17-beta.1-arm64.apk
          SIZE=$(stat -c '%s' "$APK")
          LIMIT=30000000
          printf '%s\n' "$SIZE" | tee build/public-beta/size-bytes.txt
          python3 - <<PY | tee build/public-beta/size-report.txt
          size=$SIZE
          limit=$LIMIT
          print(f'APK bytes: {size}')
          print(f'APK MiB: {size / 1024 / 1024:.2f}')
          print(f'Izzy preflight limit bytes: {limit}')
          print('IZZY_SIZE_GATE=' + ('PASS' if size <= limit else 'FAIL'))
          PY
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "ERROR: APK exceeds IzzyOnDroid preflight ceiling: $SIZE > $LIMIT bytes" >&2
            exit 1
          fi

      - name: Upload public beta preflight artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhm-os-public-beta-izzy-preflight
          path: build/public-beta/
          if-no-files-found: warn
          retention-days: 14
