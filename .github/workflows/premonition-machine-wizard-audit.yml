name: Premonition Machine-to-Human Read-Only Wizard
on:
  pull_request:
    paths:
      - 'doctrine/machineToHumanWizardV1.json'
      - 'tools/machineToHumanWizard.py'
      - 'tests/testMachineToHumanWizard.py'
      - 'manual/machine-to-human-wizard.md'
      - 'doctrine/machineDebianFourLayerV1.json'
      - 'tools/machineDebianSnapshot.py'
      - 'tests/testMachineDebianSnapshot.py'
      - 'manual/machine-debian-four-layer-snapshot-20261101.md'
      - 'infra/machine-debian/**'
      - 'doctrine/machineLocalAgentAuditV1.json'
      - 'doctrine/deviceCapabilityRegistryV1.json'
      - 'tools/deviceRegistrySqlReceipt.py'
      - 'manual/device-profile-registry-20261101.md'
      - 'doctrine/piOsLiteMachineKioskV1.json'
      - 'tools/pi-kiosk/**'
      - 'tests/testPiOsLiteKiosk.py'
      - 'manual/pi-os-lite-headless-kiosk-20261101.md'
      - 'doctrine/castMachineCloseoutV1.json'
      - 'tools/castMachineCloseoutAudit.py'
      - 'tests/testCastMachineCloseout.py'
      - 'manual/cast-machine-closeout-20261101.md'
      - 'tools/luhm-machine-agent/**'
      - '.github/workflows/premonition-machine-wizard-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readOnlyWizardGate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate contract and Python source
        run: |
          python3 -m json.tool doctrine/machineToHumanWizardV1.json > /dev/null
          python3 -m py_compile tools/machineToHumanWizard.py tests/testMachineToHumanWizard.py
      - name: Run synthetic host and no-mutation tests
        run: python3 -m unittest discover -s tests -p 'testMachineToHumanWizard.py' -v
      - name: Validate Debian four-layer source and read-only machine snapshot
        run: |
          python3 -m json.tool doctrine/machineDebianFourLayerV1.json > /dev/null
          python3 -m py_compile tools/machineDebianSnapshot.py tests/testMachineDebianSnapshot.py
          python3 -m unittest discover -s tests -p 'testMachineDebianSnapshot.py' -v
          python3 tools/machineDebianSnapshot.py > "$RUNNER_TEMP/machine-debian-source-snapshot.json"
          python3 - "$RUNNER_TEMP/machine-debian-source-snapshot.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["matrixCells"] == 16 and r["logicalHex"] == [f"0x{i:02X}" for i in range(16)]
          assert r["mode"] == "source" and r["verdict"] == "AMBER_SOURCE_ONLY"
          assert r["sql"]["db"] == "SQLITE_MEMORY_STRICT" and not r["sql"]["externalDb"]
          assert r["hostEvidence"] is None and not r["physicalDeviceVerified"]
          assert not r["kernelBuilt"] and not r["kernelModified"]
          assert not r["bootloaderModified"] and not r["partitionModified"]
          assert r["crownStatus"] == "STOP"
          print("MACHINE_DEBIAN_4X4_SOURCE_SNAPSHOT_GREEN_RUNTIME_UNVERIFIED")
          PY
      - name: Build isolated headless Debian userland and test no-server FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          docker build --file infra/machine-debian/Dockerfile --tag luhm-machine-debian:source-candidate .
          test "$(docker image inspect --format '{{.Config.User}}' luhm-machine-debian:source-candidate)" = "65534:65534"
          docker image inspect --format '{{.Id}}' luhm-machine-debian:source-candidate > "$RUNNER_TEMP/luhm-machine-image-id.txt"
          flags=(--rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges
            --pids-limit 64 --memory 512m --cpus 1 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=8m)
          docker run "${flags[@]}" luhm-machine-debian:source-candidate > "$RUNNER_TEMP/debian-container-source-receipt.json"
          python3 - "$RUNNER_TEMP/debian-container-source-receipt.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["verdict"]=="AMBER_SOURCE_ONLY" and r["hostEvidence"] is None
          assert r["matrixCells"] == 16 and not r["kernelModified"]
          assert r["sql"]["db"]=="SQLITE_MEMORY_STRICT"
          assert r["crownStatus"]=="STOP"
          PY
          docker run "${flags[@]}" --entrypoint python3 luhm-machine-debian:source-candidate -m unittest discover -s tests -p 'testMachineDebianSnapshot.py' -v
          docker run "${flags[@]}" --entrypoint /usr/bin/ffmpeg luhm-machine-debian:source-candidate \
            -hide_banner -loglevel error -f lavfi -i color=c=black:s=64x64:r=1 \
            -frames:v 1 -an -f null -
          echo "DEBIAN_HEADLESS_FFMPEG_CPU_SMOKE_GREEN_HOST_KERNEL_UNCHANGED"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - name: Audit local-first npm machine agent and Python SQLite bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool doctrine/machineLocalAgentAuditV1.json > /dev/null
          python3 -m json.tool doctrine/deviceCapabilityRegistryV1.json > /dev/null
          python3 -m py_compile tools/deviceRegistrySqlReceipt.py
          cd tools/luhm-machine-agent
          node --version
          npm test
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/machine-agent-npm-pack.json"
          node bin/luhm-machine-audit.mjs audit --with-python --with-device > "$RUNNER_TEMP/machine-agent-source-receipt.json"
          node bin/luhm-machine-audit.mjs remote-plan > "$RUNNER_TEMP/machine-agent-remote-boundary.json"
          python3 - "$RUNNER_TEMP/machine-agent-source-receipt.json" "$RUNNER_TEMP/machine-agent-remote-boundary.json" <<'PY'
          import json,sys
          local=json.load(open(sys.argv[1],encoding="utf-8"))
          remote=json.load(open(sys.argv[2],encoding="utf-8"))
          assert local["matrixCells"]==16 and local["verdict"]=="AMBER_SOURCE_ONLY"
          assert local["npmRuntimeDependencies"]==0 and local["pythonSqlInterop"]=="SOURCE_ONLY_VERIFIED"
          assert local["deviceRegistryInterop"]=="SYNTHETIC_4X4_JS_PYTHON_SQL_VERIFIED"
          assert local["deviceRegistryHex"]=="0x0B" and local["deviceRssSample"]=="SYNTHETIC_NOT_MEASURED"
          assert not local["networkAccessed"] and not local["agentActivated"] and not local["kernelChanged"]
          assert remote["status"]=="BLOCKED_PENDING_APPROVAL" and not remote["networkRequestMade"]
          assert not remote["modelCalled"] and not remote["receiptPromotion"]
          assert local["crownStatus"]==remote["crownStatus"]=="STOP"
          print("MACHINE_AGENT_NPM_4X4_LOCAL_ONLY_PASS")
          PY
      - name: Verify Raspberry Pi OS boot-to-kiosk source boundary and local HTTP tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool doctrine/piOsLiteMachineKioskV1.json > /dev/null
          python3 -m py_compile tools/pi-kiosk/preview.py tests/testPiOsLiteKiosk.py
          python3 -m unittest discover -s tests -p 'testPiOsLiteKiosk.py' -v
          python3 tools/pi-kiosk/preview.py --check > "$RUNNER_TEMP/pi-os-kiosk-source-receipt.json"
          python3 - "$RUNNER_TEMP/pi-os-kiosk-source-receipt.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["status"]=="AMBER_SOURCE_ONLY" and r["matrixCells"]==16
          assert len(r["assets"])==4 and all(len(item["sha256"])==64 for item in r["assets"])
          assert r["kernelChanged"] is False and r["deviceVerified"] is False
          assert r["listenerStarted"] is False and r["crownStatus"]=="STOP"
          print("PI_OS_BOOT_TO_LOOPBACK_KIOSK_SOURCE_PASS")
          PY
      - name: Verify CAST machine source closeout and no implicit beta promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool doctrine/castMachineCloseoutV1.json >/dev/null
          python3 -m py_compile tools/castMachineCloseoutAudit.py tests/testCastMachineCloseout.py
          python3 -m unittest discover -s tests -p 'testCastMachineCloseout.py' -v
          python3 tools/castMachineCloseoutAudit.py > "$RUNNER_TEMP/cast-machine-closeout-source-receipt.json"
          python3 - "$RUNNER_TEMP/cast-machine-closeout-source-receipt.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          assert p["status"]=="AMBER_MACHINE_SOURCE_READY_FOR_PROPOSED_REVIEW"
          assert p["machineSourcePrototyped"] is True and p["nextOsPlanningAllowed"] is True
          assert len(p["historicalPrChain"])==4 and len(p["sourceDigests"])==9
          assert len(p["nextBlockers"])==5 and p["sourceChangesUntilHardwareEvidence"]=="SECURITY_FIXES_ONLY"
          for flag in ("currentHeadReverified","actualPiBooted","kioskAccessibleFromPhone",
                       "physicalBackendComplete","betaReleaseReady","finalReleaseReady",
                       "castAuthorized","castDispatched","publicDeployment","liveData"):
              assert p[flag] is False, flag
          assert p["crownStatus"]=="STOP"
          print("CAST_MACHINE_SOURCE_CLOSEOUT_READY_FOR_REVIEW_NOT_DEPLOYED")
          PY
      - name: Emit runner-safe read-only sample
        run: |
          python3 tools/machineToHumanWizard.py --json > "$RUNNER_TEMP/wizard-receipt.json"
          python3 - "$RUNNER_TEMP/wizard-receipt.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          assert data["diskWritesPerformed"] is False
          assert data["physicalDeviceVerified"] is False
          assert data["crownStatus"] == "STOP"
          PY
      - name: Upload bounded machine and offline Debian evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: machine-debian-4x4-source-receipts
          path: |
            ${{ runner.temp }}/machine-debian-source-snapshot.json
            ${{ runner.temp }}/debian-container-source-receipt.json
            ${{ runner.temp }}/luhm-machine-image-id.txt
            ${{ runner.temp }}/machine-agent-source-receipt.json
            ${{ runner.temp }}/machine-agent-remote-boundary.json
            ${{ runner.temp }}/machine-agent-npm-pack.json
            ${{ runner.temp }}/pi-os-kiosk-source-receipt.json
            ${{ runner.temp }}/cast-machine-closeout-source-receipt.json
          retention-days: 14
          if-no-files-found: warn
