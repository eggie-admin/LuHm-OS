name: Pocket Studio Verified 3D Publication
on:
  pull_request:
    branches:
      - publication/plugin-full-green-20260930
    paths:
      - 'publicationSite/pocketLab.html'
      - '.github/workflows/pocket-3d-publication-proof.yml'
permissions:
  contents: read
jobs:
  exact-approved-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Byte-for-byte comparison against approved main + basic 3D guards
        shell: bash
        run: |
          set -euo pipefail
          git show babe2c2cd2f9c0c9f8044ffee9ce21c1b4bd45a8:publicationSite/pocketLab.html > "$RUNNER_TEMP/approvedPocket.html"
          cmp publicationSite/pocketLab.html "$RUNNER_TEMP/approvedPocket.html"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('publicationSite/pocketLab.html').read_text()
          assert 'id="live3dframe"' in s
          assert 'id="launch3d"' in s
          assert s.count('https://luhm-os-godot-harness-green.onrender.com/harness/godot-export/index.html') == 2
          assert 'https://luhm-os-harness-green.onrender.com/harness/godot-export/index.html' not in s
          assert 'sandbox="allow-scripts allow-same-origin allow-pointer-lock"' in s
          assert 'private Rebel models' in s
          assert 'rebelDrive' not in s
          print('GREEN_POCKET_3D_PUBLICATION_MATCHES_REVIEWED_MAIN')
          PY
          
