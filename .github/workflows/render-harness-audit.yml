name: LuHm Render ChatGPT Harness Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'host/harness/**'
      - 'host/mcp/luhmHarness.py'
      - 'host/mcp/luhmHarnessServer.py'
      - 'export_presets.cfg'
      - 'tools/harnessAudit.py'
      - '.github/workflows/render-harness-audit.yml'

permissions:
  contents: read

jobs:
  harness-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"

      - name: Install pinned MCP runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r host/mcp/requirements.txt

      - name: Run harness source audit
        shell: bash
        run: |
          set -euo pipefail
          python tools/harnessAudit.py

      - name: Boot-time harness contract check
        shell: bash
        env:
          LUHM_MCP_PROFILE: production
          RENDER_EXTERNAL_HOSTNAME: luhm-os-harness-green.onrender.com
          LUHM_HARNESS_PUBLIC_ORIGIN: https://luhm-os-harness-green.onrender.com
        run: |
          set -euo pipefail
          python host/mcp/luhmHarnessServer.py --check

      - name: Inspect MCP UI registration
        shell: bash
        env:
          LUHM_HARNESS_PUBLIC_ORIGIN: https://luhm-os-harness-green.onrender.com
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import sys
          sys.path.insert(0, "host/mcp")
          import luhmHarnessServer as harness

          async def main():
              tools = await harness.core.server.list_tools()
              resources = await harness.core.server.list_resources()
              tool = next(t for t in tools if t.name == "luhm_open_cockpit")
              resource = next(r for r in resources if str(r.uri) == "ui://luhm-os/cockpit-v2.html")
              legacy = next(r for r in resources if str(r.uri) == "ui://luhm-os/cockpit-v1.html")
              tool_wire = tool.model_dump(by_alias=True)
              resource_wire = resource.model_dump(by_alias=True)
              assert tool.annotations.read_only_hint is True
              assert tool_wire["_meta"]["ui"]["resourceUri"] == "ui://luhm-os/cockpit-v2.html"
              assert tool_wire["_meta"]["openai/ui"]["entrypoints"] == [{"type": "thread"}]
              assert resource.mime_type == "text/html;profile=mcp-app"
              assert legacy.mime_type == "text/html;profile=mcp-app"
              assert resource_wire["_meta"]["ui"]["domain"] == "https://luhm-os-harness-green.onrender.com"
              print("HARNESS_MCP_UI_GREEN")
          asyncio.run(main())
          PY
