name: Unified Goddess Orchestra Four-Quarter Gate

on:
  pull_request:
    paths:
      - 'doctrine/unifiedGoddessOrchestraV1.json'
      - 'infra/unified-quarters/**'
      - 'tools/unifiedGoddessOrchestraAudit.py'
      - 'tools/unifiedQuarterYamlGuard.rb'
      - 'tests/testUnifiedGoddessOrchestra.py'
      - 'packages/unified-ops/**'
      - 'doctrine/luhmThinPackagePlanV1.json'
      - 'manual/thin-client-package-manager.md'
      - 'manual/thin-package-viewer.html'
      - 'doctrine/industryLifecycleReductionV1.json'
      - 'tools/industryLifecycleReductionAudit.py'
      - 'tests/testIndustryLifecycleReduction.py'
      - 'manual/industryLifecycleReduction20261030.md'
      - 'frontEnd/package.json'
      - 'frontEnd/package-lock.json'
      - 'manual/unifiedGoddessOrchestraFourQuarter20261030.md'
      - '.github/workflows/unified-goddess-orchestra.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-goddess-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-orchestra:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LUHM_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Exact source checkout without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.LUHM_SOURCE_REF }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact source, JSON/Python/Ruby/JS static validation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LUHM_SOURCE_REF"
          git diff --check
          python3 -m json.tool doctrine/unifiedGoddessOrchestraV1.json >/dev/null
          python3 -m json.tool packages/unified-ops/package.json >/dev/null
          python3 -m json.tool packages/unified-ops/package-lock.json >/dev/null
          python3 -m py_compile tools/unifiedGoddessOrchestraAudit.py tests/testUnifiedGoddessOrchestra.py
          ruby -c tools/unifiedQuarterYamlGuard.rb
          ruby tools/unifiedQuarterYamlGuard.rb
      - name: Synthetic SQLite, class/plugin and quarantine audit
        run: |
          python3 tools/unifiedGoddessOrchestraAudit.py --mode audit
          python3 tools/unifiedGoddessOrchestraAudit.py --mode sql-smoke
          python3 -m unittest tests/testUnifiedGoddessOrchestra.py -v
          python3 -m unittest tools/test_two_lane_vendor_contract.py tests/test_family_lane_policy.py tests/test_remote_only_vendor_audit.py -v
          python3 tools/companyWideQuarantineAudit.py
          python3 tools/castBridgeStageAudit.py
          python3 tools/deepDungeonSecurityAudit.py
          python3 -m unittest tests/testIndustryLifecycleReduction.py -v
          python3 tools/industryLifecycleReductionAudit.py --source-ref "$LUHM_SOURCE_REF" --output /tmp/luhm-industry-lifecycle.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('/tmp/luhm-industry-lifecycle.json',encoding='utf8'))
          assert r['sourceRef']==os.environ['LUHM_SOURCE_REF']
          assert r['sourceGuard']=='PASS'
          assert r['lane']=='PROPOSED_SOURCE_ONLY'
          assert r['sourceOnly'] is True and r['workflowReductionExecuted'] is False
          assert r['publicBetaReady'] is False and r['marketingPublished'] is False
          assert r['crown']=='STOP'
          print('INDUSTRY_LIFECYCLE_SOURCE_GUARD_PASS_NO_RELEASE')
          PY
      - name: Establish no-dependency private npm developer bridge
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: npm four-quarter source smoke
        working-directory: packages/unified-ops
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --check src/cli.mjs
          node --check src/orchestra.mjs
          npm run audit
          npm run sql-smoke
          npm run song
          npm run plan:local
          npm test
          # Thin-client manager is one bounded adapter in the existing CI gate.
          node --check src/thin-package.mjs
          npm run --silent pkg:plan -- "$LUHM_SOURCE_REF" > /tmp/luhm-thin-plan.json
          npm run --silent pkg:try -- "$LUHM_SOURCE_REF" > /tmp/luhm-thin-try.json
          if npm run --silent pkg:apply -- "$LUHM_SOURCE_REF" > /tmp/luhm-thin-apply.log 2>&1; then
            echo 'UNAUTHORIZED_APPLY_SUCCEEDED' >&2; exit 1
          fi
          grep -q 'APPLY_BLOCKED_EXACT_CAST' /tmp/luhm-thin-apply.log
          python3 - <<'PY'
          import json,os
          plan=json.load(open('/tmp/luhm-thin-plan.json',encoding='utf8'))
          trial=json.load(open('/tmp/luhm-thin-try.json',encoding='utf8'))
          assert plan['sourceRef']==os.environ['LUHM_SOURCE_REF']
          assert plan['mode']=='plan' and trial['mode']=='try'
          assert plan['status']=='GREEN_SOURCE_PLAN_ONLY'
          assert trial['status']=='GREEN_TEMP_SIMULATION_ONLY'
          assert len(plan['decisions'])==10
          assert not plan['packageActionsExecuted'] and not trial['hostChanged']
          assert trial['stagingRemoved'] and not plan['sourceIdentityVerified']
          assert plan['crown']==trial['crown']=='STOP'
          print('THIN_CLIENT_SOURCE_TRY_ROLLBACK_PASS_APPLY_STOP')
          PY
          # Existing gate also executes the exact-head source-only Cathedral preflight.
          npm run --silent plan:cathedral -- "$LUHM_SOURCE_REF" > /tmp/luhm-cathedral-preflight.json
          python3 - <<'PY'
          import json, os
          x=json.load(open('/tmp/luhm-cathedral-preflight.json', encoding='utf8'))
          assert x['sourceRef']==os.environ['LUHM_SOURCE_REF']
          assert x['sourcePreflight']=='PASS_SOURCE_ONLY'
          assert x['releaseAuthorized'] is False and x['crown']=='STOP'
          assert x['autoMerge'] is False and x['automaticCast'] is False
          assert x['blenderExecuted'] is False and x['godotDeviceVerified'] is False
          print('CATHEDRAL_PROPOSED_SOURCE_PRECHECK_ONLY')
          PY
          npm run --silent matrix > /tmp/luhm-orchestra-matrix.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/luhm-orchestra-matrix.json',encoding='utf8'))
          assert x['count']==64
          assert all(i['authority']=='NONE' and not i['liveCapabilityVerified'] for i in x['cells'])
          print('MATRIX_64_INERT_GREEN')
          PY
      - name: No runtime or release authority
        run: |
          echo 'NPM_DEVELOPER_ONLY_NO_NODE_ANDROID_NO_NETWORK_SERVICES'
          echo 'NO_ETC_WRITES_NO_VENDOR_DOWNLOAD_NO_DB_MIGRATION'
          echo 'NO_AGENTS_NO_CAST_DISPATCH_NO_DEPLOY_NO_SIGN_NO_CROWN'
