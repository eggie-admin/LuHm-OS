name: Google AI and Cloudflare MCP Readiness

on:
  pull_request:
    paths:
      - 'tools/googleAiCloudflareReadiness.py'
      - 'tests/testGoogleAiCloudflareReadiness.py'
      - '.github/workflows/google-ai-cloudflare-readiness.yml'
      - 'doctrine/studioCompatibilityFastMeshV1.json'
      - 'doctrine/providerEconomyV1.json'
      - 'doctrine/apiSpineV1.json'
      - 'doctrine/cloudflareAirTrafficControllerV1.json'
      - 'doctrine/cloudflareLumOrchestrationV1.json'
  workflow_dispatch:
    inputs:
      verify_google_metadata:
        type: boolean
        description: 'Owner-only metadata read after main protection, no model generation'
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: google-cloudflare-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  provider-edge-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Exact source checkout with no persistent credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source and hostile controls
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          python3 -m py_compile tools/googleAiCloudflareReadiness.py
          python3 -m unittest tests/testGoogleAiCloudflareReadiness.py -v
      - name: Run harmless public network and origin probes
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/googleAiCloudflareReadiness.py \
            --source-ref "$EXPECTED" --probe-public \
            --output "$RUNNER_TEMP/googleCloudflareReadiness.json"
          echo "GOOGLE_MODELS_GENERATION=NOT_ATTEMPTED"
          echo "GOOGLE_KEY=NOT_REQUESTED_FROM_GITHUB"
          echo "CLOUDFLARE_CONFIG_MUTATION=NOT_ATTEMPTED"
          echo "MCP_SESSION=NOT_VERIFIED_BY_HEAD"
          echo "CROWN=STOP"
      - name: Preserve sanitized source/network receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: google-cloudflare-readiness-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/googleCloudflareReadiness.json
          if-no-files-found: warn
          retention-days: 14

  owner-google-model-metadata:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'eggie-admin' && inputs.verify_google_metadata == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Exact protected main checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deny if Main Protection is not effective
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          gh api "repos/$REPO/branches/main" | jq -e '.protected == true' > /dev/null
          gh api "repos/$REPO/rulesets/25699963" | jq -e '
            .enforcement == "active" and
            ((.conditions.ref_name.include // []) | index("refs/heads/main") != null) and
            ([.rules[]?.type] | index("pull_request") != null and
             index("non_fast_forward") != null and index("deletion") != null)
          ' > /dev/null
      - name: Google AI authenticated models.list only
        env:
          EXPECTED: ${{ github.sha }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
        run: |
          set -euo pipefail
          python3 tools/googleAiCloudflareReadiness.py \
            --source-ref "$EXPECTED" --probe-google-key \
            --output "$RUNNER_TEMP/googleAuthenticatedModels.json"
          jq -e '.googleAi.state == "AUTHENTICATED_MODEL_METADATA" and
            .googleAi.modelGenerationCalled == false and
            .googleAi.costApproval == false and
            .googleAi.modelWorkerDeployed == false' \
            "$RUNNER_TEMP/googleAuthenticatedModels.json" > /dev/null
          echo "GOOGLE_METADATA_VERIFIED_NON_GENERATIVE=TRUE"
          echo "WORKER_ACTIVATION=NOT_AUTHORIZED"
      - name: Preserve credential-free readiness receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: google-ai-owner-metadata-${{ github.sha }}
          path: ${{ runner.temp }}/googleAuthenticatedModels.json
          retention-days: 7
          if-no-files-found: warn
