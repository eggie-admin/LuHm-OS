name: OperationTitan7 Agent Mesh Audit

on:
  pull_request:
    paths:
      - 'doctrine/operationTitan7AgentMeshV1.json'
      - 'doctrine/luhmAiControlPlaneV1.json'
      - 'doctrine/lumGoddessCabinetV1.json'
      - 'agents/lum/SKILL.md'
      - 'agents/urdMutationOni/SKILL.md'
      - 'agents/belldandyQualityOni/SKILL.md'
      - 'agents/skuldResearchOni/SKILL.md'
      - '.codex/**'
      - 'tools/operationTitan7AgentMeshAudit.py'
      - '.github/workflows/operation-titan7-agent-mesh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact source
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Titan7 agent mesh audit
        run: python3 tools/operationTitan7AgentMeshAudit.py
