name: Social Video Orchestrator

on:
  pull_request:
    paths:
      - 'tools/socialVideoOrchestrator.py'
      - 'tests/socialVideoOrchestratorTest.py'
      - '.github/workflows/social-video-orchestrator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: social-video-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LUHM_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Exact-source checkout without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.LUHM_SOURCE_REF }}
          persist-credentials: false
      - name: Verify source identity and compile
        run: |
          test "$(git rev-parse HEAD)" = "$LUHM_SOURCE_REF"
          git diff --check
          python3 -m py_compile tools/socialVideoOrchestrator.py tests/socialVideoOrchestratorTest.py
      - name: Offline social video tests, no publishing
        run: python3 tests/socialVideoOrchestratorTest.py
