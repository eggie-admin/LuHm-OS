name: LuHm ChatGPT Plugin Release Hub

on:
  pull_request:
    paths:
      - 'tools/pluginReleaseHub.py'
      - 'tools/pluginReleasePromotionGate.py'
      - 'tests/testPluginReleaseHub.py'
      - 'tests/testPluginReleasePromotionGate.py'
      - '.github/workflows/plugin-release-hub.yml'
      - 'manual/pluginReleaseHub.md'
  workflow_dispatch:
    inputs:
      releaseChannel:
        description: 'Explicit release channel: proposed, beta, stable'
        type: choice
        options: [proposed, beta, stable]
        required: true
      sourceRef:
        description: 'Exact 40-character CAST-built source commit'
        type: string
        required: true
      packageBuildRunId:
        description: 'Successful Public Plugin Package CAST workflow run ID'
        type: string
        required: true
      expectedSha256:
        description: 'Exact SHA-256 digest from verified CAST package receipt'
        type: string
        required: true
      professorPromotion:
        description: 'Exact one-run owner authorization: PROMOTE_RELEASE'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: plugin-release-hub-${{ github.event_name }}-${{ inputs.releaseChannel || github.ref }}
  cancel-in-progress: false

jobs:
  source-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact source and negative controls
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          python3 -m py_compile tools/pluginReleaseHub.py tools/pluginReleasePromotionGate.py
          python3 -m unittest tests/testPluginReleaseHub.py tests/testPluginReleasePromotionGate.py -v
          git diff --check
          echo "SOURCE_ONLY_GREEN; no GitHub Release published"

  promote-reviewed-package:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CHANNEL: ${{ inputs.releaseChannel }}
      SOURCE_REF: ${{ inputs.sourceRef }}
      PACKAGE_RUN: ${{ inputs.packageBuildRunId }}
      EXPECTED_SHA: ${{ inputs.expectedSha256 }}
      PROFESSOR_PROMOTION: ${{ inputs.professorPromotion }}
    steps:
      - name: Check owner, protected source and exact artifact run BEFORE download
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$PROFESSOR_PROMOTION" = "PROMOTE_RELEASE"
          [[ "$SOURCE_REF" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PACKAGE_RUN" =~ ^[0-9]+$ ]]
          [[ "$CHANNEL" =~ ^(proposed|beta|stable)$ ]]
          owner="$(gh api "repos/$REPO" --jq '.owner.login')"
          test "$GITHUB_ACTOR" = "$owner"
          current="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
          test "$SOURCE_REF" = "$current"
          run="$(gh api "repos/$REPO/actions/runs/$PACKAGE_RUN")"
          test "$(jq -r '.name' <<< "$run")" = "Public Plugin Package CAST"
          test "$(jq -r '.conclusion' <<< "$run")" = "success"
          test "$(jq -r '.event' <<< "$run")" = "workflow_dispatch"
          test "$(jq -r '.head_sha' <<< "$run")" = "$SOURCE_REF"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.sourceRef }}
          persist-credentials: false

      - name: Retrieve exact Kaji CAST artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plugin-dist"
          gh run download "$PACKAGE_RUN" -R "$REPO" -n "public-plugin-package-$SOURCE_REF" -D "$RUNNER_TEMP/plugin-dist"

      - name: Verify artifact, Canon channel boundary, and independent evidence
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/plugin-dist"
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          args=(--folder "$DIST" --channel "$CHANNEL" --source-ref "$SOURCE_REF" --expected-sha256 "$EXPECTED_SHA" --output "$RUNNER_TEMP/promotion.json")
          if test "$CHANNEL" != proposed; then
            # Explicit external-host/iPhone/tester acceptance artifact, not produced
            # by the CAST ZIP builder. Remains fail-closed until independently supplied.
            args+=(--acceptance "$DIST/pluginReleaseAcceptance.json")
          fi
          python3 tools/pluginReleasePromotionGate.py "${args[@]}"
          TAG="$(jq -r .tag "$RUNNER_TEMP/promotion.json")"
          PACKAGE="$(jq -r .package "$RUNNER_TEMP/promotion.json")"
          VERSION="$(jq -r .version "$RUNNER_TEMP/promotion.json")"
          test "$(jq -r .status "$RUNNER_TEMP/promotion.json")" = PASS
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test ! -e "$DIST/$PACKAGE.sha256"
          printf '%s  %s\n' "$EXPECTED_SHA" "$PACKAGE" > "$DIST/$PACKAGE.sha256"
          ( cd "$DIST" && sha256sum -c "$PACKAGE.sha256" )

      - name: Refuse tag overwrite and regression of channel version
        shell: bash
        env:
          TAG: ${{ steps.gate.outputs.tag }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Immutable release tag already exists" >&2; exit 1
          fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag already exists" >&2; exit 1
          fi
          gh api "repos/$REPO/releases?per_page=100" | python3 -c '
          import json,sys,re
          data=json.load(sys.stdin)
          channel,version=sys.argv[1:3]
          target=tuple(map(int,version.split(".")))
          pattern=re.compile(r"^luhm-plugin-"+re.escape(channel)+r"-v(\d+\.\d+\.\d+)-s[a-f0-9]{8}$")
          for rel in data:
              m=pattern.fullmatch(rel.get("tag_name",""))
              if m and not rel.get("draft") and tuple(map(int,m.group(1).split(".")))>=target:
                  raise SystemExit("RED_CHANNEL_VERSION_NOT_NEWER")
          ' "$CHANNEL" "$VERSION"

      - name: Create draft, verify asset listing, then publish channel release
        shell: bash
        env:
          TAG: ${{ steps.gate.outputs.tag }}
          PACKAGE: ${{ steps.gate.outputs.package }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/plugin-dist"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          LUHM_PLUGIN_CHANNEL=$CHANNEL
          LUHM_PLUGIN_SOURCE_SHORT=${SOURCE_REF:0:8}
          Exact source: $SOURCE_REF
          Version: $VERSION
          CAST package build run: $PACKAGE_RUN
          Package SHA-256: $EXPECTED_SHA

          Downloadable plugin ZIP, not an iPhone APK and not an installed ChatGPT app.
          GitHub source/package checks do not prove ChatGPT host installation,
          current-chat UI mount or outside tester acceptance.
          Promotion was explicitly dispatched by repository owner; Crown remains STOP.
          EOF
          gh release create "$TAG" "$DIST/$PACKAGE" "$DIST/$PACKAGE.sha256" \
            -R "$REPO" --target "$SOURCE_REF" --title "LuHm ChatGPT Plugin $CHANNEL v$VERSION" \
            --draft --latest=false --notes-file "$RUNNER_TEMP/notes.md"
          r="$(gh api "repos/$REPO/releases/tags/$TAG")"
          test "$(jq -r '.draft' <<< "$r")" = true
          test "$(jq -r '.target_commitish' <<< "$r")" = "$SOURCE_REF"
          test "$(jq --arg n "$PACKAGE" '[.assets[]|select(.name==$n)]|length' <<< "$r")" -eq 1
          test "$(jq --arg n "$PACKAGE.sha256" '[.assets[]|select(.name==$n)]|length' <<< "$r")" -eq 1
          if test "$CHANNEL" = stable; then
            gh release edit "$TAG" -R "$REPO" --draft=false --prerelease=false --latest
          else
            gh release edit "$TAG" -R "$REPO" --draft=false --prerelease --latest=false
          fi

      - name: Reconcile published receipt, refresh cache and ping actual download
        shell: bash
        env:
          TAG: ${{ steps.gate.outputs.tag }}
          PACKAGE: ${{ steps.gate.outputs.package }}
        run: |
          set -euo pipefail
          # GitHub Release metadata is checked afresh; we never purge other users' CDN.
          result="$(gh api -H 'Cache-Control: no-cache' "repos/$REPO/releases/tags/$TAG")"
          test "$(jq -r .draft <<< "$result")" = false
          if test "$CHANNEL" = stable; then
            test "$(jq -r .prerelease <<< "$result")" = false
          else
            test "$(jq -r .prerelease <<< "$result")" = true
          fi
          url="$(jq -r --arg n "$PACKAGE" '.assets[]|select(.name==$n)|.browser_download_url' <<< "$result")"
          test "$url" = "https://github.com/$REPO/releases/download/$TAG/$PACKAGE"
          curl --fail --location --silent --show-error --retry 3 \
            -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/public-package.zip" "$url"
          echo "$EXPECTED_SHA  $RUNNER_TEMP/public-package.zip" | sha256sum -c -
          echo "RELEASE_DOWNLOAD_PING=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "RELEASE_SOURCE=$SOURCE_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "CROWN=STOP" >> "$GITHUB_STEP_SUMMARY"
