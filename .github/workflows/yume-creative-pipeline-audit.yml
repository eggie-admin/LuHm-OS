name: Yume Creative Pipeline 20-Pass Audit

on:
  pull_request:
    paths:
      - 'agents/yumeArtOni/**'
      - 'agents/mediaAssetFactory/**'
      - 'doctrine/yumeCreativePipelineV1.json'
      - 'doctrine/yumeCommunityArtResourcesV1.json'
      - 'doctrine/artistCreditLedgerV1.json'
      - 'media/artistCreditsApprovedV1.json'
      - 'media/yumeReferenceGalleryV1.json'
      - 'tools/artistCreditIntegrity.py'
      - 'tests/testArtistCreditIntegrity.py'
      - 'doctrine/githubWorkflowBudgetV1.json'
      - 'doctrine/SOURCE_OF_TRUTH.json'
      - 'media/daddys-princess-date/**'
      - 'tools/yumeCreativePipelineAudit.py'
      - '.github/workflows/yume-creative-pipeline-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          python -m json.tool doctrine/yumeCreativePipelineV1.json >/dev/null
          python -m json.tool doctrine/yumeCommunityArtResourcesV1.json >/dev/null
          python -m json.tool doctrine/artistCreditLedgerV1.json >/dev/null
          python -m json.tool doctrine/githubWorkflowBudgetV1.json >/dev/null
          python -m json.tool media/daddys-princess-date/edit-manifest.json >/dev/null
      - name: Run 20-pass Yume audit
        run: python tools/yumeCreativePipelineAudit.py
      - name: Test creator credits and complaint holds
        run: python3 -m unittest discover -s tests -p 'testArtistCreditIntegrity.py' -v
      - name: Enforce separate source references and approved asset credits
        run: python3 tools/artistCreditIntegrity.py
