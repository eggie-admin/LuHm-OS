name: LuHm First-Install Foundation Audit
on:
  pull_request:
    paths:
      - 'README.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'manual/firstInstallFoundation.md'
      - 'doctrine/firstInstallFoundationV1.json'
      - 'plugins/luhm-os/**'
      - 'frontEnd/package.json'
      - 'frontEnd/package-lock.json'
      - 'host/harness/libraryPolicy.json'
      - 'tools/firstInstallFoundationAudit.py'
      - 'tests/testFirstInstallFoundationAudit.py'
      - '.github/workflows/first-install-foundation-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source before tests
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Validate first-install rights, branding, architecture and plugin source
        run: python3 tools/firstInstallFoundationAudit.py
      - name: Test red-path controls
        run: python3 -m unittest tests/testFirstInstallFoundationAudit.py -v
      - name: Proof boundary
        run: |
          echo 'SOURCE_FOUNDATIONS=GREEN_ONLY_IF_TESTS_PASS'
          echo 'CHATGPT_INSTALL_AND_MOUNT=UNVERIFIED'
          echo 'CLOUDFLARE_CUSTOM_DOMAIN=UNVERIFIED'
          echo 'ART_RELEASE_RIGHTS=PER_ASSET_REVIEW_REQUIRED'
          echo 'CROWN=STOP'
