name: Samsung Four-Lane Kernel CAST 500
on:
  pull_request:
    paths:
      - 'doctrine/samsungCast500V1.json'
      - 'infra/four-lane/**'
      - 'tools/samsungCast500Audit.py'
      - 'tools/sixCamTimingAudit.py'
      - 'tests/testSamsungCast500.py'
      - 'manual/samsungFourLaneKernelSnapshot20261030.md'
      - '.github/workflows/samsung-four-lane-cast500.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cast500-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      LUHM_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout immutable reviewed candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.LUHM_SOURCE_REF }}
          persist-credentials: false
      - name: Exact SHA, Python syntax and read-only profile checks
        run: |
          test "$(git rev-parse HEAD)" = "$LUHM_SOURCE_REF"
          git diff --check
          python3 -m json.tool doctrine/samsungCast500V1.json > /dev/null
          python3 -m py_compile tools/samsungCast500Audit.py tools/sixCamTimingAudit.py tests/testSamsungCast500.py
          ruby -rpsych -rjson -e '
            x=Psych.safe_load(File.read("infra/four-lane/samsung-kernel-profiles.yaml"),aliases:false)
            expected=%w[proposed dataLane lts studioForge]
            abort("wrong four release tracks") unless x["profiles"].keys == expected
            abort("authority mutation in profile") unless x["profiles"].values.all? { |v| v["install"] == false && v["firmware"] == "DENY" && v["deviceAuthority"] == "NONE" }
            abort("release tracks are not escalation permissions") unless x["escalation"] == [0,1,2,3]
            abort("crown guard lost") unless x["defaultDeployment"] == "DENY" && x["crownStatus"] == "STOP"
            puts "FOUR_HARD_YAML_PROFILES_PASS"
          '
      - name: Run honest Samsung 500 assessment matrix, runner only
        run: |
          python3 tools/samsungCast500Audit.py --runner --output "${RUNNER_TEMP}/samsung500/snapshot.json"
          python3 -m unittest tests/testSamsungCast500.py -v
      - name: Reuse established Linux VM source kernel 500
        run: |
          python3 tools/kernelVm500Audit.py --runner-scope --output "${RUNNER_TEMP}/samsung500/existing-kernel500.json"
          python3 -m unittest tests/testKernelVm500.py -v
      - name: Cross-check license, architecture and source-safe K9000
        run: |
          python3 tools/vendorApacheAudit.py
          python3 tools/escalationKernelAudit.py
          python3 tools/k9000UniversalHardwareAudit.py
          python3 tools/k9000LocalDriverProbe.py
          node --check frontEnd/k9000.js
      - name: No physical or firmware operations
        run: |
          python3 tools/sixCamTimingAudit.py
          echo "CI RUNNER ONLY. NO SAMSUNG DEVICES PROBED."
          echo "NO GRUB WRITE, GPARTED, BIOS FLASH, DEX HACK, BETA OTA, OR PHYSICAL CAMERA STREAM."
          echo "NO BILLING, SIGNING, OS MIGRATION, CLOUD VM, AGENT UNQUARANTINE OR CROWN."
      - name: Private 500-slot exact-SHA audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: samsung-kernel-cast500-source
          path: ${{ runner.temp }}/samsung500/*.json
          retention-days: 7
          if-no-files-found: warn
