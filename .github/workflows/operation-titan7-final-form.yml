name: OperationTitan7 Final Form Doctrine Foundation Seal

on:
  workflow_dispatch:
    inputs:
      milestoneId:
        description: Explicit Titan7 milestone
        required: true
        default: finalDoctrineFoundationSeal
      tier:
        description: Titan7 escalation tier
        required: true
        type: choice
        options:
          - finalForm
  push:
    branches:
      - 'candidate/**'
    paths:
      - 'doctrine/operations/operationTitan7FinalDoctrineFoundationSealV1.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: titan7-final-form-doctrine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-form:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --check

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Audit plugin registry
        run: python3 tools/workflowPluginRegistryAudit.py

      - name: Audit final-goal foundation contract
        run: python3 tools/finalGoalMutationAudit.py

      - name: Audit goddess trust and naming
        run: |
          python3 tools/goddessTrustSealAudit.py
          python3 tools/namingPathSealAudit.py

      - name: Tier 1 FFS 25-pass audit
        run: python3 tools/operationTitan7FfsTwentyFivePassAudit.py

      - name: Tier 2 Scorched Earth 50-pass audit
        run: python3 tools/operationTitan7FiftyPassAudit.py

      - name: Tier 3 Final Form contract audit
        run: python3 tools/operationTitan7FinalFormAudit.py

      - name: Tourniquet repair-boundary audit
        run: python3 tools/tourniquetAgentLogicAudit.py

      - name: Doctrine foundation structural audit
        run: python3 tools/operationTitan7DoctrineFoundationAudit.py

      - name: Validate jQuery workflow adapters
        run: |
          node --check frontEnd/jquery/luhm.workflowPlugins.js
          node --check frontEnd/jquery/luhm.aiApiBoss.js
          node --check frontEnd/jquery/luhm.codingRoleplay.js

      - name: Upload exact-source doctrine receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operation-titan7-final-doctrine-foundation-${{ github.sha }}
          path: |
            build/titan7-ffs-25pass/
            build/titan7-50pass/
            build/operation-titan7-final-form/
            build/final-goal-contract/
            build/operation-titan7-doctrine-foundation/
          if-no-files-found: error
          retention-days: 30
