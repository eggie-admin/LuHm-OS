name: OperationTitan7 Final Form Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'doctrine/**'
      - 'agents/**'
      - 'tools/**'
      - '.github/workflows/**'

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  final-form:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
      - name: Audit Titan7 final-form wiring
        run: python3 tools/operationTitan7FinalFormAudit.py
      - name: Run Titan7 fleet
        run: python3 tools/titan7WatchFleet.py --json build/titan7-watch-fleet/report.json --markdown build/titan7-watch-fleet/report.md
      - name: Run Project Hydra hard 20-pass audit
        run: python3 tools/projectHydraHard20PassAudit.py
      - name: Audit Cloudflare edge template boundaries
        run: python3 tools/cloudflareEdgeTemplateAudit.py
      - name: Build content-addressed static asset distribution
        run: python3 tools/buildStaticAssetDist.py
      - name: Run full source-truth audit
        run: python3 tools/fullSourceTruthAudit.py --output build/full-source-truth/readiness.json
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operation-titan7-final-form
          path: |
            build/
            frontEnd/distAssets/
          if-no-files-found: error
          retention-days: 30
