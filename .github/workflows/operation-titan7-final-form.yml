name: OperationTitan7 Final Form Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'doctrine/**'
      - 'agents/**'
      - 'tools/**'
      - 'frontEnd/**'
      - 'host/**'
      - 'scripts/**'
      - 'androidWeb3Plugin/**'
      - '.github/workflows/**'

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  final-form:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Setup Java 17
        uses: actions/setup-java@7a445ee88d4e23b52c33d22bb2b2a9e4a1f58f40
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Audit LuHm runtime stack\n        run: python3 tools/runtimeStackAudit.py\n      - name: Audit Titan7 final-form wiring
        run: python3 tools/operationTitan7FinalFormAudit.py
      - name: Run Titan7 fleet
        run: python3 tools/titan7WatchFleet.py --json build/titan7-watch-fleet/report.json --markdown build/titan7-watch-fleet/report.md
      - name: Run Project Hydra hard 20-pass audit
        run: python3 tools/projectHydraHard20PassAudit.py
      - name: Audit Cloudflare edge template boundaries
        run: python3 tools/cloudflareEdgeTemplateAudit.py
      - name: Audit FQDN reverse proxy and mobile-origin boundary
        run: python3 tools/fqdnReverseProxyBoundaryAudit.py
      - name: Audit FQDN and local reverse proxy boundaries
        run: python3 tools/fqdnReverseProxyAudit.py
      - name: Build content-addressed static asset distribution
        run: python3 tools/buildStaticAssetDist.py
      - name: Audit vendor art ingestion negative controls
        run: python3 tools/vendorArtNegativeControls.py
      - name: Audit static vendor CDN metadata
        run: python3 tools/staticVendorMetadataAudit.py
      - name: Run full source-truth audit
        run: python3 tools/fullSourceTruthAudit.py --output build/full-source-truth/readiness.json
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operation-titan7-final-form
          path: |
            build/
            frontEnd/distAssets/
          if-no-files-found: error
          retention-days: 30
