name: LuHm Google Cloud Private VM + One Proof · Offline Audit
on:
  pull_request:
    paths:
      - 'infrastructure/google-cloud-vm/**'
      - 'doctrine/crown-single-proof-v1.json'
      - 'tools/google-cloud-vm-one-proof-audit.py'
      - 'host/api/google-ai-candidate-proxy.py'
      - 'tests/test-google-ai-candidate-proxy.py'
      - 'tools/git-sql-cast-align.py'
      - 'tests/test-git-sql-cast-align.py'
      - 'host/harness/index.html'
      - 'host/harness/samsung-art-desk.js'
      - 'host/harness/samsung-art-desk.css'
      - 'host/mcp/luhmHarness.py'
      - 'infrastructure/samsung-art-desk/**'
      - 'tests/test-samsung-art-desk.cjs'
      - '.github/workflows/google-cloud-vm-one-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-vm-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify zero-mutation VM, DNS, single proof and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/google-cloud-vm-one-proof-audit.py
          node --check host/harness/samsung-art-desk.js
          node tests/test-samsung-art-desk.cjs
          python3 tests/test-git-sql-cast-align.py -v
          python3 tools/git-sql-cast-align.py --check | tee /tmp/luhm-git-sql-check.txt
          grep -Fq '"typedPacketCount": 2' /tmp/luhm-git-sql-check.txt
          grep -Fq '"crown": "STOP"' /tmp/luhm-git-sql-check.txt
          python3 tests/test-google-ai-candidate-proxy.py -v
          python3 host/api/google-ai-candidate-proxy.py --check | grep -Fq '"executionAllowed": false'
          bash -n infrastructure/google-cloud-vm/install-web.sh
          bash -n infrastructure/google-cloud-vm/provision.sh
          bash -n infrastructure/google-cloud-vm/snapshot.sh
          bash infrastructure/google-cloud-vm/snapshot.sh --dry-run | tee /tmp/luhm-snapshot-dry-run.txt
          grep -Fq 'NO_SNAPSHOT_CREATED=TRUE' /tmp/luhm-snapshot-dry-run.txt
          bash infrastructure/google-cloud-vm/provision.sh --dry-run | tee /tmp/luhm-vm-dry-run.txt
          grep -Fq 'NO_PROVIDER_CALLS=TRUE' /tmp/luhm-vm-dry-run.txt
          echo CLOUD_VM_SOURCE_ONLY_PASS
