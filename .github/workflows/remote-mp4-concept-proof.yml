name: Remote MP4 Concept Proof

on:
  push:
    branches: [main]
    paths:
      - 'tools/remoteConceptProof.py'
      - '.github/workflows/remote-mp4-concept-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Generate seven-shot remote MP4
        run: python3 tools/remoteConceptProof.py
      - name: Upload private technical candidate
        uses: actions/upload-artifact@v4
        with:
          name: pirate-daddy-remote-tech-proof
          path: |
            proof-artifacts/pirate-daddy-concept-tech-proof.mp4
            proof-artifacts/receipt.json
          retention-days: 7
