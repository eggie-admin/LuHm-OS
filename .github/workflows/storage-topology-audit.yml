name: Storage Topology Audit

on:
  pull_request:
    paths:
      - "doctrine/storageTopologyV1.json"
      - "doctrine/SOURCE_OF_TRUTH.json"
      - "doctrine/projectChatCanonV1.json"
      - "agents/**"
      - "plugins/luhm-os/skills/**"
      - "tools/storageTopologyAudit.py"
      - ".github/workflows/storage-topology-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/storageTopologyAudit.py
