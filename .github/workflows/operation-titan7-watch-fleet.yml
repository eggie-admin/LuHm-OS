name: OperationTitan7 Watch Fleet

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: titan7-watch-fleet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  titan7:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check

      - name: Goddess trust and naming path seals
        run: |
          python3 tools/goddessTrustSealAudit.py
          python3 tools/namingPathSealAudit.py
          python3 tools/artOniCamelHumpAudit.py

      - name: OperationTitan7 explicit 50-pass audit
        run: python3 tools/operationTitan7FiftyPassAudit.py
      - name: Upload OperationTitan7 50-pass receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operation-titan7-50pass-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/titan7-50pass/report.json
          if-no-files-found: error

      - name: Tourniquet agent logic
        run: python3 tools/tourniquetAgentLogicAudit.py
      - name: Network and FQDN contract
        run: |
          python3 tools/fqdnReverseProxyBoundaryAudit.py
          python3 tools/reverseProxyServiceMapAudit.py
          python3 tools/networkContractReconcile.py
      - name: Asset castBridge contract
        run: python3 tools/assetCastBridgeAudit.py
      - name: Character canon and JRPG pet presentation
        run: python3 tools/characterPetPresentationAudit.py
      - name: Static CDN and vendor boundaries
        run: |
          python3 tools/cloudflareEdgeTemplateAudit.py
          python3 tools/staticVendorMetadataAudit.py
          python3 tools/vendorArtNegativeControls.py
          python3 tools/buildStaticAssetDist.py
      - name: Enterprise exact-source receipt
        run: python3 tools/writeEnterprisePreflightReceipt.py

      - name: Run Titan7 watch fleet
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/titan7WatchFleet.py             --json build/titan7-watch-fleet/report.json             --markdown build/titan7-watch-fleet/report.md
          python3 -m json.tool build/titan7-watch-fleet/report.json >/dev/null

      - name: Assert fail-closed fleet boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/titan7-watch-fleet/report.json").read_text())
          assert report["sourceCommit"] == "${{ github.event.pull_request.head.sha || github.sha }}"
          assert report["watchCount"] >= 20
          assert report["mutationAuthority"] is False
          assert report["buildAuthority"] is False
          assert report["publicationAuthority"] is False
          assert report["productionSigningAuthority"] is False
          assert report["crownStatus"] == "STOP"
          assert report["counts"].get("RED", 0) == 0, report["results"]
          print("TITAN7_WATCH_FLEET=PASS")
          PY

      - name: Upload Titan7 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operation-titan7-watch-fleet
          path: build/titan7-watch-fleet/
          if-no-files-found: error
          retention-days: 30
