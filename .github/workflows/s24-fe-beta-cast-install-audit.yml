name: S24 FE Beta CAST Install Audit

on:
  push:
    branches:
      - beta/yumeArtChatV1-20261002
    paths:
      - "tools/s24FeBetaCastInstall.sh"
      - "tools/s24FeBetaCastInstallAudit.py"
      - ".github/workflows/s24-fe-beta-cast-install-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python tools/s24FeBetaCastInstallAudit.py
