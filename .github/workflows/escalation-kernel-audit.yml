name: Escalation Kernel Audit

on:
  pull_request:
    paths:
      - 'doctrine/escalationKernelV1.json'
      - 'doctrine/founderEscalationLadderV1.json'
      - 'doctrine/corporateEscalationProfileV1.json'
      - 'doctrine/magicEscalationProfileV1.json'
      - 'doctrine/yumeCreativeEscalationV1.json'
      - 'doctrine/operationTitan7ChatTriggerV2.json'
      - 'doctrine/currentSourceTruthV3.json'
      - 'doctrine/luhmAiControlPlaneV1.json'
      - 'agents/shared/ESCALATION_KERNEL_V1.md'
      - 'agents/lum/SKILL.md'
      - 'agents/urdMutationOni/SKILL.md'
      - 'agents/belldandyQualityOni/SKILL.md'
      - 'agents/skuldResearchOni/SKILL.md'
      - 'agents/yumeArtOni/SKILL.md'
      - 'tools/castBridgeLoop.py'
      - 'tests/testCastBridgeLoop.py'
      - 'tools/escalationKernel.py'
      - 'tools/escalationKernelAudit.py'
      - 'tools/hex64Insanus2048Audit.py'
      - 'tests/testHex64Insanus2048Audit.py'
      - 'manual/hex64Insanus2048.md'
      - '.github/workflows/escalation-kernel-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  escalation-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact committed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
      - name: Audit universal escalation kernel
        run: python3 tools/escalationKernelAudit.py
      - name: Test bounded CAST continuation
        run: python3 -m unittest discover -s tests -p testCastBridgeLoop.py -v
      - name: Collect four-ladder exact-source evidence
        run: python3 tools/castBridgeLoop.py
      - name: Test HEX-64 matrix and adversarial source gates
        run: python3 -m unittest discover -s tests -p testHex64Insanus2048Audit.py -v
      - name: Audit 2048 HEX-64 source-policy scenarios
        run: python3 tools/hex64Insanus2048Audit.py
      - name: Preserve CAST evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cast-bridge-loop-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/castBridgeLoop/state.json
            build/hex64Insanus2048/hex64-insanus2048.bin
            build/hex64Insanus2048/hex64-insanus2048.json
          retention-days: 14
