name: WebGlass AAR Diagnostic

on:
  push:
    branches:
      - mutation/functional-cockpit-webglass-20260927
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webglass-aar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact mutation head
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0'

      - name: Compile KAIWebView AAR with diagnostics
        id: gradle
        shell: bash
        run: |
          set +e
          mkdir -p build/diagnostics
          gradle -p native/kaiwebview :kaiwebview:assembleDebug \
            --no-daemon --stacktrace --warning-mode all --console=plain \
            2>&1 | tee build/diagnostics/webglass-gradle.log
          rc=${PIPESTATUS[0]}
          {
            echo '## WebGlass AAR diagnostic'
            echo
            echo "exit_code=$rc"
            echo '```text'
            tail -n 160 build/diagnostics/webglass-gradle.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Preserve diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webglass-aar-diagnostic-${{ github.sha }}
          path: build/diagnostics/webglass-gradle.log
          if-no-files-found: error
          retention-days: 7
