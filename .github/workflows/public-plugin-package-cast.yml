name: Public Plugin Package CAST

on:
  workflow_dispatch:
    inputs:
      cast:
        description: Exact Professor CAST word
        required: true
        type: string
      milestoneId:
        description: Bound milestone
        required: true
        default: publicReleaseCandidate
        type: string
      taskId:
        description: Single-use task identity
        required: true
        type: string
      sourceRef:
        description: Exact 40-character candidate SHA
        required: true
        type: string
      professorActor:
        description: Verified Professor GitHub login carried from direct dispatch or CAST bridge
        required: true
        type: string
      castOriginRunId:
        description: Professor CAST bridge run ID, or direct for owner-authored direct dispatch
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  kaji-public-plugin-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.sourceRef }}
          persist-credentials: false

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ inputs.sourceRef }}"

      - name: Kaji CAST gate
        shell: bash
        env:
          CAST_WORD: ${{ inputs.cast }}
          MILESTONE_ID: ${{ inputs.milestoneId }}
          TASK_ID: ${{ inputs.taskId }}
          SOURCE_REF: ${{ inputs.sourceRef }}
          PROFESSOR_ACTOR: ${{ inputs.professorActor }}
          CAST_ORIGIN_RUN_ID: ${{ inputs.castOriginRunId }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actualRef="$(git rev-parse HEAD)"
          owner="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.login')"

          if [[ "$PROFESSOR_ACTOR" != "$owner" ]]; then
            echo "CAST provenance denied: professorActor=$PROFESSOR_ACTOR repositoryOwner=$owner" >&2
            exit 2
          fi

          if [[ "$GITHUB_ACTOR" == "$PROFESSOR_ACTOR" ]]; then
            if [[ "$CAST_ORIGIN_RUN_ID" != "direct" ]]; then
              echo "CAST provenance denied: owner direct dispatch must use castOriginRunId=direct" >&2
              exit 2
            fi
          elif [[ "$GITHUB_ACTOR" == "github-actions[bot]" ]]; then
            if [[ ! "$CAST_ORIGIN_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "CAST provenance denied: bridge dispatch requires numeric origin run ID" >&2
              exit 2
            fi
            originJson="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAST_ORIGIN_RUN_ID")"
            originEvent="$(jq -r '.event' <<<"$originJson")"
            originActor="$(jq -r '.actor.login' <<<"$originJson")"
            originSha="$(jq -r '.head_sha' <<<"$originJson")"
            if [[ "$originEvent" != "issue_comment" || "$originActor" != "$PROFESSOR_ACTOR" || "$originSha" != "$SOURCE_REF" ]]; then
              echo "CAST provenance denied: origin event/actor/source mismatch" >&2
              exit 2
            fi
          else
            echo "CAST provenance denied: dispatcher $GITHUB_ACTOR is neither Professor nor trusted bridge bot" >&2
            exit 2
          fi

          python3 tools/forgeCastGate.py             --cast-word "$CAST_WORD"             --milestone-id "$MILESTONE_ID"             --task-id "$TASK_ID"             --source-ref "$SOURCE_REF"             --actual-source-ref "$actualRef"             --build-scope "publicPluginPackage"             --actor "$PROFESSOR_ACTOR"             --receipt /tmp/forge-cast-receipt.json

      - name: Build deterministic public plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/buildPublicPluginPackage.py             --source-ref "${{ inputs.sourceRef }}"             --out-dir /tmp/luhm-public-plugin

      - name: Verify package receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, hashlib
          root=pathlib.Path("/tmp/luhm-public-plugin")
          receipt=json.loads((root/"publicPluginPackageBuildReceipt.json").read_text())
          artifact=root/receipt["artifact"]["filename"]
          actual=hashlib.sha256(artifact.read_bytes()).hexdigest()
          assert actual == receipt["artifact"]["sha256"]
          assert receipt["sourceRef"] == "${{ inputs.sourceRef }}"
          assert receipt["buildScope"] == "publicPluginPackage"
          assert receipt["publicationAuthority"] is False
          print("GREEN_PUBLIC_PLUGIN_PACKAGE_RECEIPT")
          PY

      - name: Record ChatGPT host handoff
        shell: bash
        run: |
          set -euo pipefail
          cp doctrine/chatGptPluginCastCompletionV1.json /tmp/luhm-public-plugin/
          cat > /tmp/luhm-public-plugin/chatGptHostHandoff.json <<'JSON'
          {
            "schema": "luhmOs.chatGptHostHandoff.v1",
            "sourceRef": "${{ inputs.sourceRef }}",
            "packageState": "PACKAGE_READY",
            "castState": "HOST_INSTALL_REQUIRED",
            "requiredNextProof": [
              "chatGptHostInstallProved",
              "currentConversationInvocationProved",
              "luhmOpenCockpitRuntimeProved"
            ],
            "finalCastGreen": false,
            "crownStatus": "STOP"
          }
          JSON
          echo "PACKAGE_READY_ONLY final CAST requires ChatGPT host install + current-chat invocation + luhm_open_cockpit proof"

      - name: Upload CAST-scoped artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-plugin-package-${{ inputs.sourceRef }}
          path: |
            /tmp/luhm-public-plugin/*.zip
            /tmp/luhm-public-plugin/publicPluginPackageBuildReceipt.json
            /tmp/luhm-public-plugin/chatGptPluginCastCompletionV1.json
            /tmp/luhm-public-plugin/chatGptHostHandoff.json
            /tmp/forge-cast-receipt.json
          retention-days: 3
          if-no-files-found: error
