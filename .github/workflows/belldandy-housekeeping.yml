name: Belldandy Housekeeping

on:
  pull_request:
    paths:
      - '.github/workflows/belldandy-housekeeping.yml'
      - 'doctrine/belldandyHousekeepingV1.json'
      - 'doctrine/belldandyOperationalQuarantineV1.json'
      - 'doctrine/luhmAiControlPlaneV1.json'
      - 'doctrine/agentTrainingSealV1.json'
      - 'agents/belldandyQualityOni/SKILL.md'
      - 'plugins/luhm-os/skills/belldandy-housekeeping/SKILL.md'
      - 'tools/belldandyHousekeepingAudit.py'
      - 'tools/belldandyCheckpointWindow.py'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit Belldandy contract
        run: python3 tools/belldandyHousekeepingAudit.py

      - name: Check Belldandy operational quarantine
        id: quarantine
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          policy_path = Path("doctrine/belldandyOperationalQuarantineV1.json")
          if not policy_path.is_file():
              print("quarantined=false")
          else:
              policy = json.loads(policy_path.read_text(encoding="utf-8"))
              assert policy.get("schema") == "luhmOs.belldandyOperationalQuarantine.v1"
              assert policy.get("subject") == "belldandySecretary"
              assert policy.get("state") in ("QUARANTINED", "CLEARED")
              print("quarantined=" + str(policy["state"] == "QUARANTINED").lower())
          PY

      - name: Verify nearest-ancestor resolver negative controls
        run: python3 tools/belldandyCheckpointWindow.py --self-test

      - name: Resolve nearest ancestral Belldandy checkpoint
        id: window
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/snapshot/belldandy-*:refs/remotes/origin/snapshot/belldandy-*'
          python3 tools/belldandyCheckpointWindow.py --github-output

      - name: Warn at forty commits
        if: ${{ fromJSON(steps.window.outputs.count) >= 40 && fromJSON(steps.window.outputs.count) < 50 }}
        run: echo "::warning::Ara Ara. Belldandy housekeeping window is at ${{ steps.window.outputs.count }}/50 commits."

      - name: Hard stop before history exceeds fifty
        if: ${{ github.event_name == 'pull_request' && fromJSON(steps.window.outputs.count) >= 50 }}
        run: |
          echo "::error::BELLDANDY_HARD_STOP: 50-commit workflow ceiling reached. Snapshot/reconcile before merge."
          exit 1

      - name: Create protective checkpoint
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON(steps.window.outputs.count) >= 25 && steps.quarantine.outputs.quarantined != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          short="${GITHUB_SHA::8}"
          branch="snapshot/belldandy-auto-${stamp}-${short}"
          git push origin "HEAD:refs/heads/${branch}"
          echo "BELLDANDY_SNAPSHOT_CREATED=${branch}" >> "$GITHUB_STEP_SUMMARY"
          echo "sourceRef=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Housekeeping summary
        run: |
          {
            echo "## Belldandy Housekeeping"
            echo "- checkpoint: ${{ steps.window.outputs.latest }}"
            echo "- commits since checkpoint: ${{ steps.window.outputs.count }}/50"
            echo "- quarantine active: ${{ steps.quarantine.outputs.quarantined }}"
            echo "- protected snapshot suspended during quarantine: ${{ steps.quarantine.outputs.quarantined }}"
            echo "- auto merge: false"
            echo "- auto delete: false"
            echo "- Crown: STOP"
          } >> "$GITHUB_STEP_SUMMARY"
