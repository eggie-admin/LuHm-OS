name: Conversation Modes and Package Delivery Audit

on:
  pull_request:
    paths:
      - 'doctrine/conversationModeRouterV1.json'
      - 'doctrine/npmPluginApkDeliveryV1.json'
      - 'frontEnd/package.json'
      - 'frontEnd/package-lock.json'
      - 'frontEnd/**'
      - 'tools/conversationModeDeliveryAudit.py'
      - '.github/workflows/conversation-mode-delivery-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind source and check whitespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" == "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check
      - name: Audit modes, agent events, npm lock, and APK gate
        run: |
          set -euo pipefail
          python3 -m py_compile tools/conversationModeDeliveryAudit.py
          python3 tools/conversationModeDeliveryAudit.py --output build/conversation-mode-delivery/audit.json
      - name: Reinstall pinned jQuery and run front-end checks
        working-directory: frontEnd
        run: npm run ci
      - name: Upload candidate audit receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conversation-mode-delivery-candidate
          path: build/conversation-mode-delivery/
          if-no-files-found: warn
          retention-days: 14
