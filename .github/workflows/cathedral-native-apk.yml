name: LuHm OS Cathedral Native APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/kaiwebview/**'
      - 'addons/kai_webview/**'
      - 'cockpit/**'
      - 'scripts/buildCathedralNative.sh'
      - 'scripts/platform/kaiWebViewBridge.gd'
      - 'scripts/main.gd'
      - 'project.godot'
      - '.github/workflows/cathedral-native-apk.yml'
  push:
    branches: ['candidate/cathedral-native-webview-20260926']

permissions:
  contents: read

jobs:
  cathedral-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Build and hard-audit native Cathedral
        shell: bash
        run: bash scripts/buildCathedralNative.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhm-os-cathedral-native-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/android/
          if-no-files-found: error
          retention-days: 14
