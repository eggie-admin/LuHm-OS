name: Yume Batch Image Workflow Audit

on:
  pull_request:
    paths:
      - 'doctrine/yumeBatchImageWorkflowV1.json'
      - 'agents/yumeArtOni/**'
      - 'agents/mediaAssetFactory/**'
      - 'tools/yumeBatchImageQueue.py'
      - 'tools/yumeBatchImageWorkflowAudit.py'
      - 'doctrine/currentSourceTruthV3.json'
      - '.github/workflows/yume-batch-image-workflow-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate contracts
        run: |
          python3 -m json.tool doctrine/yumeBatchImageWorkflowV1.json >/dev/null
          python3 -m json.tool agents/yumeArtOni/templates/batch-image-manifest-v1.template.json >/dev/null
          python3 -m py_compile tools/yumeBatchImageQueue.py tools/yumeBatchImageWorkflowAudit.py
      - name: Audit Yume batch-image skeleton
        run: python3 tools/yumeBatchImageWorkflowAudit.py
