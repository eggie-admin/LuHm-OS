name: LuHm MCP Enterprise Scope Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'host/mcp/**'
      - 'plugins/luhm-os/**'
      - 'doctrine/MCP_ENTERPRISE_SCOPE_V1.json'
      - 'tools/luhmMcpEnterpriseAudit.py'
      - 'tools/luhmPluginPackageAudit.py'
      - 'render.yaml'
      - '.github/workflows/luhm-mcp-enterprise-audit.yml'

permissions:
  contents: read

jobs:
  enterprise-mcp-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: host/mcp/requirements.txt

      - name: Install pinned MCP runtime
        run: python -m pip install --disable-pip-version-check -r host/mcp/requirements.txt

      - name: Compile MCP source
        run: python -m py_compile host/mcp/luhmMcpServer.py tools/luhmMcpEnterpriseAudit.py tools/luhmPluginPackageAudit.py

      - name: Enterprise doctrine audit
        run: python tools/luhmMcpEnterpriseAudit.py

      - name: Portable plugin package audit
        run: python tools/luhmPluginPackageAudit.py

      - name: Local source contract
        run: python host/mcp/luhmMcpServer.py --check

      - name: Production source contract
        env:
          LUHM_MCP_PROFILE: production
          LUHM_MCP_FQDN: mcp.eggiebagelface.art
          RENDER_EXTERNAL_HOSTNAME: luhm-os-mcp.onrender.com
        run: python host/mcp/luhmMcpServer.py --check

      - name: Explicit request-scope negative controls
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('host/mcp/luhmMcpServer.py')
          spec = importlib.util.spec_from_file_location('luhm_mcp', path)
          mod = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(mod)

          good = mod._scope_payload('task-1', 'abc1234', 'scope-1', 'abcdef1', 'proof-1')
          mod._require_explicit_scope(good)
          assert good['sessionOwnsAuthority'] is False
          assert good['sessionOwnsSourceTruth'] is False
          assert good['greenAuthority'] is False

          for bad in (
              mod._scope_payload('UNKNOWN', 'abc1234', 'scope-1'),
              mod._scope_payload('task-1', 'UNKNOWN', 'scope-1'),
              mod._scope_payload('task-1', 'abc1234', 'UNKNOWN'),
          ):
              try:
                  mod._require_explicit_scope(bad)
              except ValueError:
                  pass
              else:
                  raise SystemExit('RED_SCOPE_NEGATIVE_CONTROL')

          try:
              mod._scope_payload('task-1', 'abc1234', 'scope-1', 'not-a-sha')
          except ValueError:
              pass
          else:
              raise SystemExit('RED_SCOPE_SHA_CONTROL')

          print('LUHM_MCP_SCOPE_NEGATIVE_CONTROLS_GREEN')
          PY
