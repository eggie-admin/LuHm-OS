name: Urd Clinical Security Practice Audit

on:
  pull_request:
    paths:
      - 'doctrine/urdClinicalSecurityPracticeV1.json'
      - 'doctrine/escalationWorkflowRoomsV1.json'
      - 'doctrine/enterpriseOrientationBridgeV1.json'
      - 'doctrine/luhmAiControlPlaneV1.json'
      - 'doctrine/currentSourceTruthV3.json'
      - 'agents/urdMutationOni/SKILL.md'
      - 'agents/lum/SKILL.md'
      - 'tools/urdClinicalSecurityPracticeAudit.py'
      - '.github/workflows/urd-clinical-security-practice-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor-practice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Urd clinical security practice
        run: python3 tools/urdClinicalSecurityPracticeAudit.py
