name: Open PR Reconciliation v2 Audit

on:
  pull_request:
    paths:
      - 'doctrine/openPrReconciliationV2.json'
      - 'doctrine/chatActivityPresentationV1.json'
      - 'doctrine/operationTitan7ChatTriggerV2.json'
      - 'doctrine/humanCenteredIntentRouterV2.json'
      - 'doctrine/codingRoleplayDirectorV2.json'
      - 'doctrine/characterPetPresentationV1.json'
      - 'doctrine/professorOldMagicStudyMeshV2.json'
      - 'doctrine/professorOldMagicStudyClassSchemaV2.json'
      - 'doctrine/professorOldMagicStudyDeployV2.json'
      - 'doctrine/currentSourceTruthV3.json'
      - 'doctrine/projectChatCanonV1.json'
      - 'doctrine/luhmChatMagicTriggerV1.json'
      - 'doctrine/chatProgressStreamV1.json'
      - 'agents/humanCenteredIntentRouter/SKILL.md'
      - 'agents/professorOldMagicStudy/SKILL.md'
      - 'agents/projectChatBootstrap/SKILL.md'
      - 'frontEnd/**'
      - 'scripts/game/**'
      - 'tools/openPrReconciliationAudit.py'
      - '.github/workflows/open-pr-reconciliation-v2-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate reconciled contracts
        run: |
          python3 -m json.tool doctrine/openPrReconciliationV2.json >/dev/null
          python3 -m json.tool doctrine/chatActivityPresentationV1.json >/dev/null
          python3 -m json.tool doctrine/operationTitan7ChatTriggerV2.json >/dev/null
          python3 -m json.tool doctrine/humanCenteredIntentRouterV2.json >/dev/null
          python3 -m json.tool doctrine/codingRoleplayDirectorV2.json >/dev/null
          python3 -m json.tool doctrine/characterPetPresentationV1.json >/dev/null
          python3 -m json.tool doctrine/professorOldMagicStudyMeshV2.json >/dev/null
          python3 -m json.tool doctrine/professorOldMagicStudyClassSchemaV2.json >/dev/null
          python3 -m json.tool doctrine/professorOldMagicStudyDeployV2.json >/dev/null
          python3 -m py_compile tools/openPrReconciliationAudit.py
      - name: Audit reconciliation
        run: python3 tools/openPrReconciliationAudit.py
