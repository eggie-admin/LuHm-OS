name: samsung-lite-owner-signed-beta
on:
  workflow_dispatch:
    inputs:
      cast:
        description: Exact Professor CAST word
        required: true
        type: string
      sourceRef:
        description: Exact current main commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: samsung-lite-beta-${{ inputs.sourceRef }}
  cancel-in-progress: false
jobs:
  build:
    environment:
      name: luhm-beta-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Exact source checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ inputs.sourceRef }}
      - name: Owner CAST and source gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CAST_WORD: ${{ inputs.cast }}
          SOURCE_REF: ${{ inputs.sourceRef }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$CAST_WORD" | tr '[:upper:]' '[:lower:]')" == "cast"
          test "$GITHUB_ACTOR" == "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.login')"
          [[ "$SOURCE_REF" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" == "$SOURCE_REF"
          test "$SOURCE_REF" == "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          python3 tools/samsung-lite-beta.py
          python3 tests/test-samsung-lite-beta.py
          python3 tests/testSignedBetaWorkflow.py
          python3 tests/testBetaReleaseBaseline.py
      - name: Verify protected signing environment and main branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ENV_INFO="$(gh api "repos/$GITHUB_REPOSITORY/environments/luhm-beta-signing")"
          jq -e '.prevent_self_review == true and
                 (.protection_rules | any(.type == "required_reviewers")) and
                 (.deployment_branch_policy.protected_branches == true)' <<<"$ENV_INFO" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.protected')" == "true"
          echo 'PROTECTED_SIGNING_ENVIRONMENT_GREEN'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36'

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          test -d "$JAVA_HOME"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS
      - name: Build Android Web3 cockpit plugin from exact CAST source
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_ZIP="$RUNNER_TEMP/gradle-8.13-bin.zip"
          curl -fL --retry 5 -o "$GRADLE_ZIP" \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip
          echo '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  '"$GRADLE_ZIP" | sha256sum -c -
          unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon -p androidWeb3Plugin :plugin:assemble
          test -s addons/AndroidWeb3Cockpit/bin/debug/AndroidWeb3Cockpit-debug.aar
          test -s addons/AndroidWeb3Cockpit/bin/release/AndroidWeb3Cockpit-release.aar
          mkdir -p build/android-web3
          sha256sum \
            addons/AndroidWeb3Cockpit/bin/debug/AndroidWeb3Cockpit-debug.aar \
            addons/AndroidWeb3Cockpit/bin/release/AndroidWeb3Cockpit-release.aar \
            | tee build/android-web3/aar-sha256.txt

      - name: Install Godot 4.7.2 + templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fL --retry 5 -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  /tmp/templates.tpz' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          cp -a /tmp/tpl/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          echo 'GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64' >> "$GITHUB_ENV"

      - name: Owner-held beta keystore
        shell: bash
        env:
          BETA_P12_B64: ${{ secrets.LUHM_BETA_SIGNING_P12_B64 }}
          BETA_PASSWORD: ${{ secrets.LUHM_BETA_SIGNING_PASSWORD }}
          BETA_ALIAS: ${{ secrets.LUHM_BETA_SIGNING_ALIAS }}
          TRUSTED_SIGNER: ${{ secrets.LUHM_BETA_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$BETA_P12_B64"
          test -n "$BETA_PASSWORD"
          test -n "$BETA_ALIAS"
          [[ "$TRUSTED_SIGNER" =~ ^[0-9a-f]{64}$ ]]
          KEYSTORE="$RUNNER_TEMP/luhm-owner-beta.p12"
          printf '%s' "$BETA_P12_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" -storepass:env BETA_PASSWORD -alias "$BETA_ALIAS" \
            > "$RUNNER_TEMP/owner-beta-cert.txt"
          OBSERVED="$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/owner-beta-cert.txt" \
            | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$OBSERVED" == "$TRUSTED_SIGNER"
          rm -f "$RUNNER_TEMP/owner-beta-cert.txt"
          echo "OWNER_SIGNING_IDENTITY=VERIFIED"
      - name: Verify version floor and previous distributed beta signer
        shell: bash
        env:
          TRUSTED_SIGNER: ${{ secrets.LUHM_BETA_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          NEXT_CODE="$((200000 + GITHUB_RUN_NUMBER))"
          python3 tools/checkBetaReleaseBaseline.py \
            --next-version-code "$NEXT_CODE" --expected-signer "$TRUSTED_SIGNER"
          echo "BETA_VERSION_CODE=$NEXT_CODE" >> "$GITHUB_ENV"
      - name: Enforce private-asset-free source release
        shell: bash
        run: |
          set -euo pipefail
          test ! -f assets/lum/luhm.glb
          test ! -f assets/lum/luhmRunning.glb
          python3 tools/fdroidTabletSourceAudit.py
          echo 'SOURCE_ONLY_ANDROID_ASSET_FIREWALL_GREEN'
      - name: Stage isolated non-debug beta preset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          preset=Path("export_presets.cfg")
          content=preset.read_text(encoding="utf-8")
          changes={
            'package/unique_name="art.eggiebagelface.luhmos.testing"':
              'package/unique_name="art.eggiebagelface.luhmos.beta"',
            'package/name="LuHm OS Samsung Candidate"':
              'package/name="LuHm OS Tablet Beta"',
            'version/code=116': 'version/code='+os.environ["BETA_VERSION_CODE"],
            'version/name="1.0.16-samsunglayout.1"':
              'version/name="0.1.0-beta.'+os.environ["GITHUB_RUN_NUMBER"]+'"',
          }
          for before,after in changes.items():
              if content.count(before)!=1: raise SystemExit("RED_BETA_PRESET_DRIFT:"+before)
              content=content.replace(before,after)
          preset.write_text(content,encoding="utf-8")
          print("BETA_APPLICATION_ID=art.eggiebagelface.luhmos.beta")
          PY
      - name: Import Godot
        run: '"$GODOT" --headless --editor --path . --quit'
      - name: Export ARM64 non-debug beta
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/luhm-owner-beta.p12
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.LUHM_BETA_SIGNING_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.LUHM_BETA_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build/signed-beta
          "$GODOT" --headless --path . --install-android-build-template \
            --export-release 'Android Proposed' build/signed-beta/samsung-lite-beta.apk
          test -s build/signed-beta/samsung-lite-beta.apk
      - name: Verify exact APK identity and signer
        shell: bash
        env:
          TRUSTED_SIGNER: ${{ secrets.LUHM_BETA_SIGNER_SHA256 }}
          SOURCE_REF: ${{ inputs.sourceRef }}
        run: |
          set -euo pipefail
          APK=build/signed-beta/samsung-lite-beta.apk
          BT="$ANDROID_HOME/build-tools/36.1.0"
          "$BT/aapt" dump badging "$APK" > build/signed-beta/badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" > build/signed-beta/signature.txt
          "$BT/zipalign" -c -P 16 -v 4 "$APK" > build/signed-beta/zipalign.txt
          grep -q "package: name='art.eggiebagelface.luhmos.beta'" build/signed-beta/badging.txt
          grep -q "targetSdkVersion:'36'" build/signed-beta/badging.txt
          grep -q "native-code: 'arm64-v8a'" build/signed-beta/badging.txt
          if grep -q 'application-debuggable' build/signed-beta/badging.txt; then
            echo "RED_DEBUG_CERTIFICATE_MODE" >&2
            exit 2
          fi
          OBSERVED="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            build/signed-beta/signature.txt | head -n1 | tr '[:upper:]' '[:lower:]')"
          test "$OBSERVED" == "$TRUSTED_SIGNER"
          ACTUAL_VERSION="$(sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p" build/signed-beta/badging.txt | head -n1)"
          test "$ACTUAL_VERSION" == "$BETA_VERSION_CODE"
          python3 tools/checkBetaReleaseBaseline.py \
            --next-version-code "$ACTUAL_VERSION" --expected-signer "$TRUSTED_SIGNER"
          sha256sum "$APK" > build/signed-beta/sha256.txt
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          apk=Path("build/signed-beta/samsung-lite-beta.apk")
          badging=Path("build/signed-beta/badging.txt").read_text()
          certs=Path("build/signed-beta/signature.txt").read_text()
          version_match=re.search(r"versionCode='([0-9]+)'",badging)
          cert_match=re.search(r"Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]{64})",certs)
          assert version_match and cert_match, "MISSING_ANDROID_RECEIPT_FIELDS"
          data={"schema":"luhmOs.signedSamsungBeta.v1","sourceRef":os.environ["SOURCE_REF"],
                "apkSha256":hashlib.sha256(apk.read_bytes()).hexdigest(),
                "runId":os.environ["GITHUB_RUN_ID"],
                "applicationId":"art.eggiebagelface.luhmos.beta",
                "appSignerCertificateSha256":cert_match.group(1).lower(),
                "versionCode":int(version_match.group(1)),
                "targetSdk":36,"abi":"arm64-v8a","assetProfile":"sourceOnlyProceduralLum",
                "debuggable":False,"releaseMode":True,"deviceProof":False,"betaUpgradeProof":False,
                "publicPublished":False,"crownStatus":"STOP"}
          Path("build/signed-beta/receipt.json").write_text(json.dumps(data,indent=2)+"\n")
          PY
      - name: Prepare offline F-Droid beta workspace (no publication)
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.sourceRef }}
          TRUSTED_SIGNER: ${{ secrets.LUHM_BETA_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          APK=build/signed-beta/samsung-lite-beta.apk
          BT="$ANDROID_HOME/build-tools/36.1.0"
          VERSION="$(python3 -c 'import json;print(json.load(open("build/signed-beta/receipt.json"))["versionCode"])')"
          APK_SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          python3 tools/stageFdroidTabletBeta.py \
            --apk "$APK" \
            --receipt build/signed-beta/receipt.json \
            --expected-source "$SOURCE_REF" \
            --expected-signer "$TRUSTED_SIGNER" \
            --aapt "$BT/aapt" \
            --apksigner "$BT/apksigner"
          python3 tools/prepareFdroidRepoCandidate.py \
            --stage build/fdroid-beta-stage \
            --expected-source "$SOURCE_REF" \
            --expected-signer "$TRUSTED_SIGNER" \
            --expected-version "$VERSION" \
            --expected-apk-sha256 "$APK_SHA"
          echo 'FDROID_OFFLINE_CANDIDATE_READY_NOT_SIGNED_NOT_PUBLISHED'
      - name: Upload private signed beta candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: samsung-lite-signed-beta-candidate
          path: |
            build/signed-beta/
            build/fdroid-beta-stage/
          if-no-files-found: error
          retention-days: 14
      - name: Remove keystore from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/luhm-owner-beta.p12" "$RUNNER_TEMP/owner-beta-cert.txt"
