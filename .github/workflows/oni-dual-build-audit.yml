name: LuHm OS Oni Dual Build Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'agents/**'
      - 'doctrine/AGENT_MESH_V2.json'
      - 'doctrine/LUM_ORCHESTRATOR_V2.json'
      - 'doctrine/SOURCE_LAYOUT_V1.json'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scripts/**'
      - 'scenes/**'
      - 'cockpit/**'
      - 'addons/kai_webview/**'
      - 'native/kaiwebview/**'
      - 'assets/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/oni-dual-build-audit.yml'

permissions:
  contents: read

concurrency:
  group: oni-dual-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Lum Mesh Fast Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate agent contracts and negative controls
        run: |
          set -euo pipefail
          python3 -m json.tool doctrine/AGENT_MESH_V2.json >/dev/null
          python3 -m json.tool doctrine/LUM_ORCHESTRATOR_V2.json >/dev/null
          python3 -m json.tool doctrine/SOURCE_LAYOUT_V1.json >/dev/null
          python3 -m json.tool assets/pet/oni/manifest.json >/dev/null
          python3 tests/agentMeshSmoke.py
          python3 tests/testAgentMeshV2.py
          python3 tools/petIconManifestAudit.py --output build/pet-icons/manifest-audit.json
          python3 tools/lumTaskRouter.py direct >/dev/null
          python3 tools/lumTaskRouter.py art >/dev/null
          python3 tools/lumTaskRouter.py media >/dev/null
          python3 tools/lumTaskRouter.py dictation >/dev/null
          python3 tools/lumTaskRouter.py build --truth-sensitive >/dev/null
          echo 'LUM_MESH_PREFLIGHT=GREEN'

      - name: Upload pet and agent preflight receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lum-mesh-fast-preflight
          path: build/pet-icons/
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build Oni ${{ matrix.oni }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        oni: [Tetsu, Kaji]
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build exact source independently
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/buildCathedralWebglass.sh
          scripts/buildCathedralWebglass.sh

      - name: Write Build Oni identity receipt
        env:
          ONI: ${{ matrix.oni }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          oni = os.environ['ONI']
          role = 'builder_a' if oni == 'Tetsu' else 'builder_b'
          data = {
              'schema': 'luhm-os.oni-builder-receipt.v1',
              'name': oni,
              'role': role,
              'sourceSha': os.environ['SOURCE_SHA'],
              'runId': os.environ['RUN_ID'],
              'jobId': f"build-{oni.lower()}",
              'workflow': os.environ['WORKFLOW_NAME'],
              'timestampUtc': datetime.now(timezone.utc).isoformat(),
              'promotionAuthority': False,
          }
          path = Path('build/android/oni-builder.json')
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(data, indent=2))
          PY

      - name: Upload independent Build Oni evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oni-build-${{ matrix.oni }}
          path: build/android/
          if-no-files-found: error
          retention-days: 30

  doctor-oni:
    name: Dr. Nao Source Truth Verdict
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact adjudicator source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download Tetsu evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: oni-build-Tetsu
          path: build/doctor-input/Tetsu

      - name: Download Kaji evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: oni-build-Kaji
          path: build/doctor-input/Kaji

      - name: Dr. Nao fail-closed adjudication
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/doctorOniAudit.py \
            --expected-sha "$SOURCE_SHA" \
            --tetsu build/doctor-input/Tetsu \
            --kaji build/doctor-input/Kaji \
            --output build/doctor-oni/verdict.json

      - name: Upload Doctor Oni verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: doctor-oni-verdict
          path: build/doctor-oni/
          if-no-files-found: warn
          retention-days: 30
