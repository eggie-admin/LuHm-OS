name: Into the Warp Lab Previs Proof
on:
  pull_request:
    paths:
      - 'scripts/into-the-warp-lab-previs.gd'
      - 'scenes/into-the-warp-lab-previs.tscn'
      - 'tools/into-the-warp-lab-previs-smoke.gd'
      - 'cutscenes/into-the-warp-lab-previs.json'
      - '.github/workflows/into-the-warp-lab-previs.yml'

permissions:
  contents: read

jobs:
  godot-proxy-movie:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Candidate scope check
        run: |
          set -euo pipefail
          python3 -m json.tool cutscenes/into-the-warp-lab-previs.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("cutscenes/into-the-warp-lab-previs.json").read_text())
          assert m["status"]=="CANDIDATE_PROXY_ONLY"
          assert m["actors"]["eggie"]=="HUMAN_PROXY_NOT_CANON"
          assert m["monitors"]==4 and m["publicRelease"] is False
          assert m["autoMerge"] is False and m["externalArtUsed"] is False
          print("GREEN_CANDIDATE_SCOPE_ONLY")
          PY
      - name: Pin Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Godot import and instantiate
        run: |
          set -euo pipefail
          bin=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$bin" --headless --editor --path . --quit
          "$bin" --headless --path . --script res://tools/into-the-warp-lab-previs-smoke.gd
      - name: Explicitly scoped preview movie
        env:
          LUHM_CAST: cast
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          test "$LUHM_CAST" = cast
          command -v xvfb-run
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffprobe
          mkdir -p /tmp/lab/frames
          # The project's 1280x720 gameplay override beats --resolution.
          # Set 9:16 only on this disposable Actions checkout, never in main.
          cp project.godot /tmp/lab/original-project.godot
          python3 - <<'PY'
          from pathlib import Path
          p=Path("project.godot")
          s=p.read_text()
          changes={
              "window/size/viewport_width=720":"window/size/viewport_width=1080",
              "window/size/viewport_height=720":"window/size/viewport_height=1920",
              "window/size/window_width_override=1280":"window/size/window_width_override=1080",
              "window/size/window_height_override=720":"window/size/window_height_override=1920",
          }
          for before,after in changes.items():
              assert s.count(before)==1, f"expected one {before} in exact checkout"
              s=s.replace(before,after)
          p.write_text(s)
          Path("/tmp/lab/capture-override.txt").write_text(
              "CI-only window/viewport override 1080x1920; tracked project.godot unchanged in GitHub.\n"
          )
          PY
          bin=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          xvfb-run -a -s "-screen 0 1280x2160x24" \
            "$bin" --rendering-driver opengl3 --path . --fixed-fps 30 \
              --resolution 1080x1920 --write-movie /tmp/lab/frames/shot.png \
              res://scenes/into-the-warp-lab-previs.tscn
          test -s /tmp/lab/frames/shot00000000.png
          bash scripts/encode-yume-cutscene-proof.sh /tmp/lab/frames /tmp/lab/into-the-warp-lab-previs.mp4 30
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of json \
            /tmp/lab/into-the-warp-lab-previs.mp4 > /tmp/lab/stream.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/lab/stream.json"))["streams"][0]
          assert (d["width"],d["height"],d["r_frame_rate"]) == (1080,1920,"30/1"),d
          print("GREEN_REAL_GODOT_MOVIE_SCOPE")
          PY
          sha256sum /tmp/lab/into-the-warp-lab-previs.mp4 > /tmp/lab/sha256.txt
          cp /tmp/lab/frames/shot00000000.png /tmp/lab/first-frame.png
          cp cutscenes/into-the-warp-lab-previs.json /tmp/lab/manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: into-the-warp-lab-previs-proxy-only
          path: |
            /tmp/lab/into-the-warp-lab-previs.mp4
            /tmp/lab/first-frame.png
            /tmp/lab/sha256.txt
            /tmp/lab/manifest.json
            /tmp/lab/capture-override.txt
          retention-days: 7
          if-no-files-found: error
