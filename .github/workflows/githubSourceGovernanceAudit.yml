name: GitHub Source Governance Audit
on:
  pull_request:
    paths:
      - 'doctrine/githubSourceHardeningV1.json'
      - 'tools/githubSourceGovernanceAudit.py'
      - 'doctrine/communityForkChannelsV1.json'
      - 'tools/communityForkChannelAudit.py'
      - 'tests/testCommunityForkChannels.py'
      - 'manual/community-forks-and-vendors.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - '.github/dependabot.yml'
      - '.github/workflows/githubSourceGovernanceAudit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      LUHM_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Exact-source checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.LUHM_SOURCE_REF }}
          persist-credentials: false
      - name: Offline governance and fork negative controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LUHM_SOURCE_REF"
          python3 -m py_compile tools/githubSourceGovernanceAudit.py tools/communityForkChannelAudit.py tests/testCommunityForkChannels.py
          python3 tools/githubSourceGovernanceAudit.py
          python3 -m unittest tests.testCommunityForkChannels -v
          python3 tools/communityForkChannelAudit.py --source-ref "$LUHM_SOURCE_REF" > "$RUNNER_TEMP/community-fork-receipt.json"
          python3 - "$RUNNER_TEMP/community-fork-receipt.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf8"))
          assert r["sourceAudit"]=="PASS" and r["vendorForksCreated"]==0
          assert r["securitySettingsLiveVerified"] is False
          assert r["packagePublished"] is False and r["runtimeProven"] is False
          assert r["releaseApproved"] is False and r["crown"]=="STOP"
          print("FORK_CHANNEL_SOURCE_AUDIT_PASS_NO_RELEASE")
          PY
