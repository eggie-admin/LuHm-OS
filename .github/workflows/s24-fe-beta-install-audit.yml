name: S24 FE Beta Install Audit

on:
  push:
    branches:
      - beta/yumeArtChatV1-20261002
    paths:
      - "tools/s24FeBetaInstall.sh"
      - "tools/s24FeBetaInstallAudit.py"
      - "doctrine/s24FeBetaInstallV1.json"
      - ".github/workflows/s24-fe-beta-install-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python tools/s24FeBetaInstallAudit.py
