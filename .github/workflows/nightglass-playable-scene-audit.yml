name: LuHm-OS Nightglass Playable Scene Audit
on:
  pull_request:
    paths:
      - 'game/studio/**'
      - 'host/api/creatorStudioV1.sql'
      - 'tools/creatorStudio.py'
      - 'tests/test_creatorStudio.py'
      - 'scenes/NightglassHub.tscn'
      - 'scripts/game/nightglassHub.gd'
      - 'scripts/game/gameHud.gd'
      - 'scripts/main.gd'
      - 'tests/nightglassRuntimeSmoke.gd'
      - '.github/workflows/nightglass-playable-scene-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playable:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate original manuscript and portable SQL
        run: |
          set -euo pipefail
          python3 -m json.tool game/studio/nightglassHubV1.json >/dev/null
          python3 -m py_compile tools/creatorStudio.py tests/test_creatorStudio.py
          python3 tools/creatorStudio.py validate game/studio/nightglassHubV1.json
          python3 -m unittest discover -s tests -p 'test_creatorStudio.py' -v
      - name: Fetch pinned Godot 4.7.2 binary
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import exact project source and parse Godot scripts
        run: |
          set -euo pipefail
          godot=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$godot" --headless --editor --path . --quit 2>&1 | tee /tmp/nightglass-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script' /tmp/nightglass-import.log
      - name: Exercise actual Godot runtime from menu through interactive Vesper
        run: |
          set -euo pipefail
          godot=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$godot" --headless --path . --script res://tests/nightglassRuntimeSmoke.gd 2>&1 | tee /tmp/nightglass-runtime.log
          grep -Fq 'NIGHTGLASS_GODOT_SCENE_SMOKE_GREEN' /tmp/nightglass-runtime.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|NIGHTGLASS_RUNTIME_RED' /tmp/nightglass-runtime.log
      - name: Verify no release or provider authority
        run: |
          python3 - <<'PY'
          import json
          w=json.load(open('game/studio/nightglassHubV1.json'))
          assert w['product']=='LuHm-OS'
          assert w['assetPolicy']['thirdPartyDataAllowed'] is False
          assert w['orchestration']['liveWorkerState']=='QUARANTINED'
          assert w['release']['cast']=='STOP'
          assert w['release']['androidInstalled'] is False
          print('PLAYABLE_SCENE_SOURCE_VALID / HOST_MOUNT_UNPROVEN / CROWN_STOP')
          PY
