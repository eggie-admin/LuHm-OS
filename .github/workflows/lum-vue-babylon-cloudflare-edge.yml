name: Lum Vue Babylon Cloudflare Edge Candidate

on:
  pull_request:
    paths:
      - 'frontEnd/prototypes/lumEdge/**'
      - '.github/workflows/lum-vue-babylon-cloudflare-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-webgl-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify bounded source modules
        run: |
          set -euo pipefail
          node --check frontEnd/prototypes/lumEdge/src/lum-local-model.mjs
          node --check frontEnd/prototypes/lumEdge/src/lum-avatar.js
          node --check frontEnd/prototypes/lumEdge/src/main.js
          node --check frontEnd/prototypes/lumEdge/src/babylon-world.js
      - name: npm dependency install with scripts disabled
        working-directory: frontEnd/prototypes/glassWorld
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bounded unit checks and real Vite production build
        working-directory: frontEnd/prototypes/glassWorld
        run: npm run check
      - name: Verify Cloudflare output and no private art
        working-directory: frontEnd/prototypes/glassWorld
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/_headers
          grep -q "script-src 'self'" dist/_headers
          if find dist -type f \( -iname '*.glb' -o -iname '*.blend' -o -iname '*.pck' -o -iname '*.apk' \) | grep -q .; then
            echo 'RED_PRIVATE_BINARY_IN_STATIC_OUTPUT'
            exit 1
          fi
      - name: Retain public-safe preview bundle for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lum-vue-babylon-static-edge-candidate
          path: frontEnd/prototypes/lumEdge/dist/
          if-no-files-found: error
          retention-days: 7
