name: LuHm Stable Plugin Update Spine Audit

on:
  pull_request:
    paths:
      - 'doctrine/stablePluginUpdateSpineV1.json'
      - 'host/mcp/luhmUpdateSpine.py'
      - 'host/mcp/luhmHarnessServer.py'
      - 'tests/testLuhmUpdateSpine.py'
      - 'manual/stablePluginUpdateArchitecture20261012.md'
      - '.github/workflows/stable-plugin-update-spine-audit.yml'
  push:
    branches: [main]
    paths:
      - 'doctrine/stablePluginUpdateSpineV1.json'
      - 'host/mcp/luhmUpdateSpine.py'
      - 'host/mcp/luhmHarnessServer.py'
      - 'tests/testLuhmUpdateSpine.py'
      - 'manual/stablePluginUpdateArchitecture20261012.md'
      - '.github/workflows/stable-plugin-update-spine-audit.yml'

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install bounded test dependency
        run: python -m pip install 'starlette==0.50.0'
      - name: Compile and exercise update spine
        run: |
          python -m py_compile host/mcp/luhmUpdateSpine.py host/mcp/luhmHarnessServer.py
          python -m unittest tests/testLuhmUpdateSpine.py -v
      - name: Check stable host and Crown boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          c=json.loads((root/'doctrine/stablePluginUpdateSpineV1.json').read_text())
          assert c['crownStatus']=='STOP'
          assert c['singleInstallShell']['reinstallForPresentationChange'] is False
          assert c['updateManifest']['currentAssetRouting']=='same-origin Render /harness/assets/'
          assert c['trafficControl']['cdnLane']=='CANDIDATE_UNVERIFIED'
          assert c['security']['noRemoteCodeExecution'] is True
          print('GREEN_STABLE_HOST_UPDATE_SOURCE_ONLY')
          PY
