name: Subsidiary AI Mesh Audit

on:
  pull_request:
    paths:
      - 'doctrine/luhmSubsidiaryAiMeshV1.json'
      - 'tools/luhmSubsidiaryAiMeshAudit.py'
      - '.github/workflows/subsidiary-ai-mesh-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit subsidiary AI mesh contract
        run: python3 tools/luhmSubsidiaryAiMeshAudit.py
