name: Reaper CC asset intake (source-only)
on:
  push:
    branches: [candidate/reaper-film-yume-20261120]
    paths: ['.github/workflows/reaper-cc-asset-intake.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cc0-source-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract CC0 footage index from archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p intake
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          import html,json,re
          url='https://footorage.com/footage/'
          with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; film asset indexing)"}),timeout=45) as response:
            data=response.read(5_000_000).decode('utf-8','replace')
          items=[]
          for match in re.finditer(r'<article class="card"(?P<inner>.*?)</article>',data,re.S):
            s=match.group('inner')
            idm=re.search(r'data-id="(arc_\d+)"',s)
            title=re.search(r'data-title="([^"]+)"',s)
            vid=re.search(r'<video[^>]*src="([^"]+)"',s)
            if idm and title and vid:
              items.append({"id":idm.group(1),"title":html.unescape(title.group(1)),"url":vid.group(1),"license":"CC0 1.0 claimed by https://footorage.com/faq/"})
          assert len(items)>1000,len(items)
          Path('intake/FOOTORAGE_INDEX.json').write_text(json.dumps(items,indent=2)+"\n",encoding='utf-8')
          terms=['fire','flame','smoke','rain','fog','cemetery','grave','steel','factory','mill','industrial','bridge','river','bank','office','hospital','bully','fight','crowd','city street','street','train','skyscraper','police','night','funeral','electric','power','automobile']
          hits=[x for x in items if any(w in x['title'].lower() for w in terms)]
          print("INDEX",len(items),"MATCHES",len(hits))
          for x in hits[:100]:print(x['id'],x['title'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reaper-cc0-footorage-index
          path: intake/FOOTORAGE_INDEX.json
          retention-days: 1
