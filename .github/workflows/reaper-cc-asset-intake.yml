name: Reaper CC asset intake (source-only)
on:
  push:
    branches:
      - candidate/reaper-film-yume-20261120
    paths:
      - '.github/workflows/reaper-cc-asset-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch-licensed-media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Find CC0 alternative archive source after Commons rate limit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          import re
          url="https://footorage.com/footage/"
          try:
            req=Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; CC0 public film research)"})
            with urlopen(req,timeout=30) as response:
              html=response.read(4_000_000).decode("utf-8","replace")
              print("FOOTORAGE",response.status,len(html),response.headers.get("Content-Type"))
            for term in ["Smoke Drifting Past","Steel Mill Workers","\.mp4","footage-card","cdn.footorage.com","Download MP4"]:
              matches=list(re.finditer(term,html,re.I))
              print("MATCH",term,len(matches))
              for m in matches[:2]:print("NEARBY",re.sub(r"\s+"," ",html[max(0,m.start()-230):m.end()+230])[:500])
          except Exception as error:
            print("FOOTORAGE PROBE ERROR",type(error).__name__,str(error)[:300])
          PY
