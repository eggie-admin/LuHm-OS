name: Parallel Escalation Audit

on:
  pull_request:
    paths:
      - 'doctrine/operationTitan7ChatTriggerV2.json'
      - 'doctrine/escalationWorkflowRoomsV1.json'
      - 'doctrine/yumeCreativeEscalationV1.json'
      - 'doctrine/yumeCreativePipelineV1.json'
      - 'agents/yumeArtOni/SKILL.md'
      - 'tools/parallelEscalationAudit.py'
      - '.github/workflows/parallel-escalation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parallel-escalation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit technology and creative escalation ladders
        run: python3 tools/parallelEscalationAudit.py
