name: LuHm OpenAI Bridge Offline Gate

on:
  pull_request:
    paths:
      - "host/api/luhmOpenAiChatBridge.py"
      - "host/mcp/luhmOpenAiChatTools.py"
      - "host/mcp/luhmHarnessServer.py"
      - "plugins/luhm-os/skills/luhm-openai-chat-bridge/**"
      - "tests/testOpenAiChatBridge.py"
      - "host/remote/luhmWmsVmManager.py"
      - "host/mcp/luhmWmsVmTools.py"
      - "doctrine/remoteWmsMachineBridgeV1.json"
      - "doctrine/remoteWmsPluginSlotsV1.json"
      - "tests/testWmsVmManager.py"
      - ".github/workflows/openai-chat-bridge-offline.yml"
      - "doctrine/lumTwoLaneFastApiOrchestrationV1.json"
      - "doctrine/cryptoBreathingEscalationV1.json"
      - "host/api/luhmCanonOrchestration.py"
      - "host/api/luhmClientFastApi.py"
      - "host/api/luhmCryptoBreathing.py"
      - "host/api/luhmCryptoSqlite.py"
      - "host/api/luhmMariaDbReceipt.py"
      - "host/api/luhmMariaDbReceiptV1.sql"
      - "host/mcp/luhmOrchestrationTools.py"
      - "host/mcp/luhmCryptoTools.py"
      - "tests/testCryptoBreathing.py"
      - "tests/testCryptoSqlite.py"
      - "tests/testCanonFastApi.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-bridge-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned local-test-only dependencies
        run: python -m pip install 'cryptography==46.0.4' 'fastapi==0.128.2' 'httpx==0.28.1'
      - name: Compile staged bridge and ASGI modules
        run: python -m py_compile host/api/luhmOpenAiChatBridge.py host/mcp/luhmOpenAiChatTools.py host/remote/luhmWmsVmManager.py host/mcp/luhmWmsVmTools.py host/api/luhmCanonOrchestration.py host/api/luhmClientFastApi.py host/api/luhmCryptoBreathing.py host/api/luhmCryptoSqlite.py host/api/luhmMariaDbReceipt.py host/mcp/luhmOrchestrationTools.py host/mcp/luhmCryptoTools.py
      - name: Test offline and quarantine gates
        run: python -m unittest discover -s tests -p 'testOpenAiChatBridge.py' -v
      - name: Test WMS VM manager no-network and Canon guards
        run: python -m unittest discover -s tests -p 'testWmsVmManager.py' -v
      - name: Test R1-R4 authenticated snapshot, MariaDB and SQLite receipt gates
        run: |
          python -m unittest discover -s tests -p 'testCryptoBreathing.py' -v
          python -m unittest discover -s tests -p 'testCryptoSqlite.py' -v
      - name: Test FastAPI private authentication and bounded checkpointing
        run: python -m unittest discover -s tests -p 'testCanonFastApi.py' -v
