name: LuHm Agent Final System

on:
  workflow_dispatch:
  push:
    branches:
      - 'candidate/luhm-agent-final-system-20260927'
  pull_request:
    paths:
      - 'agents/**'
      - 'assets/system/**'
      - 'deploy/**'
      - 'scripts/game/agentMeshContract.gd'
      - 'scripts/buildCathedralWebglass.sh'
      - 'scripts/auditCathedralWebglass.py'
      - 'tests/agentMeshContractSmoke.gd'
      - 'tests/agentMeshPackSmoke.gd'
      - 'tests/finalCoffeeHouseSmoke.gd'
      - 'tools/agentMeshAudit.py'
      - 'tools/agentHostReceipt.py'
      - 'doctrine/luhmAgentMeshFinal-20260927.json'
      - 'doctrine/androidCandidate.json'
      - 'doctrine/SOURCE_OF_TRUTH.json'
      - 'doctrine/RELEASE_BOUNDARY.json'
      - 'export_presets.cfg'
      - '.github/workflows/luhm-agent-final-system.yml'

permissions:
  contents: read

concurrency:
  group: luhm-agent-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-apk-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'

      - name: OpenAI SDK pin and mesh construction
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps -r agents/requirements.lock
          python -m pip check
          python - <<'PY'
          import importlib.metadata
          version = importlib.metadata.version('openai-agents')
          assert version == '0.22.3', version
          print('OPENAI_AGENTS_VERSION=' + version)
          PY
          python -m py_compile agents/luhm_mesh.py tools/agentMeshAudit.py tools/agentHostReceipt.py scripts/auditCathedralWebglass.py
          bash -n deploy/installLuhmAgentMesh.sh
          python -m json.tool doctrine/luhmAgentMeshFinal-20260927.json >/dev/null
          python -m json.tool doctrine/androidCandidate.json >/dev/null
          python -m json.tool doctrine/SOURCE_OF_TRUTH.json >/dev/null
          python agents/luhm_mesh.py --self-test | tee /tmp/luhm-agent-self-test.json
          python tools/agentMeshAudit.py
          python scripts/auditCathedralWebglass.py

      - name: Full Cathedral Android build
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/buildCathedralWebglass.sh

      - name: Embedded mesh and final scene smoke
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          test -x "$GODOT"
          "$GODOT" --headless --path . --script tests/agentMeshContractSmoke.gd
          "$GODOT" --headless --path . --script tests/finalCoffeeHouseSmoke.gd

      - name: Final system candidate receipt
        run: |
          set -euo pipefail
          mkdir -p build/final-system
          cp /tmp/luhm-agent-self-test.json build/final-system/agent-self-test.json
          printf 'source_sha=%s\nstatus=EXACT_HEAD_CI_PROOF\nhost_runtime=UNPROVED\nphysical_samsung=UNPROVED\ncanonical_main=PRESERVED\n' "${{ github.event.pull_request.head.sha || github.sha }}" > build/final-system/receipt.txt
          sha256sum agents/luhm_mesh.py agents/requirements.lock assets/system/luhmAgentMesh.json doctrine/luhmAgentMeshFinal-20260927.json doctrine/androidCandidate.json doctrine/SOURCE_OF_TRUTH.json tools/agentHostReceipt.py > build/final-system/SHA256SUMS.txt
          test -s build/android/sha256.txt
          test -s build/android/signature.txt
          test -s build/android/zipalign.txt
          test -s build/android/luhm-agent-mesh-doctrine.json
          test -s build/android/luhm-agent-mesh-contract.json
          grep -q 'Verification successful' build/android/zipalign.txt
          grep -q 'internet_permission=false' build/android/cathedral-atelier-receipt.txt
          grep -q 'openai_runtime_in_apk=false' build/android/cathedral-atelier-receipt.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luhm-agent-final-system-evidence
          path: |
            build/final-system/
            build/android/
          if-no-files-found: error
          retention-days: 30
