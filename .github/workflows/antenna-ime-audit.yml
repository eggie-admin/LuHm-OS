name: Antenna IME Candidate Audit

on:
  pull_request:
    paths:
      - 'antennaIme/**'
      - 'doctrine/samsungAntennaV1.json'
      - '.github/workflows/antenna-ime-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.1.0' 'platforms;android-36'
      - name: Build Antenna candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.13-bin.zip
          echo '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  '"$RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon -p antennaIme :app:assembleDebug
          APK=antennaIme/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" | tee antennaIme/badging.txt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$APK" | tee antennaIme/signature.txt
          sha256sum "$APK" | tee antennaIme/sha256.txt
          grep -q 'art.eggiebagelface.luhmos.antenna' antennaIme/badging.txt
          echo 'ANTENNA_IME_BUILD_GREEN'
