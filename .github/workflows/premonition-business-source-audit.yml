name: Premonition Samsung and Meta Business Safety Gate
on:
  pull_request:
    paths:
      - 'doctrine/premonitionBusinessLaunchV1.yaml'
      - 'doctrine/metaBusinessConnectorV1.yaml'
      - 'doctrine/creatorPrivacyShieldV1.yaml'
      - 'tests/testCreatorPrivacyShield.py'
      - 'tests/testMetaBusinessConnector.py'
      - 'tests/testPremonitionBusinessLaunch.py'
      - '.github/workflows/premonition-business-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-business-proof-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Refuse stale SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Parse reviewed YAML
        run: python3 -m pip install --break-system-packages 'PyYAML==6.0.2'
      - name: Validate business source only
        run: |
          python3 -m unittest discover -s tests -p 'testPremonitionBusinessLaunch.py' -v
          python3 -m unittest discover -s tests -p 'testMetaBusinessConnector.py' -v
          python3 -m unittest discover -s tests -p 'testCreatorPrivacyShield.py' -v
      - name: Print evidence ceiling
        run: |
          echo 'PRIVATE_OWNER_INSTAGRAM_VERIFICATION=REPORTED_NOT_COPIED_TO_PUBLIC_SOURCE'
          echo 'SAMSUNG_COMMERCIAL_SELLER_APPROVAL=UNVERIFIED'
          echo 'META_MONETIZATION_ELIGIBILITY=UNVERIFIED'
          echo 'META_OWNER_OAUTH=REQUIRES_CONNECTION_IN_CHAT'
          echo 'INSTAGRAM_LOGIN_MINIMUM_SCOPE=instagram_business_basic'
          echo 'META_PUBLISH_SPEND_AND_DM_WRITE=OFF'
          echo 'PUBLIC_OWNER_IDENTITY_AND_CONTACT_DETAILS=NOT_STORED'
          echo 'VERIFIED_NAME_CHANGES=BLOCKED_PENDING_OWNER_PREFLIGHT'
          echo 'SOCIAL_PRIVACY_SETTINGS=NOT_READ_OR_MUTATED'
          echo 'PERSONAL_TO_CREATOR_BRAND_LINKAGE=OWNER_CONTROLLED'
          echo 'DBA_DOCUMENTS_AND_SIGNING_KEYS=PRIVATE_NOT_READ'
          echo 'BUSINESS_ACCOUNT_CONNECTIONS_AND_PUBLICATION=NONE'
          echo 'SOURCE_REVIEW_ONLY=TRUE'
          echo 'CROWN=STOP'
