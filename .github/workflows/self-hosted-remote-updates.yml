name: LuHm Self Hosted Remote Update Audit
on:
  pull_request:
    paths:
      - 'doctrine/selfHostedRemoteUpdatesV1.json'
      - 'host/mcp/luhmUpdateSpine.py'
      - 'host/mcp/luhmHarnessServer.py'
      - 'host/mcp/luhmHarness.py'
      - 'host/harness/fontStack.css'
      - 'host/harness/luhmSigil.svg'
      - 'host/harness/index.html'
      - 'doctrine/firefoxAntennaV1.json'
      - 'plugins/luhm-firefox-antenna/**'
      - 'host/antenna/**'
      - 'tests/testFirefoxAntenna.py'
      - 'host/testBridge/**'
      - 'doctrine/firefoxTestBridgeV1.json'
      - 'tools/firefoxTestBridge2048Audit.py'
      - 'tests/testFirefoxTestBridge.py'
      - 'manual/firefoxTestBridgeSnapshot20261104.md'
      - 'tests/testFirefoxAntennaSigningPreflight.py'
      - 'tools/firefoxAntennaSigningPreflight.py'
      - 'manual/firefoxAntennaFirst20261104.md'
      - 'tests/testSelfHostedRemoteUpdates.py'
      - '.github/workflows/self-hosted-remote-updates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-update-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install pinned test transport
        run: python3 -m pip install 'starlette==0.50.0'
      - name: Verify exact-source v1 and v2
        run: |
          git diff --check
          python3 -m py_compile host/mcp/luhmUpdateSpine.py host/mcp/luhmHarnessServer.py
          python3 -m unittest tests/testLuhmUpdateSpine.py tests/testSelfHostedRemoteUpdates.py -v
          python3 tools/sevenLayerMainAudit.py
      - name: Test Debian / Firefox antenna localhost and policy
        run: |
          python3 -m py_compile host/antenna/luhmLocalAntenna.py
          python3 -m unittest discover -s tests -p testFirefoxAntenna.py -v
      - name: Run local TestBridge consent and SQLite negative tests
        run: |
          python3 -m py_compile host/testBridge/luhmTestBridge.py tools/firefoxTestBridge2048Audit.py
          python3 -m unittest discover -s tests -p testFirefoxTestBridge.py -v
      - name: Collect exact-source 2048 scenario snapshot (no personal records)
        run: |
          python3 tools/firefoxTestBridge2048Audit.py --output-dir build/testBridge2048
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          r=json.loads(Path("build/testBridge2048/snapshot.json").read_text())
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          assert r["sourceRef"] == head and r["passedScenarioAssertions"] == 2048
          assert r["privateRecordsIncluded"] is False and r["crownStatus"] == "STOP"
          print("TESTBRIDGE_SOURCE_MODEL_PASS",head)
          PY
      - name: Save TestBridge source snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: testbridge-2048-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/testBridge2048/snapshot.json
            build/testBridge2048/testBridge2048.bin
          if-no-files-found: warn
          retention-days: 14
      - name: Check tiny shell budget and no silent install
        run: |
          python3 - <<'PY'
          from host.antenna.luhmLocalAntenna import ROOT, make_status
          s = make_status(ROOT)
          assert s["sourceRef"] == "${{ github.event.pull_request.head.sha || github.sha }}"
          assert s["mode"] == "READ_ONLY" and s["updateState"] == "CHECK_ONLY_NO_INSTALL"
          assert s["shellBytes"] <= 100_000_000 and s["crownStatus"] == "STOP"
          print("ANTENNA_SOURCE_GREEN", s["shellBytes"], s["sourceRef"])
          PY
      - name: Test Mozilla signing preflight (no signing, no secrets)
        run: python3 -m unittest discover -s tests -p testFirefoxAntennaSigningPreflight.py -v
      - name: Package reproducible AMO upload ZIP (unsigned)
        run: |
          python3 tools/firefoxAntennaSigningPreflight.py \
            --expected-source-ref "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output-dir build/firefoxAntennaSigning
      - name: Preserve unsigned AMO upload package and source receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firefox-antenna-amo-preflight-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/firefoxAntennaSigning/luhm-firefox-antenna-0.1.0-unsigned.zip
            build/firefoxAntennaSigning/signing-preflight.json
          retention-days: 14
          if-no-files-found: error
