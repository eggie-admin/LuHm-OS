name: Proposed Doctrine Working Lane Audit

on:
  pull_request:
    paths:
      - 'doctrine/**'
      - 'agents/**'
      - 'tools/proposedWorkingLaneAudit.py'
      - '.github/workflows/proposed-working-lane-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate current proposed working lane
        run: python tools/proposedWorkingLaneAudit.py
