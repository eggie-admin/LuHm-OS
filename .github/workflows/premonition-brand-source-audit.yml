name: Premonition Enterprise Brand Source Audit
on:
  pull_request:
    paths:
      - 'doctrine/premonitionEnterpriseBrandV1.json'
      - 'doctrine/organizationBrandRegistryV1.json'
      - 'doctrine/projectChatCanonV1.json'
      - 'tools/prepareFdroidRepoCandidate.py'
      - 'tools/premonitionBrandAudit.py'
      - 'tests/testPremonitionBrandAudit.py'
      - 'manual/premonition-funding-one-pager.md'
      - '.github/workflows/premonition-brand-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brand-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Brand and F-Droid metadata negative checks
        run: |
          python3 -m json.tool doctrine/premonitionEnterpriseBrandV1.json > /dev/null
          python3 -m py_compile tools/premonitionBrandAudit.py tests/testPremonitionBrandAudit.py
          python3 -m unittest discover -s tests -p 'testPremonitionBrandAudit.py' -v
          python3 tools/premonitionBrandAudit.py
          python3 tools/prepareFdroidRepoCandidate.py --self-test
          python3 tools/fdroidTabletSourceAudit.py
      - name: Explicit source-only status
        run: |
          echo "BRAND_SOURCE_ONLY_NO_SIGNED_APK_NO_FDROID_INDEX"
