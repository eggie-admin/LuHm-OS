name: LuHm Godot4 Beta Engine Audit

on:
  workflow_dispatch:
  push:
    branches:
      - 'beta/godot4-engine-hardening-*'
  pull_request:
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/game/**'
      - 'scripts/stageBetaGamePayload.sh'
      - 'assets/registry/**'
      - 'assets/community/**'
      - 'doctrine/GODOT4_BETA_ENGINE_HARDENING_V1.json'
      - 'tools/betaAssetRegistryAudit.py'
      - 'tools/communityAssetAudit.py'
      - 'tools/stageCommunityAssets.py'
      - 'tests/betaEngineHardeningSmoke.gd'
      - '.github/workflows/godot4-beta-engine-audit.yml'

permissions:
  contents: read

jobs:
  beta-engine-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Rights and asset registry audit
        run: |
          set -euo pipefail
          python3 -m json.tool doctrine/GODOT4_BETA_ENGINE_HARDENING_V1.json >/dev/null
          python3 -m json.tool assets/registry/BETA_ASSET_SOURCES_V1.json >/dev/null
          python3 -m json.tool assets/registry/GODOT4_COMMUNITY_CAPABILITY_MAP_V1.json >/dev/null
          python3 tools/betaAssetRegistryAudit.py
      - name: Stage real Cathedral game payload
        run: |
          set -euo pipefail
          chmod +x scripts/stageBetaGamePayload.sh
          scripts/stageBetaGamePayload.sh
      - name: Install pinned Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Headless real-payload engine smoke
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --editor --path . --quit
          "$GODOT" --headless --path . --script tests/betaEngineHardeningSmoke.gd
      - name: Upload beta receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: godot4-beta-engine-audit
          path: |
            build/beta-engine/
            build/community-assets/receipt.json
          if-no-files-found: error
          retention-days: 30
