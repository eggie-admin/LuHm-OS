name: 4x4 Escalation Polish Source Audit
on:
  pull_request:
    paths:
      - 'doctrine/escalationFourByFourPolishV1.json'
      - 'tools/escalationFourByFourPolish.py'
      - 'tests/testEscalationFourByFourPolish.py'
      - 'manual/escalationFourByFourPolish20261116.md'
      - '.github/workflows/escalation-four-by-four-polish-audit.yml'
      - 'doctrine/escalationKernelV1.json'
      - 'tools/escalationKernel.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run 4x4 negative controls
        run: |
          python3 -m unittest tests.testEscalationFourByFourPolish -v
          python3 tools/escalationKernelAudit.py
          python3 tools/architectureRhythmAudit.py
          git diff --check
