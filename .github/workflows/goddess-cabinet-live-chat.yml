name: Full Goddess Chat Cast Source Gate
on:
  pull_request:
    paths:
      - 'doctrine/goddessCabinetLiveChatV1.json'
      - 'manual/goddessCabinetLiveChat.md'
      - 'tools/goddessCabinetLiveChatAudit.py'
      - '.github/workflows/goddess-cabinet-live-chat.yml'
      - 'agents/projectChatBootstrap/SKILL.md'
permissions:
  contents: read
jobs:
  source-cast:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: |
          python3 tools/goddessCabinetLiveChatAudit.py
          python3 -m py_compile tools/goddessCabinetLiveChatAudit.py
