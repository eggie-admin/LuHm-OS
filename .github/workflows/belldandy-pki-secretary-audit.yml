name: Belldandy PKI Secretary Audit

on:
  pull_request:
    paths:
      - "doctrine/belldandyPkiCorporateSecretaryV1.json"
      - "doctrine/corporateEscalationProfileV1.json"
      - "doctrine/cloudflareAirTrafficControllerV1.json"
      - "agents/belldandyQualityOni/SKILL.md"
      - "agents/lum/SKILL.md"
      - "agents/urdMutationOni/SKILL.md"
      - "agents/skuldResearchOni/SKILL.md"
      - "tools/belldandyPkiCorporateSecretaryAudit.py"
      - "tools/certbotWorkspaceSymlinkAudit.py"
      - ".github/workflows/belldandy-pki-secretary-audit.yml"
  push:
    branches:
      - "candidate/**"
    paths:
      - "doctrine/belldandyPkiCorporateSecretaryV1.json"
      - "doctrine/corporateEscalationProfileV1.json"
      - "doctrine/cloudflareAirTrafficControllerV1.json"
      - "agents/belldandyQualityOni/SKILL.md"
      - "agents/lum/SKILL.md"
      - "agents/urdMutationOni/SKILL.md"
      - "agents/skuldResearchOni/SKILL.md"
      - "tools/belldandyPkiCorporateSecretaryAudit.py"
      - "tools/certbotWorkspaceSymlinkAudit.py"
      - ".github/workflows/belldandy-pki-secretary-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run Belldandy PKI corporate secretary audit
        run: python3 tools/belldandyPkiCorporateSecretaryAudit.py
      - name: Check Certbot workspace audit source mode
        run: python3 tools/certbotWorkspaceSymlinkAudit.py
