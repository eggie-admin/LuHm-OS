name: Static Chat Transmogrifier Audit
on:
  pull_request:
    paths:
      - 'doctrine/staticChatTransmogrifierV1.json'
      - 'doctrine/inChatExperienceV1.json'
      - 'host/harness/index.html'
      - 'host/harness/widget.html'
      - 'host/harness/chat-transmogrifier.js'
      - 'host/harness/chat-transmogrifier.css'
      - 'host/mcp/luhmHarness.py'
      - 'tools/staticChatTransmogrifierAudit.py'
      - 'tools/inChatExperienceAudit.py'
      - '.github/workflows/static-chat-transmogrifier-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Static chat contract
        run: python3 tools/staticChatTransmogrifierAudit.py
      - name: JavaScript syntax
        run: node --check host/harness/chat-transmogrifier.js
      - name: Existing in-chat contract
        run: python3 tools/inChatExperienceAudit.py
