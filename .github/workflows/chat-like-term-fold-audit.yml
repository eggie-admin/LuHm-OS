name: Chat Like-Term Fold Audit
on:
  pull_request:
    paths:
      - 'doctrine/chatLikeTermFoldV1.json'
      - 'doctrine/chatProgressStreamV1.json'
      - 'doctrine/providerEconomyV1.json'
      - 'doctrine/projectChatCanonV1.json'
      - 'agents/lum/SKILL.md'
      - 'agents/projectChatBootstrap/SKILL.md'
      - 'tools/chatLikeTermFold.py'
      - 'tools/chatLikeTermFoldAudit.py'
      - '.github/workflows/chat-like-term-fold-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate
        run: |
          python3 -m json.tool doctrine/chatLikeTermFoldV1.json >/dev/null
          python3 -m py_compile tools/chatLikeTermFold.py tools/chatLikeTermFoldAudit.py
          python3 tools/chatLikeTermFoldAudit.py
