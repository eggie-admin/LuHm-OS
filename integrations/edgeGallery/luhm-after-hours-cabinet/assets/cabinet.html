<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuHm After Hours</title>
<style>
:root{color-scheme:dark;background:#111;color:#f4f4f4;font-family:system-ui,sans-serif}
body{margin:0;padding:14px;background:linear-gradient(180deg,#171717,#0d0d0d)}
header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
h1{font-size:16px;margin:0} .badge{font-size:11px;border:1px solid #666;border-radius:999px;padding:2px 7px}
.card{border:1px solid #3b3b3b;border-radius:14px;padding:10px;margin:8px 0;background:#181818}
.name{font-weight:800;font-size:13px;margin-bottom:4px}.line{font-size:14px;line-height:1.35}
.controls{display:flex;gap:8px;margin-top:12px}
button{font:inherit;border:1px solid #777;border-radius:10px;padding:8px 12px;background:#222;color:#fff}
.status{font-size:12px;color:#bbb;margin-top:8px;min-height:1.4em}
</style>
</head>
<body>
<header><h1>👹 LuHm After Hours</h1><span class="badge">local ensemble</span></header>
<div id="cast"></div>
<div class="controls"><button id="play" type="button">▶ Speak Cabinet</button><button id="stop" type="button">■ Stop</button></div>
<div id="status" class="status" role="status" aria-live="polite">Transcript ready.</div>
<script>
(() => {
  "use strict";
  const names={lum:"Lum",urdDoctorGoddess:"Urd",belldandySecretary:"Belldandy",skuldResearch:"Skuld"};
  const profiles={
    lum:{pitch:1.10,rate:1.02},
    urdDoctorGoddess:{pitch:0.88,rate:0.96},
    belldandySecretary:{pitch:1.00,rate:0.90},
    skuldResearch:{pitch:1.18,rate:1.08}
  };
  const status=document.getElementById("status");
  const cast=document.getElementById("cast");
  let turn={speakerSegments:[]};
  try{
    turn=JSON.parse(new URLSearchParams(location.search).get("payload")||"{}");
  }catch(e){status.textContent="Could not parse cabinet payload."}

  const segments=Array.isArray(turn.speakerSegments)?turn.speakerSegments:[];
  for(const segment of segments){
    const card=document.createElement("section"); card.className="card";
    const name=document.createElement("div"); name.className="name"; name.textContent=names[segment.speakerId]||segment.speakerId;
    const line=document.createElement("div"); line.className="line"; line.textContent=String(segment.utterance||"");
    card.append(name,line); cast.append(card);
  }

  function voices(){
    if(!("speechSynthesis" in window)) return [];
    return window.speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang||""));
  }

  function speakAt(index){
    if(index>=segments.length){status.textContent="Cabinet finished.";return;}
    const segment=segments[index];
    const synth=window.speechSynthesis;
    const utterance=new SpeechSynthesisUtterance(String(segment.utterance||""));
    const pool=voices();
    if(pool.length) utterance.voice=pool[index%pool.length];
    const profile=profiles[segment.speakerId]||{pitch:1,rate:1};
    utterance.pitch=profile.pitch; utterance.rate=profile.rate;
    status.textContent=(names[segment.speakerId]||segment.speakerId)+" speaking…";
    utterance.onend=()=>speakAt(index+1);
    utterance.onerror=()=>{status.textContent="Device speech failed; transcript remains available.";};
    synth.speak(utterance);
  }

  document.getElementById("play").addEventListener("click",()=>{
    if(!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)){
      status.textContent="This Edge Gallery webview does not expose device speech. Transcript only.";
      return;
    }
    window.speechSynthesis.cancel();
    speakAt(0);
  });
  document.getElementById("stop").addEventListener("click",()=>{
    if("speechSynthesis" in window) window.speechSynthesis.cancel();
    status.textContent="Stopped.";
  });
  if("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged=()=>voices();
})();
</script>
</body>
</html>
