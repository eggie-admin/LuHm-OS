policy: "AI proposes. Policy authorizes. CI proves. Human promotes."
composition:
  - coreLibrary
  - pluginExtension
  - classWidgetOrganization
  - stubAdapterBoundary
rhythm: [hear, resolve, act, verify]
escalation: [0, 1, 2, 3]
profiles:
