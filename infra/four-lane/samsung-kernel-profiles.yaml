    install: false
    firmware: DENY
    deviceAuthority: NONE
protected:
  - Samsung OEM Android boot chain and Knox
  - verified GRUB recovery menu and EFI/boot state
  - GParted partitions and personal disks
  - ASRock/ASUS vendor UEFI without exact board identity
  - production secrets and paid AI billing
  - all 15 quarantined AI workers
  - public DNS and device update channels
benchmarks:
  - Android cold startup TTID and TTFD
  - frame pacing p50 p95 and jank
  - thermal and battery energy
  - USB host power and six-camera V4L2 jitter
  - Blender render seconds and memory peak
  - OpenVINO CPU baseline, GPU only after driver proof
defaultDeployment: DENY
crownStatus: STOP
