# Linux LAN companion or localhost-only sandbox, NOT an Android/WebView app.
# No public DHCP, DNS or outbound listener. Requires explicit Linux host setup.
port=5353
listen-address=127.0.0.1
bind-interfaces
no-resolv
no-hosts
domain-needed
bogus-priv
server=/vm.luhm.test/127.0.0.1#53
cache-size=128
